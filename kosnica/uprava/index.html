/* TipTap suite — zajednički stil (rezervacije, admin, grupa). Boje lokala dolaze iz :root varijabli. */
:root{
  color-scheme:dark;
  --bg:#12100e;--card:#211d19;--card2:#2b2621;
  --gold:#d4ae5a;--gold2:#f2c872;--amber:#ff9f2e;--text:#f6f0e5;--muted:#b8ad99;--dim:#8a8070;
  --gold-rgb:212,174,90;--gold2-rgb:242,200,114;--amber-rgb:255,159,46;--bg-rgb:18,16,14;
  --line:rgba(var(--gold-rgb),.22);
  --ok:#8fd19e;--warn:#f4bf52;--bad:#ff8a7a;--blue:#8ab8ff;--ink:#1a1409;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 50% at 50% -10%,rgba(var(--amber-rgb),.12),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 64px),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--gold2)}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:10px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(14px,env(safe-area-inset-top)) 0 8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);min-width:0}
.brand svg{width:52px;height:38px;flex:none;color:var(--gold2);filter:drop-shadow(0 0 8px rgba(var(--amber-rgb),.35))}
.brand.wm svg{width:auto;height:30px;max-width:150px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.05em;text-transform:uppercase;line-height:1;white-space:nowrap}
.brand small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1.title{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;letter-spacing:.03em;text-transform:uppercase;margin:14px 0 4px;background:linear-gradient(180deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);margin:0 0 14px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(0,0,0,.25);flex:none}
.lang button{min-width:44px;height:40px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid rgba(255,255,255,.05);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 24px -18px #000}
.card h2{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.card h2 .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--ink);font-family:var(--f-body);font-size:14px;letter-spacing:0;flex:none}
.lbl{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:16px 0 8px}
.lbl:first-child{margin-top:0}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.row::-webkit-scrollbar{display:none}
.wrapx{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-weight:700;font-size:15px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.18s;white-space:nowrap}
.chip small{font-weight:500;color:var(--muted);font-size:12px}
.chip.day{flex-direction:column;gap:0;min-width:62px;height:66px;padding:0 10px;line-height:1.15}
.chip.day small{text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.chip[aria-pressed=true]{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink);border-color:transparent;box-shadow:0 0 16px rgba(var(--gold2-rgb),.35)}
.chip[aria-pressed=true] small{color:rgba(0,0,0,.6)}
.chip:disabled{opacity:.32;cursor:not-allowed;text-decoration:line-through}
.chip.day:disabled{text-decoration:none}
.chip.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:11px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:56px;height:56px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-size:28px;font-weight:700;color:var(--gold2)}
.stepper button:disabled{opacity:.3}
.stepper output{min-width:90px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1}
.stepper output small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=password],input[type=time],input[type=search],select,textarea{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font-size:16px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.15)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);cursor:pointer;margin-top:14px}
.check input{width:24px;height:24px;flex:none;accent-color:var(--gold);margin:0}
.btn{min-height:56px;padding:0 20px;border-radius:16px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink);border:0;box-shadow:0 8px 24px -10px rgba(var(--gold2-rgb),.6)}
.btn.ok{background:#2f5a3a;border-color:#4f8a5d;color:#dff5e3}
.btn.bad{background:#5a2f2f;border-color:#8a4f4f;color:#ffe0dc}
.btn.wa{background:#1f7a4a;border-color:#2aa760;color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.xs{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.small{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.st-pending,.st-new{background:rgba(255,159,46,.16);color:#ffc47a}
.st-confirmed,.st-done{background:rgba(143,209,158,.16);color:var(--ok)}
.st-seated,.st-ack{background:rgba(138,184,255,.16);color:var(--blue)}
.st-declined,.st-cancelled,.st-noshow,.st-skip{background:rgba(255,138,122,.14);color:var(--bad)}
.st-done.grey{background:rgba(255,255,255,.08);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:150;pointer-events:none;transform:translate(-50%,160%);opacity:0;background:var(--card2);color:var(--text);padding:12px 18px;border-radius:14px;border:1px solid var(--line);font-weight:600;font-size:14px;transition:.35s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold2);animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.demo-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--gold2);border-radius:999px;padding:3px 9px}

/* ---------- tlocrt ---------- */
.planbox{position:relative;margin:0 -16px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding:0 16px 6px;scrollbar-width:thin}
.planbox svg{display:block;width:100%;min-width:580px;height:auto;border-radius:18px}
.plan{--pl-free:var(--gold2)}
.plan .pl-top{fill:var(--pl-table,#3b3129);stroke:none;transition:fill .25s}
.plan .pl-ring{stroke:#6b5e50;stroke-width:3;transition:stroke .25s}
.plan .pl-halo,.plan .pl-alert{opacity:0;transition:opacity .3s;pointer-events:none}
.plan .pl-label{fill:var(--text);font:800 21px var(--f-body);pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:4px;stroke-linejoin:round}
.plan .pl-sub{fill:var(--muted);font:700 13.5px var(--f-body);pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:4px;stroke-linejoin:round}
.plan .pl-vip{fill:var(--gold2);font:800 13px var(--f-body);letter-spacing:.1em;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:4px}
.plan .pl-vip.in{font-size:16px;letter-spacing:0}
.plan .pl-wlabel{fill:var(--pl-label,#c9b894);font:800 18px var(--f-display);letter-spacing:.2em;pointer-events:none}
.plan .pl-wlabel.pl-small{font-size:14px;letter-spacing:.12em}
.plan .pl-wlabel.pl-door{fill:#bfe3c8;font-size:15px}
.plan .pl-dlabel{fill:rgba(255,255,255,.55);font-size:22px;letter-spacing:.3em}
.plan .pl-alabel{fill:var(--pl-label,#c9b894);opacity:.75;font:800 14px var(--f-display);letter-spacing:.24em;pointer-events:none}
.plan .pl-river{fill:rgba(255,255,255,.55);font:italic 800 22px var(--f-display);letter-spacing:.4em;pointer-events:none}
.plan .pl-t{cursor:pointer;outline:none}
.plan .pl-t .pl-chair{transition:fill .25s,stroke .25s}
.plan .pl-t.free .pl-ring{stroke:var(--gold2)}
.plan .pl-t.free .pl-top{fill:var(--pl-free-top,#4a3a28)}
.plan .pl-t.free .pl-halo{opacity:.35}
.plan .pl-t.free .pl-chair{stroke:rgba(var(--gold2-rgb),.55)}
.plan .pl-t.sel .pl-ring{stroke:#fff;stroke-width:5}
.plan .pl-t.sel .pl-top{fill:var(--gold)}
.plan .pl-t.sel .pl-chair{fill:rgba(var(--gold2-rgb),.35);stroke:#fff}
.plan .pl-t.sel .pl-label{fill:var(--ink);stroke:none}.plan .pl-t.sel .pl-sub{fill:rgba(0,0,0,.7);stroke:none}
.plan .pl-t.sel .pl-halo{opacity:1;animation:halo 1.6s ease-in-out infinite}
@keyframes halo{50%{opacity:.55}}
.plan .pl-t.busy,.plan .pl-t.nofit{cursor:not-allowed}
.plan .pl-t.busy .pl-top{fill:#2a2522}.plan .pl-t.busy .pl-ring{stroke:#5a3030;stroke-dasharray:6 6}
.plan .pl-t.busy .pl-label,.plan .pl-t.nofit .pl-label{fill:#7b7268}
.plan .pl-t.busy .pl-chair{opacity:.5}
.plan .pl-t.nofit{opacity:.42}
.plan .pl-t.pending .pl-top{fill:#5a3d16}.plan .pl-t.pending .pl-ring{stroke:var(--amber)}
.plan .pl-t.confirmed .pl-top{fill:#24452d}.plan .pl-t.confirmed .pl-ring{stroke:var(--ok)}
.plan .pl-t.seated .pl-top{fill:#223452}.plan .pl-t.seated .pl-ring{stroke:var(--blue)}
.plan .pl-t.seated .pl-chair{fill:#2b3b57}
.plan .pl-t.alert .pl-alert{opacity:1;animation:alertp 1.1s ease-in-out infinite}
.plan .pl-t.alert .pl-ring{stroke:#ff6a5e;stroke-width:5}
.plan .pl-badge{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes alertp{50%{opacity:.35}}
@keyframes bob{50%{transform:scale(1.15)}}
.plan .pl-t:focus-visible .pl-ring{stroke:#fff;stroke-width:5}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:10px 0 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:2px solid}
.lg-free{border-color:var(--gold2);background:var(--pl-free-top,#4a3a28)}.lg-busy{border-color:#5a3030;background:#2a2522;border-style:dashed!important}.lg-sel{border-color:#fff;background:var(--gold)}.lg-nofit{border-color:#6b5e50;background:#3b3129;opacity:.5}
.lg-pending{border-color:var(--amber);background:#5a3d16}.lg-confirmed{border-color:var(--ok);background:#24452d}.lg-seated{border-color:var(--blue);background:#223452}.lg-alert{border-color:#ff6a5e;background:#ff5a4e}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.armed{outline:2px solid var(--bad)!important;outline-offset:2px}

:root{--bg:#100c08;--card:#1d1610;--card2:#271d14;--gold:#f2a93b;--gold2:#ffd27a;--amber:#e5533a;--text:#f4e8d0;--muted:#c7b596;--dim:#8f7f66;--ink:#1a1204;--gold-rgb:242,169,59;--gold2-rgb:255,210,122;--amber-rgb:229,83,58;--bg-rgb:16,12,8;--f-display:"Fraunces",Georgia,serif;--pl-floor:#17110b;--pl-grid:#1e170f;--pl-edge:#3a2c1c;--pl-wood:#3b2614;--pl-wood2:#4b321b;--pl-trim:#f2a93b;--pl-table:#3b2d1f;--pl-chair:#2a2017;--pl-chair-edge:#4d3b28;--pl-sofa:#5c2a1c;--pl-sofa2:#8e4a2a;--pl-glow:#ffbf47;--pl-label:#e6c98f;--pl-area:rgba(242,169,59,.04);--pl-area-edge:rgba(242,169,59,.4);--pl-stage:#3d2a14;--pl-free-top:#4a3820;--pl-dance:#e5533a;--pl-dance2:#ffd27a;--pl-dj:#2b2116}
.brand b{text-transform:none;letter-spacing:0;font-weight:700}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.app{min-height:100vh}
/* ---- bočni izbornik (široki ekran) ---- */
.side{display:none}
.mbar{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 16px 4px}
.mbar .sb{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.mbar svg{height:30px;width:auto;max-width:120px;color:var(--gold2);flex:none}
.mbar b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.livedot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.livedot i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:bl 2s infinite}
@keyframes bl{50%{opacity:.3}}
.hdr{position:sticky;top:0;z-index:30;background:rgba(var(--bg-rgb),.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(var(--gold-rgb),.12)}
.hdr .in{max-width:1180px;margin:0 auto;padding:8px 16px}
.dnav{display:flex;align-items:center;gap:8px}
.dnav .arrow{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);font-size:22px;color:var(--gold2);flex:none}
.dnav .dl{flex:1;text-align:center;min-width:0}
.dnav .dl b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.dnav .dl small{color:var(--muted);font-size:13px}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-top:6px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:52px;height:58px;border-radius:12px;background:var(--card);border:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);position:relative;line-height:1.2}
.strip button b{font-size:16px;color:var(--text)}
.strip button[aria-pressed=true]{background:var(--gold);color:rgba(0,0,0,.65)}.strip button[aria-pressed=true] b{color:var(--ink)}
.strip .bdg{position:absolute;top:-6px;right:-5px;min-width:20px;height:20px;border-radius:999px;background:var(--amber);color:#160a04;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 10px rgba(var(--amber-rgb),.6)}
.strip .cnt{font-size:10px;color:inherit;opacity:.8}
.content{max-width:1180px;margin:0 auto;padding:0 16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(var(--bg-rgb),.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px)}
.tabs button{flex:1;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--dim);position:relative}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-pressed=true]{color:var(--gold2)}
.tabs .plus{color:var(--ink)}.tabs .plus span.o{width:52px;height:52px;border-radius:18px;background:linear-gradient(180deg,var(--gold2),var(--gold));display:grid;place-items:center;font-size:30px;font-weight:700;margin-top:-18px;box-shadow:0 8px 20px -6px rgba(var(--gold2-rgb),.6)}
.nb{position:absolute;top:8px;left:calc(50% + 6px);min-width:19px;height:19px;border-radius:999px;background:#ff5a4e;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 10px rgba(255,90,78,.6)}
.nb:empty{display:none}
@media (min-width:780px){
  body{padding-bottom:0}
  .app{display:grid;grid-template-columns:212px minmax(0,1fr)}
  .main{min-width:0}
  .savebar{bottom:12px!important}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid rgba(var(--gold-rgb),.14);background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.05));padding:16px 10px}
  .side .sb{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .side .sb svg{height:34px;width:auto;max-width:90px;color:var(--gold2);flex:none;filter:drop-shadow(0 0 8px rgba(var(--amber-rgb),.3))}
  .side .sb b{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.05em;text-transform:uppercase;line-height:1.05;display:block}
  .side .sb small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .side nav{display:flex;flex-direction:column;gap:3px}
  .side nav button{display:flex;align-items:center;gap:11px;height:44px;padding:0 12px;border-radius:12px;font-weight:700;font-size:14.5px;color:var(--muted);position:relative;text-align:left}
  .side nav button svg{width:20px;height:20px;flex:none}
  .side nav button:hover{background:rgba(255,255,255,.04);color:var(--text)}
  .side nav button[aria-pressed=true]{background:rgba(var(--gold2-rgb),.12);color:var(--gold2)}
  .side nav .nb{position:static;margin-left:auto}
  .side nav .newb{margin:6px 0 10px;justify-content:center;background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink)}
  .side .sf{margin-top:auto;display:grid;gap:8px;padding:8px}
  .side .sf button{color:var(--dim);font-size:13px;text-align:left}
  .mbar,.tabs{display:none}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
  .two>.stick{position:sticky;top:150px}
  .planbox.inline{margin:0;padding:0}
  .planbox.inline svg{min-width:0}
}
@media (max-width:779px){.two>.stick{display:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--card);border-radius:14px;padding:10px 12px;border:1px solid rgba(255,255,255,.04)}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stat.hot{background:rgba(var(--amber-rgb),.15)}
.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.res{background:linear-gradient(180deg,var(--card2),var(--card));border-radius:18px;padding:14px;margin:0 0 10px;border:1px solid rgba(255,255,255,.05);border-left:4px solid transparent;transition:box-shadow .4s}
.res.pending{border-left-color:var(--amber);box-shadow:0 0 0 1px rgba(var(--amber-rgb),.25)}
.res.confirmed{border-left-color:var(--ok)}.res.seated{border-left-color:var(--blue)}
.res.dimmed{opacity:.55}
.res.flash{animation:flash 1.6s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 3px var(--gold2),0 0 30px rgba(var(--gold2-rgb),.5)}}
.res .h{display:flex;align-items:flex-start;gap:12px}
.res .tm{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;min-width:66px}
.res .who{flex:1;min-width:0}
.res .who b{font-size:17px;display:block;line-height:1.25;word-break:break-word}
.res .meta{font-size:14px;color:var(--muted)}
.res .meta .tb{color:var(--gold2);font-weight:800}
.res .note{margin-top:8px;font-size:14px;background:rgba(0,0,0,.25);border-radius:10px;padding:8px 10px}
.res .pre{margin-top:8px;font-size:14px;border-radius:10px;padding:8px 10px;background:rgba(var(--gold2-rgb),.1);border:1px solid rgba(var(--gold2-rgb),.3)}
.res .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.res .acts .btn{flex:1 1 0;min-width:0;white-space:nowrap;padding-left:10px;padding-right:10px}
.res .contact{display:flex;flex-direction:column;gap:6px}
.res .contact a{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06);text-decoration:none;font-size:20px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;font-family:var(--f-display);font-size:24px;color:var(--text);letter-spacing:.05em;text-transform:uppercase}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:92vh;max-height:92dvh;overflow-y:auto;background:linear-gradient(180deg,var(--card2),var(--bg));border-radius:24px 24px 0 0;border-top:1px solid var(--line);box-shadow:0 -20px 60px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .38s var(--ease);padding:8px 16px calc(24px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.sheet.on{transform:none}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(5,4,3,.6);opacity:0;visibility:hidden;transition:.3s}.scrim.on{opacity:1;visibility:visible}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px;gap:10px}
.sheet .sh h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.05em;text-transform:uppercase}
.sheet .x{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.06);font-size:20px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login{max-width:380px;margin:12vh auto 0;text-align:center;padding:0 16px}
.login svg{height:70px;width:auto;max-width:200px;color:var(--gold2);margin:0 auto 12px;display:block}
.login input{text-align:center;font-size:28px;letter-spacing:.4em;height:64px}
.timebar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px 0 12px}
.timebar::-webkit-scrollbar{display:none}
.hrow{display:grid;grid-template-columns:64px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.hrow b{font-size:14px}

/** Atomarna izmjena dokumenta (optimistic concurrency, 6 pokušaja). fn(doc) mijenja doc ili vraća {error}. */
async function mutate(store, key, empty, fn) {
  for (let i = 0; i < 6; i++) {
    const r = await store.getJSON(key);
    const doc = r?.data ?? (typeof empty === 'function' ? empty() : structuredClone(empty));
    const res = await fn(doc);
    if (res && res.error) return res;
    if (res && res.noop) return res;
    const ok = await store.setJSON(key, doc, r?.etag ?? 'new');
    if (ok) return res || { ok: true };
    await wait(30 + Math.random() * 90);
  }
  return { error: 'busy', status: 503 };
}
async function read(store, key, empty) { const r = await store.getJSON(key); return r?.data ?? structuredClone(empty); }

async function getConfig(store) {

}
function publicConfig(cfg) {
  const { venue, forms, phone, plan, zones, tables, hours, slotMinutes, durationMinutes, leadMinutes, daysAhead, maxParty, holdMinutes, closedDates, rules, autoConfirm, features } = cfg;

function slotsFor(cfg, date) {
  if ((cfg.closedDates || []).includes(date)) return [];
  const h = cfg.hours[weekday(date)];
  if (!h) return [];
  const from = toMin(h.from); let to = toMin(h.to);
  if (to < from) to += 1440;
  const out = [];
  for (let m = from; m <= to; m += cfg.slotMinutes) out.push(m);
  return out;
}
const ACTIVE = new Set(['pending', 'confirmed', 'seated']);
const overlaps = (a0, a1, b0, b1) => a0 < b1 && b0 < a1;
function tableFree(cfg, list, tableId, start, ignoreId) {
  const end = start + cfg.durationMinutes;
  return !list.some(r => r.tableId === tableId && ACTIVE.has(r.status) && r.id !== ignoreId && overlaps(start, end, r.start, r.end));
}
const fits = (t, party) => party >= (t.min || 1) && party <= t.max;
function bestTable(cfg, list, party, start) {
  return cfg.tables.filter(t => fits(t, party) && tableFree(cfg, list, t.id, start))
    .sort((a, b) => (a.max - b.max) || ((a.vip ? 1 : 0) - (b.vip ? 1 : 0)))[0] || null;
}
function cleanPhone(p) {
  let s = String(p || '').replace(/[^\d+]/g, '');
  if (s.startsWith('00')) s = '+' + s.slice(2);
  if (s.startsWith('0')) s = '+381' + s.slice(1);
  if (!s.startsWith('+')) s = '+' + s;
  return /^\+\d{8,15}$/.test(s) ? s : null;
}
const dayKey = d => `res/${d}`;
async function readDay(store, date) { const r = await store.getJSON(dayKey(date)); return { list: r?.data || [], etag: r?.etag || null }; }
const mutateDay = (store, date, fn) => mutate(store, dayKey(date), [], fn);
async function setIndex(store, id, date) { await store.setJSON(`idx/${id}`, { date }, null); }
async function findDate(store, id) { const r = await store.getJSON(`idx/${id}`); return r?.data?.date || null; }

/** Narudžba boca uz rezervaciju: [{id, name, vol, eur, qty}] (cijene iz cjenika; potvrđuje osoblje). */
function cleanPreorder(list) {
  if (!Array.isArray(list)) return [];
  return list.slice(0, 8).map(x => ({ id: str(x.id, 80), name: str(x.name, 80), vol: str(x.vol, 16), eur: num(x.eur, 0, 1000000) ?? 0, qty: Math.floor(num(x.qty, 1, 10) ?? 1) }))
    .filter(x => x.name);
}
const preorderTotal = r => (r.preorder || []).reduce((a, x) => a + x.eur * x.qty, 0);

async function availability(store, date) {
  const cfg = await getConfig(store);
  const { list } = await readDay(store, date);
  const now = zagrebNow();
  let slots = slotsFor(cfg, date);
  if (date === now.date) slots = slots.filter(m => m >= now.min + cfg.leadMinutes);
  const busy = list.filter(r => ACTIVE.has(r.status)).map(r => ({ t: r.tableId, s: r.start, e: r.end }));
  return { date, slots, busy, config: publicConfig(cfg), today: now.date };
}
async function createReservation(store, body, { admin = false } = {}) {
  const cfg = await getConfig(store);
  if (!admin && cfg.features?.reservations === false) return { error: 'off', status: 403 };
  if (body.hp) return { error: 'spam', status: 400 };
  const date = str(body.date, 10);
  if (!isDate(date)) return { error: 'date', status: 400 };
  const now = zagrebNow();
  const party = Math.floor(Number(body.party));
  if (!(party >= 1 && party <= (admin ? 60 : cfg.maxParty))) return { error: 'party', status: 400 };
  const start = Math.floor(Number(body.start));
  const name = str(body.name, 80);
  const phoneRaw = str(body.phone, 30);
  const phone = cleanPhone(phoneRaw);
  const email = str(body.email, 120);
  if (!name || name.length < 2) return { error: 'name', status: 400 };
  if (!admin && !phone) return { error: 'phone', status: 400 };
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { error: 'email', status: 400 };
  if (!admin) {
    if (!body.consent) return { error: 'consent', status: 400 };
    const last = addDays(now.date, cfg.daysAhead);
    if (date < now.date || date > last) return { error: 'date', status: 400 };
    if (!slotsFor(cfg, date).includes(start)) return { error: 'time', status: 400 };
    if (date === now.date && start < now.min + cfg.leadMinutes) return { error: 'time', status: 400 };
  } else if (!(start >= 0 && start < 2880)) return { error: 'time', status: 400 };
  const preorder = cfg.features?.preorder ? cleanPreorder(body.preorder) : [];

  const res = await mutateDay(store, date, list => {
    let table = null;
    if (body.tableId && body.tableId !== 'any') {
      table = cfg.tables.find(t => t.id === body.tableId);
      if (!table) return { error: 'table', status: 400 };
      if (!admin && !fits(table, party)) return { error: 'fit', status: 409 };
      if (!tableFree(cfg, list, table.id, start)) return { error: 'taken', status: 409 };
    } else {
      table = bestTable(cfg, list, party, start);
      if (!table) return { error: 'full', status: 409 };
    }
    const at = isoNow();
    const r = {
      id: token(8), code: shortCode(), key: token(16),
      date, start, end: start + cfg.durationMinutes, party, tableId: table.id,
      name, phone: phone || phoneRaw, email, note: str(body.note, 400), occasion: str(body.occasion, 30),
      preorder, sparkler: !!(preorder.length && body.sparkler),
      lang: body.lang === 'en' ? 'en' : 'hr',
      status: admin ? (['pending', 'confirmed', 'seated', 'done', 'noshow'].includes(body.status) ? body.status : 'confirmed') : (cfg.autoConfirm ? 'confirmed' : 'pending'),
      source: admin ? str(body.source || 'staff', 20) : 'web',
      createdAt: body._at && admin ? str(body._at, 30) : at, updatedAt: at, history: []
    };
    list.push(r);
    return { ok: true, reservation: r, table };
  });
  if (res.ok) await setIndex(store, res.reservation.id, date);
  return res;
}
const guestView = r => ({ id: r.id, code: r.code, date: r.date, start: r.start, end: r.end, party: r.party, tableId: r.tableId, name: r.name, status: r.status, note: r.note, occasion: r.occasion, lang: r.lang, preorder: r.preorder || [], sparkler: !!r.sparkler });

  return { ok: true, reservation: guestView(r), table: cfg.tables.find(t => t.id === r.tableId) || null, config: publicConfig(cfg), notice };

async function adminUpdate(store, body) {
  const cfg = await getConfig(store);
  const id = str(body.id, 40);
  const date = await findDate(store, id);
  if (!date) return { error: 'notfound', status: 404 };
  const STAT = ['pending', 'confirmed', 'declined', 'cancelled', 'seated', 'done', 'noshow'];
  let moved = null;
  const res = await mutateDay(store, date, list => {
    const r = list.find(x => x.id === id);
    if (!r) return { error: 'notfound', status: 404 };
    const before = r.status;
    if (body.status) { if (!STAT.includes(body.status)) return { error: 'status', status: 400 }; r.status = body.status; }
    if (body.tableId && body.tableId !== r.tableId) {
      if (!cfg.tables.find(t => t.id === body.tableId)) return { error: 'table', status: 400 };
      if (ACTIVE.has(r.status) && !tableFree(cfg, list, body.tableId, r.start, r.id)) return { error: 'taken', status: 409 };
      r.tableId = body.tableId;
    }
    if (body.start != null && Number(body.start) !== r.start) {
      const s = Math.floor(Number(body.start)); if (!(s >= 0 && s < 2880)) return { error: 'time', status: 400 };
      if (ACTIVE.has(r.status) && !tableFree(cfg, list, r.tableId, s, r.id)) return { error: 'taken', status: 409 };
      r.start = s; r.end = s + cfg.durationMinutes;
    }
    if (body.party != null) { const p = Math.floor(Number(body.party)); if (p >= 1 && p <= 60) r.party = p; }
    if (body.staffNote != null) r.staffNote = str(body.staffNote, 400);
    if (body.date && body.date !== date) moved = str(body.date, 10);
    r.updatedAt = isoNow();
    r.history.push({ at: r.updatedAt, by: 'staff', from: before, to: r.status });
    return { ok: true, reservation: r, changedStatus: before !== r.status };
  });
  if (res.ok && moved && isDate(moved)) {
    const r = res.reservation;
    const add = await mutateDay(store, moved, list => {
      if (ACTIVE.has(r.status) && !tableFree(cfg, list, r.tableId, r.start, r.id)) return { error: 'taken', status: 409 };
      list.push({ ...r, date: moved }); return { ok: true };
    });
    if (add.error) return add;
    await mutateDay(store, date, list => { const i = list.findIndex(x => x.id === r.id); if (i >= 0) list.splice(i, 1); return { ok: true }; });
    await setIndex(store, r.id, moved);
    res.reservation = { ...r, date: moved };
  }
  return res;
}
async function adminSaveConfig(store, cfgIn) {

const LIVE_KINDS = ['call', 'bill', 'order', 'song'];
const liveKey = d => `live/${d}`;
const OPEN = new Set(['new', 'ack']);
async function liveCreate(store, body) {
  const cfg = await getConfig(store);
  const kind = str(body.kind, 10);
  if (!LIVE_KINDS.includes(kind)) return { error: 'kind', status: 400 };
  if (kind === 'song' && !cfg.features?.songs) return { error: 'kind', status: 400 };
  if (kind === 'order' && cfg.features?.orders === false) return { error: 'kind', status: 400 };
  if (kind === 'bill' && cfg.features?.bill === false) return { error: 'kind', status: 400 };
  if (!cfg.features?.tableMode) return { error: 'off', status: 403 };
  const table = str(body.table, 8).replace(/[^\w-]/g, '');
  if (!table && kind !== 'song') return { error: 'table', status: 400 };
  const b = bizNow();
  const item = { id: token(6), k: token(10), kind, table, status: 'new', createdAt: isoNow(), lang: body.lang === 'en' ? 'en' : 'hr' };
  if (kind === 'bill') item.pay = ['card', 'cash'].includes(body.pay) ? body.pay : '';
  if (kind === 'order') {
    const items = Array.isArray(body.items) ? body.items.slice(0, 25).map(x => ({ id: str(x.id, 80), n: str(x.n, 80), v: str(x.v, 24), q: Math.floor(num(x.q, 1, 20) ?? 1), e: num(x.e, 0, 1000000) ?? 0 })).filter(x => x.n) : [];
    if (!items.length) return { error: 'items', status: 400 };
    item.items = items; item.total = Math.round(items.reduce((a, x) => a + x.q * x.e, 0) * 100) / 100;
  }
  if (kind === 'song') {
    item.song = { title: str(body.title, 80), artist: str(body.artist, 60), ded: str(body.ded, 120) };
    if (item.song.title.length < 2) return { error: 'title', status: 400 };
  }
  item.note = str(body.note, 200);
  return mutate(store, liveKey(b.date), [], list => {
    const open = list.filter(x => OPEN.has(x.status) && x.table === table);
    if ((kind === 'call' || kind === 'bill') && table) {
      const dup = open.find(x => x.kind === kind && Date.now() - Date.parse(x.createdAt) < 20 * 60e3);
      if (dup) {
        // isti stol već čeka konobara: novi razlog (npr. "Kombo: Silver Goose") dopiše se postojećem pozivu
        if (item.note && !(dup.note || '').includes(item.note)) { dup.note = str((dup.note ? dup.note + ' · ' : '') + item.note, 200); dup.updatedAt = isoNow(); return { ok: true, dup: true, id: dup.id, k: dup.k, item: dup }; }
        return { ok: true, noop: true, dup: true, id: dup.id, k: dup.k, item: dup };
      }
    }
    if (open.length >= 12) return { error: 'limit', status: 429 };
    if (kind === 'song' && list.filter(x => x.kind === 'song' && x.status === 'new' && x.table === table).length >= 3) return { error: 'limit', status: 429 };
    list.push(item);
    if (list.length > 600) list.splice(0, list.length - 600);
    return { ok: true, id: item.id, k: item.k, item };
  });
}

    M.forEach(r=>r.forEach(c=>{if(c)dark++;}));const t=size*size;p+=Math.max(0,Math.ceil(Math.abs(dark*20-t*10)/t)-1)*10;return p;};
  let best=0,bestP=Infinity;for(let m=0;m<8;m++){applyMask(m);drawFormat(m);const p=penalty();if(p<bestP){bestP=p;best=m;}applyMask(m);}
  applyMask(best);drawFormat(best);
  return M;
}
if(typeof module!=='undefined')module.exports=qrMatrix;

function renderList(){

function tableSheet(t){
  const rs=S.list.filter(r=>r.tableId===t.id).sort((a,b)=>a.start-b.start);
  const lv=S.date===S.liveDate?S.live.filter(x=>x.table===t.id&&(x.status==='new'||x.status==='ack')):[];
  const zone=(S.cfg.zones.find(z=>z.id===t.zone)||{name:{hr:''}}).name.hr;
  openSheet(shHead(`Sto ${esc(t.id)}`)+`<p class="small">${esc(zone)} · ${t.min}–${t.max} os.${t.vip?' · ★ VIP':''}</p>`+(lv.length?`<div class="sec"><span>Uživo za ovim stolom</span></div>${lv.map(liveCard).join('')}`:'')+(rs.length?rs.map(resCard).join(''):'<div class="empty">Sto je slobodan celo veče.</div>')+`<button class="btn gold block" data-newfor="${esc(t.id)}">+ Rezerviši ovaj sto</button>`);
}
function freeAt(tid,start,ignore){const e=start+S.cfg.durationMinutes;return !S.list.some(r=>r.tableId===tid&&ACTIVE.includes(r.status)&&r.id!==ignore&&start<r.end&&r.start<e)}
function tableOptions(sel,start,party,ignore){return S.cfg.tables.map(t=>{const ok=freeAt(t.id,start,ignore);const fit=!party||(party>=t.min&&party<=t.max);return `<option value="${esc(t.id)}" ${t.id===sel?'selected':''}>${esc(t.id)} · ${t.min}–${t.max} os.${ok?'':' · ZAUZET'}${fit?'':' · ne odgovara'}</option>`}).join('')}
function timeOptions(sel){const s=[...new Set([...(S.slots.length?S.slots:[]),sel].filter(x=>x!=null))].sort((a,b)=>a-b);return s.map(m=>`<option value="${m}" ${m===sel?'selected':''}>${fmt(m)}</option>`).join('')}
function anyTimeOptions(){let h='<option value="">Drugo vreme…</option>';for(let m=420;m<=1800;m+=15)h+=`<option value="${m}">${fmt(m)}${m>=1440?' (iza ponoći)':''}</option>`;return h}

function demoGuest(r,msg){const mine=TT.myRes().find(m=>m.id===r.id);let href=mine&&mine.k?TT.keepClock(TT.url(V.venue,'rezervacije/')+'?r='+encodeURIComponent(r.id)+'&k='+encodeURIComponent(mine.k)):null;
  if(!href){const m=/(https?:\/\/\S*?rezervacije\/\?r=[^\s]+)/.exec(msg||'');if(m)href=TT.keepClock(m[1].replace(/[.,)]+$/,''));}
  return `<div class="demo-note"><b>Demo:</b> gost je ovu poruku upravo dobio na telefon. U pravom sistemu jednim dodirom otvara se WhatsApp s gotovim tekstom.${href?`<a class="btn gold block" style="margin-top:10px" href="${esc(href)}">📱 Pogledajte kako to vidi gost</a>`:''}</div>`}

     ${DEMO?demoGuest(r,x.msg):(r.email?'<p class="small">E-mail gostu šalje se automatski.</p>':'')}

/* ---------- uživo: konobar, račun, narudžbe ---------- */
function liveCard(x){
  const k=KIND[x.kind]||['•',x.kind];
  let body='';
  if(x.kind==='order')body=`<ul>${(x.items||[]).map(i=>`<li><span>${i.q}× ${esc(i.n)} <span class="small">${esc(i.v||'')}</span></span><b>${money(i.q*i.e)}</b></li>`).join('')}</ul><div class="tot"><span>Ukupno</span><span>${money(x.total)}</span></div>`;
  if(x.kind==='song')body=`<div class="song">${esc(x.song.title)}<small>${esc(x.song.artist||'')}</small></div>${x.song.ded?`<div class="ded">💌 ${esc(x.song.ded)}</div>`:''}`;
  if(x.kind==='bill'&&x.pay)body=`<div class="small" style="margin-top:4px">Plaćanje: <b style="color:var(--text)">${x.pay==='card'?'💳 karticom':'💶 gotovinom'}</b></div>`;
  if(x.note)body+=`<div class="ded">📝 ${esc(x.note)}</div>`;
  let acts='';
  if(x.kind==='song'){if(x.status==='new')acts=`<button class="btn ok" data-lv="ack" data-id="${x.id}">▶ Sviramo</button><button class="btn" data-lv="skip" data-id="${x.id}">Preskoči</button>`;else if(x.status==='ack')acts=`<button class="btn ok" data-lv="done" data-id="${x.id}">✓ Odsvirano</button>`;}
  else{if(x.status==='new')acts=`<button class="btn ok" data-lv="ack" data-id="${x.id}">👍 Preuzimam</button><button class="btn" data-lv="done" data-id="${x.id}">✓ Rešeno</button>`;else if(x.status==='ack')acts=`<button class="btn ok" data-lv="done" data-id="${x.id}">✓ Rešeno</button>`;}
  return `<div class="lv ${x.status}" data-lid="${x.id}"><div class="ki">${k[0]}</div><div class="bd"><div class="t1">${x.table?`<span class="tbl">${esc(x.table)}</span>`:''}<b>${k[1]}</b><span class="pill st-${x.status}" style="height:22px">${LST[x.status]}</span><span class="el" data-since="${x.status==='new'&&x.kind!=='song'?x.createdAt:''}">${x.status==='new'&&x.kind!=='song'?ago(x.createdAt):agoTxt(x.createdAt)}</span></div>${body}${acts?`<div class="acts">${acts}</div>`:''}</div></div>`;
}
function kpis(){
  const L=S.live.filter(x=>x.kind!=='song'),acked=L.filter(x=>x.ackAt).map(x=>(Date.parse(x.ackAt)-Date.parse(x.createdAt))/1000).filter(s=>s>=0&&s<7200);
  const avg=acked.length?Math.round(acked.reduce((a,s)=>a+s,0)/acked.length):null,slow=acked.length?Math.round(Math.max(...acked)):null;
  const ms=v=>v==null?'—':Math.floor(v/60)+':'+String(v%60).padStart(2,'0'),openN=openLive().filter(x=>x.kind!=='song').length;
  return `<div class="kpis"><div class="stat${openN?' hot':''}"><b>${openN}</b><span>otvoreno sada</span></div><div class="stat"><b>${ms(avg)}</b><span>prosečna reakcija</span></div><div class="stat"><b>${L.length}</b><span>${BILL?pl(L.length,'zahtev','zahteva','zahteva'):pl(L.length,'poziv','poziva','poziva')} večeras</span></div><div class="stat"><b>${ms(slow)}</b><span>najduže čekanje</span></div></div>`;
}
function renderLive(){
  const box=$('#tab-live');if(!S.cfg){box.innerHTML='<div class="empty"><span class="spin"></span></div>';return}
  const F=[['all','Sve'],['call','🔔 Konobar'],['bill','🧾 Račun']];
  const L=S.live.filter(x=>x.kind!=='song'&&(S.lf==='all'||x.kind===S.lf));
  const open=L.filter(x=>x.status==='new'||x.status==='ack').sort((a,b)=>(a.status===b.status?(a.createdAt<b.createdAt?-1:1):a.status==='new'?-1:1));
  const done=L.filter(x=>x.status==='done'||x.status==='skip').reverse().slice(0,25);
  box.innerHTML=`<div class="two"><div><h2 class="ptitle">Sto uživo</h2><p class="psub">Gosti zovu konobara${BILL?' i traže račun':''} izravno s telefona (NFC naljepnica / QR na stolu). Sve stiže ovde u sekundi, a vidi se i koliko brzo osoblje reaguje.</p>${kpis()}
    <div class="row" style="margin-bottom:8px"${BILL?'':' hidden'}>${F.map(([k,l])=>`<button class="chip sm" data-lf="${k}" aria-pressed="${S.lf===k}">${l}</button>`).join('')}</div>
    ${open.length?open.map(liveCard).join(''):`<div class="empty"><b>Sve je mirno</b>Kad gost dodirne „Pozovite konobara”${BILL?' ili „Račun”':''} — pojaviće se ovde, uz zvučni signal.</div>`}
    ${done.length?`<details><summary class="sec" style="cursor:pointer"><span>Rešeno večeras</span><span>${done.length} ▾</span></summary>${done.map(liveCard).join('')}</details>`:''}</div>
    <div class="stick"><div class="sec"><span>Raspored · gde zovu</span><span class="livedot"><i></i>uživo</span></div><div class="planbox inline"><svg id="lvplan"></svg></div><div class="legend"><span><i class="lg-alert"></i>Zove osoblje</span><span><i class="lg-seated"></i>Sede</span><span><i class="lg-confirmed"></i>Rezervisano</span></div></div></div>`;
  if(innerWidth>=780&&S.cfg){const nb=TT.biz(),tm=nb.date===S.liveDate?nb.min:defaultPlanTime();const L=S.liveRes||[];const at=t=>L.find(r=>r.tableId===t.id&&ACTIVE.includes(r.status)&&tm>=r.start&&tm<r.end);TTPlan.render($('#lvplan'),S.cfg,{state:t=>{const a=liveAlertToday(t);const r=at(t);return (r?r.status:'free')+(a?' alert':'')},alert:liveAlertToday,sub:t=>{const a=openLive().filter(x=>x.table===t.id&&x.kind!=='song');if(a.length)return ago(a[0].createdAt);const r=at(t);return r?`${r.name.split(' ')[0].slice(0,10)} · ${r.party}`:`${t.min}–${t.max}`},onTap:t=>{const o=openLive().filter(x=>x.table===t.id);if(o.length){const el=$(`[data-lid="${o[0].id}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}}});}
}
function liveAlertToday(t){const o=openLive().filter(x=>x.table===t.id&&x.kind!=='song');if(!o.length)return '';const n=o.find(x=>x.status==='new')||o[0];return KIND[n.kind][0]}
function renderSongs(){
  const box=$('#tab-songs');const L=S.live.filter(x=>x.kind==='song');
  const now=L.filter(x=>x.status==='ack'),queue=L.filter(x=>x.status==='new'),done=L.filter(x=>x.status==='done'||x.status==='skip').reverse().slice(0,20);
  const kiosk=document.body.classList.contains('kiosk');
  box.innerHTML=`${kiosk?'<button class="btn kx" data-kiosk>✕ Zatvori prikaz za bend</button>':''}<h2 class="ptitle">🎵 Pesme po želji</h2><p class="psub">Gosti šalju želje s telefona (sto + posveta). Bend ih vidi na tabletu, bez papirića i dovikivanja.</p>
   ${kiosk?'':'<button class="btn gold" data-kiosk style="margin-bottom:12px">⛶ Prikaz za bend (tablet)</button>'}
   ${now.length?`<div class="sec"><span>▶ Sada sviramo</span></div>${now.map(liveCard).join('')}`:''}
   <div class="sec"><span>Na redu</span><span>${queue.length}</span></div>${queue.length?queue.map(liveCard).join(''):'<div class="empty">Nema novih želja.</div>'}
   ${done.length&&!kiosk?`<details><summary class="sec" style="cursor:pointer"><span>Odsvirano večeras</span><span>${done.length} ▾</span></summary>${done.map(liveCard).join('')}</details>`:''}`;
}
setInterval(()=>{$$('.el[data-since]').forEach(e=>{if(e.dataset.since)e.textContent=ago(e.dataset.since)})},1000);
async function setLive(id,status,btn){try{btn&&(btn.disabled=true);const x=S.live.find(i=>i.id===id);
  if(x&&x.kind==='song'&&status==='ack')for(const o of S.live.filter(i=>i.kind==='song'&&i.status==='ack'&&i.id!==id))await api('/admin/live/update',{id:o.id,status:'done',date:S.liveDate});
  await api('/admin/live/update',{id,status,date:S.liveDate});buzz(10);await loadLive();
  toast(x&&x.kind==='song'?(status==='ack'?'▶ Gost vidi da bend svira njegovu pesmu':status==='done'?'✓ Odsvirano':'Preskočeno'):(status==='ack'?'👍 Gost vidi da stižete':status==='done'?'✓ Rešeno':'Preskočeno'))}catch(e){toast(errMsg(e));btn&&(btn.disabled=false)}}

/* ---------- cenovnik: rasprodato, cene, akcija ---------- */
let menuTimer=null,menuQ='';
function mdoc(){S.menu=S.menu||{soldOut:{},price:{},promo:null};S.menu.soldOut=S.menu.soldOut||{};S.menu.price=S.menu.price||{};return S.menu}
function tOpts(sel){let h='';for(let m=0;m<1440;m+=15){const v=fmt(m);h+=`<option value="${v}" ${v===sel?'selected':''}>${v}</option>`;}if(!/^\d{2}:(00|15|30|45)$/.test(sel))h=`<option value="${sel}" selected>${sel}</option>`+h;return h;}
function promoNow(){const m=mdoc();return m.promo&&!m.promo.off?m.promo:(m.promo&&m.promo.off?null:CAT.promo)}
async function saveMenu(){clearTimeout(menuTimer);menuTimer=setTimeout(async()=>{try{const r=await api('/admin/menu',{menu:mdoc()});if(r&&r.menu)mdoc().updatedAt=r.menu.updatedAt;const s=$('#msaved');if(s){s.classList.add('on');setTimeout(()=>s.classList.remove('on'),1800)}toast('✓ Sačuvano — gosti vide promenu odmah')}catch(e){toast(errMsg(e))}},350)}

     <span class="lbl" style="margin-top:8px">DJ / muzika</span><input type="text" id="evDj" maxlength="70" autocomplete="off" value="${esc(evo.dj||'')}" placeholder="${esc(F.dj.hr)}">
     <div style="display:flex;align-items:center;gap:10px;margin-top:8px"><span class="lbl" style="margin:0">Od</span><select id="evFrom" style="max-width:120px">${tOpts(evo.from||F.from)}</select><span class="small" style="flex:1">Prazno polje = primer iz demo cenovnika.</span></div></div>`;

  EC.closedDates=$('#closed').value.split(/[,\s]+/).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
  EC.rules={hr:$('#rulesHr').value,en:$('#rulesEn').value};
  try{const r=await api('/admin/config',{config:EC});S.cfg=r.config;toast('✓ Podešavanja sačuvane');buzz(12)}catch(e){toast(errMsg(e))}
}

/* ---------- akcije ---------- */
async function setStatus(id,status,btn){
  if(status==='declined'&&btn&&!arm(btn,'Dodirnite ponovo'))return;
  try{btn&&(btn.disabled=true);const x=await api('/admin/update',{id,status});afterUpdate(x)}catch(e){toast(errMsg(e));btn&&(btn.disabled=false)}
}
document.addEventListener('click',e=>{const x=e.target;
  const sr=x.closest('[data-showres]');if(sr){$('#nban').classList.remove('on');S.flash=sr.dataset.showres;if(S.tab!=='list')setTab('list');if(S.date!==sr.dataset.d)setDate(sr.dataset.d);else renderList();return}
  const dl=x.closest('[data-demo-link]');if(dl&&DEMO){e.preventDefault();const kind=dl.dataset.demoLink;if(dl.hasAttribute('data-close'))closeSheet();toast(kind==='WhatsApp poruka'?'✓ Demo: poruka je stigla gostu na WhatsApp':`Demo: ovde se otvara ${kind} s gostom`);return}
  if(x.closest('[data-logout]')){const b=x.closest('[data-logout]');if(arm(b,'Dodirnite ponovo'))logout();return}
  const a=x.closest('[data-act]');if(a){setStatus(a.dataset.id,a.dataset.act,a);return}
  const lv=x.closest('[data-lv]');if(lv){setLive(lv.dataset.id,lv.dataset.lv,lv);return}
  const ed=x.closest('[data-edit]');if(ed){editSheet(ed.dataset.edit);return}
  if(x.closest('[data-close]')){if(x.closest('a[data-close]'))setTimeout(closeSheet,300);else closeSheet();return}
  const sd=x.closest('[data-date]');if(sd){buzz(6);setDate(sd.dataset.date);return}
  const pt=x.closest('[data-pt]');if(pt){S.planTime=+pt.dataset.pt;renderPlan();return}
  const nf=x.closest('[data-newfor]');if(nf){newSheet(nf.dataset.newfor);return}
  if(x.closest('[data-new]')){if(S.cfg)newSheet(null);return}
  const lf=x.closest('[data-lf]');if(lf){S.lf=lf.dataset.lf;renderLive();return}
  if(x.closest('[data-kiosk]')){document.body.classList.toggle('kiosk');renderSongs();scrollTo(0,0);return}
  const mp=x.closest('[data-mp]');if(mp&&!mp.querySelector('input')){editPrice(mp);return}
  const fr=x.closest('[data-fbr]');if(fr){api('/admin/feedback/update',{id:fr.dataset.fbr,read:true}).then(loadFb);return}
  const fd=x.closest('[data-fbd]');if(fd){api('/admin/feedback/update',{id:fd.dataset.fbd,read:true,done:true}).then(loadFb);return}
  const tb=x.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);return}
});
document.addEventListener('change',e=>{const so=e.target.closest('[data-so]');if(so){const m=mdoc();if(so.checked)m.soldOut[so.dataset.so]=1;else delete m.soldOut[so.dataset.so];buzz(8);saveMenu();renderMenu();}});
$('#prev').onclick=()=>setDate(addDays(S.date,-1));$('#next').onclick=()=>setDate(addDays(S.date,1));
$('#todayBtn').onclick=()=>{const i=document.createElement('input');i.type='date';i.value=S.date;i.style.position='fixed';i.style.opacity=0;document.body.appendChild(i);i.onchange=()=>{if(i.value)setDate(i.value);i.remove()};i.onblur=()=>setTimeout(()=>i.remove(),300);try{i.showPicker()}catch(e){i.click()}};
$('#search').oninput=e=>{S.q=e.target.value;renderList()};
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{if(S.tab==='list')renderListPlan();if(S.tab==='live')renderLive()},200)});

/* ---------- osvježavanje ---------- */
let rq=null;
function refreshAll(){clearTimeout(rq);rq=setTimeout(()=>{if(document.body.classList.contains('editing'))return;loadDay(true);loadUpcoming();loadLive();loadFb();if(S.tab==='menu'){loadMenu().then(()=>{if(!document.activeElement||!document.activeElement.closest('#tab-menu input'))renderMenu()})}},120)}
async function start(){$('#login').hidden=true;$('#app').hidden=false;$$('.demoTag').forEach(e=>e.hidden=!DEMO);
  const h=location.hash.slice(1).split('/');const tab=h[0]||(REZ?'list':'live');if(/^\d{4}-\d{2}-\d{2}$/.test(h[1]||''))S.date=h[1];if(h[2])S.flash=decodeURIComponent(h[2]);
  await loadDay();renderHeader();loadUpcoming();loadLive();loadFb();loadMenu();
  setTab(NAV().some(([k])=>k===tab)?tab:(REZ?'list':'live'));
  if(TT.mode==='live'){
    setInterval(()=>{if(document.visibilityState==='visible'&&!$('#sheet').classList.contains('on')){loadLive();if(S.tab!=='set'&&S.tab!=='menu'){loadDay(true);loadUpcoming()}}},6000);
    setInterval(()=>{if(document.visibilityState==='visible')loadFb()},30000);
  }
  TT.onChange(m=>{if(m.venue===V.venue||m.venue==='*')refreshAll()});
  addEventListener('hashchange',()=>{const h=location.hash.slice(1).split('/');if(h[2])S.flash=decodeURIComponent(h[2]);if(/^\d{4}-\d{2}-\d{2}$/.test(h[1]||'')&&h[1]!==S.date){S.tab=NAV().some(([k])=>k===h[0])?h[0]:S.tab;setDate(h[1]);}if(NAV().some(([k])=>k===h[0])&&h[0]!==S.tab)setTab(h[0]);else if(S.tab==='list')renderList();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshAll()});
}
if(TT.pin(V.venue)){TT.api('/admin/login',{admin:true}).then(start).catch(()=>logout())}else logout();
})();
</script>
</body>
