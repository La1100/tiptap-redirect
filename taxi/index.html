<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Osječki taxi">
<title>Osječki taxi: nova aplikacija</title>
<meta name="description" content="Prototip nove putničke aplikacije Osječkog taxija: od upisa odredišta do ocjene vožnje.">
<meta property="og:type" content="website">
<meta property="og:title" content="Osječki taxi: nova aplikacija">
<meta property="og:description" content="Isprobajte prototip: od upisa odredišta do ocjene vožnje.">
<meta property="og:image" content="https://tiptapreviews.com/taxi/assets/og.png">
<meta property="og:url" content="https://tiptapreviews.com/taxi">
<link rel="icon" href="/taxi/assets/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/taxi/assets/icon-180.png">
<link rel="preload" href="/taxi/assets/logo.svg" as="image">
<link rel="preload" href="/taxi/assets/corolla-3d.webp" as="image">
<link rel="preload" href="/taxi/assets/corolla-3d-m.webp" as="image">
<link rel="preload" href="/taxi/assets/taxi-top.webp" as="image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B1730;--grey:#5A6478;--mute:#8A93A3;--line:#E7EAF0;--surf:#F2F4F8;--bg:#FFFFFF;--elev:#FFFFFF;--brand:#0A3D94;--brand-d:#072C6E;--brand-t:#E8EEF9;--acc:#0A3D94;--gold:#C4A062;--gold-t:#75561C;--gold-bg:#F6EFE0;--gold-bd:#E4D0A3;--loc:#2F6FEB;--sh:rgba(10,20,38,.14);--grab:#D5D9DF;--map:#E9ECEF;--stage:#DFE4EA;--md:0;--toast:rgba(255,255,255,.97);--ring:rgba(10,61,148,.32);--ring-bg:rgba(10,61,148,.07);--danger-bg:#FCE9EA;--danger:#B3261E;--pc1:#072C6E;--pc2:#0A3D94;--route:#0A3D94;--route-case:#FFFFFF;--vc1:#F6F8FA;--vc2:#ECEFF3;--scrim:rgba(10,20,38,.4);--s:1;--h:844px;--top:54px;--bot:30px;--ps:1;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#EEF2F8;--grey:#A2ADC1;--mute:#7A869D;--line:#22304E;--surf:#16223A;--bg:#0C1628;--elev:#18253F;--brand:#2D63D6;--brand-d:#2453B6;--brand-t:#172B52;--acc:#86ABFF;--gold:#D4B271;--gold-t:#E6CB92;--gold-bg:#2A2416;--gold-bd:#5B4B27;--sh:rgba(0,0,0,.5);--grab:#33425F;--map:#0F1A2E;--stage:#070D1A;--md:1;--toast:rgba(24,37,63,.97);--ring:rgba(134,171,255,.45);--ring-bg:rgba(134,171,255,.08);--danger-bg:#3A1C22;--danger:#FF8A80;--pc1:#10285A;--pc2:#1B3F86;--route:#5B8CFF;--route-case:#0C1628;--vc1:#1A2843;--vc2:#121D33;--scrim:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme=dark]{--ink:#EEF2F8;--grey:#A2ADC1;--mute:#7A869D;--line:#22304E;--surf:#16223A;--bg:#0C1628;--elev:#18253F;--brand:#2D63D6;--brand-d:#2453B6;--brand-t:#172B52;--acc:#86ABFF;--gold:#D4B271;--gold-t:#E6CB92;--gold-bg:#2A2416;--gold-bd:#5B4B27;--sh:rgba(0,0,0,.5);--grab:#33425F;--map:#0F1A2E;--stage:#070D1A;--md:1;--toast:rgba(24,37,63,.97);--ring:rgba(134,171,255,.45);--ring-bg:rgba(134,171,255,.08);--danger-bg:#3A1C22;--danger:#FF8A80;--pc1:#10285A;--pc2:#1B3F86;--route:#5B8CFF;--route-case:#0C1628;--vc1:#1A2843;--vc2:#121D33;--scrim:rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Onest,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--stage);overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(0,68,152,.5);outline-offset:2px}
[hidden]{display:none!important}
/* okvir */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:76px;padding:24px}
#side{width:330px;flex:none}
#side .lg{width:112px;height:auto;display:block}
#side h1{font-size:34px;line-height:1.12;letter-spacing:-.02em;margin:24px 0 12px;font-weight:800}
#side p{font-size:16px;line-height:1.55;color:var(--grey);margin:0 0 24px}
#side .qr{display:flex;gap:16px;align-items:center;background:#fff;color:#0B1730;border-radius:18px;padding:14px;box-shadow:0 6px 20px rgba(10,20,38,.08)}
#side .qr img{width:112px;height:112px;display:block;flex:none}
#side .qr b{display:block;font-size:16px;margin-bottom:4px}
#side .qr span{font-size:14px;color:#5A6478;line-height:1.45}
#side .pnote{font-size:13px;line-height:1.5;color:var(--mute);margin-top:18px}
#phone{position:relative;width:390px;height:844px;flex:none;border-radius:54px;box-shadow:0 0 0 11px #0D1118,0 0 0 13px #343C4A,0 40px 90px rgba(10,20,38,.35);transform:scale(var(--ps));transform-origin:center}
#app{position:absolute;left:0;top:0;width:390px;height:var(--h);transform:scale(var(--s));transform-origin:0 0;overflow:hidden;background:var(--map);border-radius:54px;isolation:isolate}
body.ns #side{display:none}
body.m #stage{display:block;padding:0}
body.m #side{display:none}
body.m #phone{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none}
body.m #app{border-radius:0}
body.m #sbar{display:none}
#sbar{position:absolute;left:0;right:0;top:0;height:54px;z-index:45;padding:6px 28px 0 42px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
#sbar b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
#sbar i{position:absolute;left:132px;top:11px;width:126px;height:37px;border-radius:19px;background:#000}
/* karta */
#map{position:absolute;left:0;top:0;width:390px;height:844px;transition:transform .8s cubic-bezier(.2,.75,.2,1)}
#map>img{position:absolute;left:0;top:0;width:390px;height:844px;pointer-events:none;user-select:none;-webkit-user-select:none}
#map>img.md{opacity:var(--md)}
#ov{position:absolute;left:0;top:0;pointer-events:none}
.car{position:absolute;left:0;top:0;pointer-events:none;transition:opacity .5s}
.mk{position:absolute;pointer-events:none}
.halo{width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(47,111,235,.16);animation:halo 2.6s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.18)}}
.me{width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--loc);border:3.5px solid #fff;box-shadow:0 2px 8px rgba(10,20,38,.3)}
.pk{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:5px solid var(--route);box-shadow:0 2px 6px rgba(10,20,38,.25)}
.dst{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:4px;background:var(--route);box-shadow:0 2px 6px rgba(10,20,38,.25);display:flex;align-items:center;justify-content:center}
.dst::after{content:"";width:6px;height:6px;border-radius:1.5px;background:#fff}
.lbl{transform:translate(calc(-100% - 14px),-50%);white-space:nowrap;height:30px;padding:0 11px;border-radius:15px;background:var(--elev);box-shadow:0 3px 12px var(--sh);display:flex;align-items:center;font-size:13px;font-weight:700}
.lbl.r{transform:translate(14px,-50%)}
.eta{width:76px;height:46px;margin:-23px 0 0 -38px;color:var(--acc);transition:left .1s linear,top .1s linear}
.eta-in{position:absolute;left:4px;top:4px;right:4px;bottom:4px;border-radius:10px;background:var(--elev);box-shadow:0 4px 14px var(--sh);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap}
.eta svg{position:absolute;left:0;top:0}
.rings i{position:absolute;left:-150px;top:-150px;width:300px;height:300px;border-radius:50%;border:1.5px solid var(--ring);background:var(--ring-bg);opacity:0;animation:ring 2.7s ease-out infinite}
.rings i:nth-child(2){animation-delay:.9s}.rings i:nth-child(3){animation-delay:1.8s}
@keyframes ring{0%{transform:scale(.12);opacity:.95}100%{transform:scale(1);opacity:0}}
.flag{margin:-24px 0 0 -2px}
/* plutajući gumbi */
.fl{position:absolute;z-index:4;top:calc(var(--top) + 6px)}
.fbtn{width:48px;height:48px;border-radius:24px;background:var(--elev);box-shadow:0 2px 12px var(--sh);display:flex;align-items:center;justify-content:center}
.logo-b{width:48px;height:48px;border-radius:15px;background:#fff;box-shadow:0 2px 12px var(--sh);display:flex;align-items:center;justify-content:center}
.logo-b img{width:38px;height:38px;display:block}
.toppill{left:80px;right:80px;height:48px;border-radius:24px;background:var(--elev);box-shadow:0 2px 12px var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 12px}
.toppill small{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--grey)}
.toppill small::before{content:"";width:7px;height:7px;border-radius:4px;background:var(--acc)}
.toppill b{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* list */
#sheets>.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -8px 28px rgba(10,20,38,.08);padding:8px 20px var(--bot);display:flex;flex-direction:column;max-height:calc(100% - var(--top) - 24px);overflow-y:auto;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .25s}
.sheet.in{transform:translateY(100%)}
.sheet.out{transform:translateY(30px);opacity:0;pointer-events:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--grab);margin:0 auto 14px;flex:none}
.t{margin:0;font-size:24px;font-weight:700;letter-spacing:-.015em}
.t em{font-style:normal;color:var(--acc)}
.sub{margin:4px 0 0;font-size:15px;line-height:1.4;color:var(--grey)}
.tc{margin:0;text-align:center;font-size:20px;font-weight:700;letter-spacing:-.01em}
.hr{height:1px;background:var(--line);margin:14px -20px 8px;flex:none}
.sp{flex:1;min-height:12px}
.hi{margin:0 0 12px;font-size:22px;font-weight:700;letter-spacing:-.015em}
.cf{position:absolute;z-index:3;display:block;pointer-events:none}
/* redovi */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:8px 0;border-bottom:1px solid var(--line);text-align:left}
.row:last-child{border-bottom:0}
.ci{width:40px;height:40px;flex:none;border-radius:20px;background:var(--surf);display:flex;align-items:center;justify-content:center}
.ci.gold{background:var(--gold-bg);color:var(--gold-t)}
.ci.blue{background:var(--brand-t);color:var(--acc)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rt b{font-size:16px;font-weight:600}
.rt small{font-size:14px;color:var(--grey);line-height:1.35}
.chev{color:var(--mute);flex:none}
/* gumbi */
.btn{height:56px;flex:1;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:700;text-align:center;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:active{background:var(--brand-d)}
.btn.sec{background:var(--surf)}
.btn.sq{flex:none;width:56px}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.wide{width:100%;flex:none}
.brow{display:flex;gap:10px;flex:none}
.link{font-size:15px;font-weight:600;color:var(--acc);text-decoration:underline;text-underline-offset:3px}
/* početna */
.search{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-radius:16px;background:var(--surf)}
.search>button:first-child{flex:1;height:100%;display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;letter-spacing:-.01em}
.when{height:40px;padding:0 12px;border-radius:20px;background:var(--elev);box-shadow:0 1px 3px var(--sh);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;white-space:nowrap}
.nav{flex:none;display:flex;justify-content:space-around;padding-top:8px;margin:6px -20px 0;border-top:1px solid var(--line);background:var(--bg)}
.nav button{width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--mute)}
.nav button[aria-current]{color:var(--acc)}
.page .nav{margin:0;padding-bottom:var(--bot)}
/* odabir */
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px 8px 2px;border-radius:16px;border:2.5px solid transparent;text-align:left;transition:border-color .15s}
.opt[aria-checked=true]{border-color:var(--acc)}
.opt-img{width:108px;flex:none;display:flex;justify-content:center}
.opt-img img{display:block;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.opt[aria-checked=true] .opt-img img{transform:scale(1.06)}
.opt-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.opt-n{display:flex;align-items:center;gap:8px}
.opt-n b{font-size:18px;font-weight:700}
.seats{display:flex;align-items:center;gap:1px;font-size:13px;font-weight:600;color:var(--grey)}
.opt-t small{font-size:14px;color:var(--grey)}
.pts{align-self:flex-start;margin-top:2px;height:22px;padding:0 7px;border-radius:6px;background:var(--gold-bg);display:flex;align-items:center;font-size:12px;font-weight:700;color:var(--gold-t)}
.opt-p{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.opt-p b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.fix{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--gold-t)}
/* traženje i vožnja */
.prog{height:4px;border-radius:2px;background:var(--surf);margin-top:16px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;width:0;border-radius:2px;background:var(--brand);transition:width .3s linear}
.prog.load i{animation:load 3.4s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes load{from{width:4%}to{width:96%}}
.trip{display:flex;align-items:center;gap:12px;margin-top:18px}
.dots{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none}
.dots i:first-child{width:10px;height:10px;border-radius:5px;border:3px solid var(--acc)}
.dots i:nth-child(2){width:2px;height:16px;background:repeating-linear-gradient(var(--grab) 0 3px,transparent 3px 6px)}
.dots i:last-child{width:10px;height:10px;border-radius:2px;background:var(--acc)}
.trip-n{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;font-size:15px;font-weight:600}
.trip-p{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.trip-p b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.note{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--brand-t);font-size:14px;font-weight:500;color:var(--ink)}
.note svg{color:var(--acc)}
/* dolazak */
.vc{position:relative;margin-top:22px;border-radius:20px;background:linear-gradient(160deg,var(--vc1) 0%,var(--vc2) 100%);padding:14px 14px 15px 160px;min-height:120px;flex:none;display:flex;align-items:center}
.vc-t{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.vc-m{font-size:15px;font-weight:500;color:var(--grey);line-height:1.25}
.vc img{position:absolute;left:-12px;bottom:6px;display:block;pointer-events:none}
.plate{height:38px;display:flex;align-items:stretch;border-radius:7px;border:1.5px solid #C3CAD4;background:#fff;color:#16191E;overflow:hidden;flex:none;box-shadow:0 1px 3px rgba(10,20,38,.07)}
.plate .eu{width:20px;background:#1D4FB8;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:4px;gap:2px;font-size:8px;font-weight:800;color:#fff;line-height:1}
.plate .no{display:flex;align-items:center;gap:5px;padding:0 10px;white-space:nowrap;font-size:19px;font-weight:800;letter-spacing:.035em;font-variant-numeric:tabular-nums}
.drv{display:flex;align-items:center;gap:12px;margin-top:14px;flex:none}
.av{width:48px;height:48px;flex:none;border-radius:24px;background:var(--brand-t);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--acc)}
.drv-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.drv-t b{font-size:17px;font-weight:700}
.drv-t small{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--grey)}
.cbtn{width:48px;height:48px;flex:none;border-radius:24px;background:var(--surf);display:flex;align-items:center;justify-content:center}
/* kraj */
.paid{margin-top:16px;padding:14px 16px;border-radius:18px;background:var(--surf);display:flex;align-items:center;justify-content:space-between;flex:none}
.paid b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.paid small{font-size:14px;color:var(--grey)}
.gp{height:28px;padding:0 10px;border-radius:14px;background:var(--gold-bg);display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--gold-t);flex:none}
.earn{position:relative;margin-top:8px;padding:10px 16px;border-radius:16px;background:var(--gold-bg);display:flex;align-items:center;gap:12px;flex:none;color:var(--gold-t)}
.earn .coin{width:30px;height:30px;flex:none;border-radius:15px;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#fff}
.earn span{flex:1;font-size:15px}
.earn b{font-weight:800}
.earn small{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.h2{margin:20px 0 0;font-size:18px;font-weight:700}
.stars{display:flex;gap:4px;margin-top:6px}
.stars button{width:46px;height:46px;display:flex;align-items:center;justify-content:center;color:var(--gold);transition:transform .15s}
.stars button.off{color:var(--grab)}
.stars button:active{transform:scale(.88)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{height:38px;padding:0 14px;border-radius:19px;background:var(--surf);border:1.5px solid var(--surf);font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--brand-t);border-color:var(--acc);color:var(--acc)}
/* stranice */
#pages{position:absolute;inset:0;z-index:20;pointer-events:none}
.page{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--top);pointer-events:auto;transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .25s}
.page.in-up{transform:translateY(100%)}
.page.in-fade{opacity:0}
.ph{display:flex;align-items:center;gap:8px;padding:6px 16px 4px 10px;min-height:56px;flex:none}
.ph .fbtn{box-shadow:none;background:var(--surf);width:44px;height:44px}
.ph h1{margin:0;font-size:20px;font-weight:700}
.pb{flex:1;overflow-y:auto;padding:4px 20px 20px;-webkit-overflow-scrolling:touch}
.ptitle{margin:4px 0 12px;font-size:30px;font-weight:800;letter-spacing:-.02em}
.fields{display:flex;flex-direction:column;gap:8px;padding:2px 20px 12px;flex:none}
.field{height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:14px;background:var(--surf)}
.field.on{background:var(--elev);box-shadow:inset 0 0 0 2px var(--acc)}
.field input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;font-weight:600;outline:none}
.field input::placeholder{color:var(--mute);font-weight:500}
.fd-p{width:10px;height:10px;flex:none;border-radius:5px;border:3px solid var(--acc)}
.fd-d{width:10px;height:10px;flex:none;border-radius:2px;background:var(--acc)}
.sect{margin:14px 0 2px;font-size:13px;font-weight:700;color:var(--mute)}

#modal.on .mb{opacity:1}

.tel.err{box-shadow:inset 0 0 0 2px #D93025}

@keyframes lgin{to{opacity:1;transform:none}}
@keyframes carin{to{transform:none}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes band{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

SCR.arriving = () => {
  ambOn = false; const v = VEH[S.opt];

  route(PICK);
  marks(`<div class="mk pk" style="${at(...P)}"></div>${etaHTML(PICK[0][0], PICK[0][1] - 52, '3 min', 'etaB')}`);
  fl.innerHTML = `<button class="fl fbtn" style="right:20px" data-act="safety" aria-label="Sigurnost">${ic('shield')}</button>`;
  sheet(arrivingHTML(v));
  cam(PICK, [[150, 330]]);
  const t0 = performance.now(), D = reduce ? 1200 : 9000;
  place(assigned, ...pat(PICK, 0).slice(0, 3));
  anim = now => {
    const p = Math.min(1, (now - t0) / D), e = ease(p), [x, y, r] = pat(PICK, e);
    place(assigned, x, y, r); route(rest(PICK, e));
    const b = $('#etaB'); if (b) { b.style.left = x + 'px'; b.style.top = (y - 52) + 'px'; }
    const mins = Math.max(1, Math.ceil(3 * (1 - e) - .05)), tt = $('#arrT');
    if (p < 1) { if (tt && !tt.dataset.m || tt && +tt.dataset.m !== mins) { tt.dataset.m = mins; tt.innerHTML = `Stiže za <em>${mins} min</em>`; if (b) b.firstChild.textContent = mins + ' min'; } }

};
function arrived(v) {

<div class="drv"><span class="av">${v.driver[0]}</span><span class="drv-t"><b>${v.driver}</b><small>${v.short}, ${v.plate}</small></span><button class="cbtn" data-act="msgdrv" aria-label="Poruka vozaču">${ic('msg', 20, 'currentColor', 2.2)}</button></div>
<div class="note">${ic('lock', 20)}<span>Cijena je zaključana na ${eur(d[S.opt === 'taxi' ? 'taxi' : 'van'])}, bez obzira na promet.</span></div>

  anim = now => {

MOD.refer = () => { const c = ((firstName() || 'PUTNIK').toUpperCase().replace(/[^A-ZČĆŽŠĐ]/g, '') + '-200'); modal(`<h2 class="mt">Preporuči prijatelju</h2><p class="msub">Pošaljite kod prijatelju. Kad se prvi put provoza, oboje dobivate bodove.</p><div class="code"><span>${esc(c)}</span>${ic('gift', 22, 'var(--gold-t)')}</div><button class="btn pri wide" data-act="share" data-code="${esc(c)}">${ic('share', 19, '#fff', 2.2)}Podijeli kod</button>`); };
MOD.places = () => modal(`<h2 class="mt">Spremljena mjesta</h2><div class="list">${rowHTML('home', 'Kuća', 'Sjenjak, Osijek', 'data-dest="kuca"')}${rowHTML('pin', 'Posao', 'Dodajte adresu', 'data-act="proto" data-t="U pravoj aplikaciji ovdje upisujete adresu posla."')}${rowHTML('pin', 'Dodaj mjesto', 'Teretana, škola, roditelji…', 'data-act="proto" data-t="U pravoj aplikaciji ovdje dodajete svoja mjesta."')}</div>`);
MOD.settings = () => modal(`<h2 class="mt">Postavke i privatnost</h2><p class="sect" style="margin:6px 0 8px">Izgled</p><div class="seg" role="group" aria-label="Izgled aplikacije">${[['auto', 'Automatski'], ['light', 'Svijetlo'], ['dark', 'Tamno']].map(([k, l]) => `<button data-thm="${k}" aria-pressed="${S.theme === k}">${l}</button>`).join('')}</div><div class="list"><div class="row"><span class="ci">${ic('bell', 20)}</span><span class="rt"><b>Obavijesti o vožnji</b><small>Kad vozač krene i kad stigne</small></span><button class="sw on" role="switch" aria-checked="true" aria-label="Obavijesti o vožnji" data-sw="n1"></button></div><div class="row"><span class="ci">${ic('gift', 20)}</span><span class="rt"><b>Ponude i novosti</b><small>Popusti i nagrade</small></span><button class="sw" role="switch" aria-checked="false" aria-label="Ponude i novosti" data-sw="n2"></button></div>${rowHTML('globe', 'Jezik', 'Hrvatski', 'data-act="proto" data-t="Aplikacija može biti i na engleskom, za turiste."')}${rowHTML('refresh', 'Pokreni demo ispočetka', 'Briše prijavu, bodove i vožnje iz prototipa', 'data-act="reset"', '', false)}</div>`);
MOD.help = () => modal(`<h2 class="mt">Pomoć i centrala</h2><div class="list">${rowHTML('headset', 'Nazovi centralu', '031 200 200, 0–24 h', 'data-act="proto" data-t="U pravoj aplikaciji ovdje se zove centrala."')}${rowHTML('help', 'Kako naručiti taxi', 'Tri dodira: odredište, vožnja, naruči', 'data-act="proto" data-t="Ovdje dolaze kratki odgovori na česta pitanja."')}${rowHTML('cash', 'Plaćanje i računi', 'Gotovina, kartica, računi na e-mail', 'data-act="proto" data-t="Ovdje dolaze kratki odgovori na česta pitanja."')}${rowHTML('bag', 'Izgubljene stvari', 'Javite nam se, vozač provjerava auto', 'data-act="proto" data-t="Ovdje se prijavljuje izgubljena stvar."')}</div>`);
MOD.schedinfo = () => modal(`<h2 class="mt">Zakazana vožnja</h2><p class="msub">${esc(S.scheduled.dest)}, ${esc(S.scheduled.label)}. Podsjetit ćemo vas 15 minuta prije, a vozač kreće na vrijeme.</p><div class="brow"><button class="btn sec" data-act="close">U redu</button><button class="btn danger" data-act="unsched">Otkaži vožnju</button></div>`);

/* ---------- radnje ---------- */
const ACT = {
  close: () => closeModal(),
  intro: () => intro(),
  when: () => MOD.when(), extras: () => MOD.extras(), pay: () => MOD.pay(), central: () => MOD.central(),
  calldrv: () => MOD.calldrv(), msgdrv: () => MOD.msgdrv(), safety: () => MOD.safety(), cancel: () => MOD.cancel(),
  wallet: () => MOD.wallet(), promo: () => MOD.promo(), refer: () => MOD.refer(), places: () => MOD.places(), settings: () => MOD.settings(), help: () => MOD.help(), schedinfo: () => MOD.schedinfo(),
  login: () => login(null), profile: () => MOD.name(),
  proto: t => say(t.dataset.t),
  google: () => toast('Hvala vam', 'U pravoj aplikaciji ovdje se otvara Google recenzija Osječkog taxija.'),
  found: () => { clearTimeout(T); found(); },
  skip: () => { if (cur === 'arriving' && anim) { anim = null; place(assigned, ...pat(PICK, 1).slice(0, 3)); arrived(VEH[S.opt]); } else if (cur === 'ride') { anim = null; go('done'); } },
  order: () => {
    if (!S.user) return login(() => ACT.order());
    if (S.when) {
      S.scheduled = { dest: S.dest.name, label: `${S.when.day.toLowerCase()} u ${S.when.time}`, opt: S.opt }; store.set('sched', S.scheduled);
      S.when = null; go('home'); toast('Vožnja je zakazana', `${S.scheduled.dest}, ${S.scheduled.label}.`); return;
    }
    go('searching');
  },
  docancel: () => { cleanupRide(); go('home'); toast('Narudžba je otkazana', 'Možete naručiti novu kad god želite.'); },
  unsched: () => { S.scheduled = null; store.set('sched', null); closeModal(); SCR.home(); toast('Zakazana vožnja je otkazana', 'Nema troškova.'); },
  share: t => {
    const v = VEH[S.opt], code = t.dataset.code;
    const text = code ? `Naruči Osječki taxi preko aplikacije i upiši moj kod ${code}.` : `Pratite moju vožnju: ${v.model}, ${v.plate}.`;
    if (navigator.share) navigator.share({ title: 'Osječki taxi', text, url: location.href }).catch(() => {});
    else { try { navigator.clipboard.writeText(text + ' ' + location.href); } catch (e) {} closeModal(); toast('Poveznica je kopirana', 'Pošaljite je kome želite.'); }
  },
  setwhen: () => {
    if (M.day === 'Odmah') { S.when = null; closeModal(); }
    else if (!M.time) return;
    else { S.when = { day: M.day, time: M.time, label: `${M.day} ${M.time}` }; closeModal(); }
    if (cur === 'choose') refreshChoose(); else if (cur === 'home') SCR.home();
  },
  saveextras: () => { const n = $('#note'); S.extras.note = n ? n.value : ''; closeModal(); if (cur === 'choose') refreshChoose(); },
  sendcode: () => {
    const i = $('#ph'), v = (i ? i.value : '').replace(/\D/g, '').replace(/^0/, '');
    if (v.length < 8) { $('#telL').classList.add('err'); $('#phE').hidden = false; i.focus(); return; }
    M.phone = '+385 ' + v.replace(/^(\d{2})(\d{3})(\d+)$/, '$1 $2 $3'); MOD.code();
  },
  resend: () => toast('Kod je poslan ponovno', 'Stiže za nekoliko sekundi.'),
  skipname: () => loggedIn(''), savename: () => { const i = $('#nm'); loggedIn(i ? i.value : ''); },
  logout: () => { S.user = null; store.set('user', null); refreshAccount(); toast('Odjavljeni ste', 'Prijava traje samo nekoliko sekundi.'); },
  applypromo: () => { const i = $('#pc'), c = (i ? i.value : '').trim().toUpperCase(); if (!c) { i && i.focus(); return; } closeModal(); toast(`Kod ${esc(c)} je spremljen`, 'Popust se obračunava na sljedećoj vožnji.'); },
  reset: () => { try { Object.keys(localStorage).filter(k => k.startsWith('otx_')).forEach(k => localStorage.removeItem(k)); } catch (e) {} location.reload(); },
  finish: () => finishRide(),
};

app.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-go],[data-tab],[data-dest],[data-opt],[data-star],[data-chip],[data-ride],[data-sw],[data-pay],[data-day],[data-time],[data-msg],[data-thm]');
  if (!t || !app.contains(t)) return;
  const d = t.dataset;
  if (d.act && ACT[d.act]) return ACT[d.act](t);
  if (d.go) return go(d.go);
  if (d.tab) { if (d.tab === 'home') return go('home'); return go(d.tab); }
  if (d.dest) { S.dest = byId(d.dest); S.opt = S.opt || 'taxi'; return go('choose'); }
  if (d.opt) { S.opt = d.opt; return refreshChoose(); }
  if (d.star) { S.rating = +d.star; curSheet().querySelectorAll('[data-star]').forEach(b => { const on = +b.dataset.star <= S.rating; b.classList.toggle('off', !on); b.setAttribute('aria-checked', +b.dataset.star === S.rating); }); return; }
  if (d.chip) { const on = t.getAttribute('aria-pressed') !== 'true'; t.setAttribute('aria-pressed', on); S.chips = on ? S.chips.concat(d.chip) : S.chips.filter(c => c !== d.chip); return; }
  if (d.ride) return MOD.receipt(S.rides.concat(SAMPLE)[+d.ride]);
  if (d.sw) { const on = !t.classList.contains('on'); t.classList.toggle('on', on); t.setAttribute('aria-checked', on); if (d.sw in S.extras) S.extras[d.sw] = on; return; }
  if (d.pay) { S.pay = d.pay; closeModal(); if (cur === 'choose') refreshChoose(); return; }
  if (d.thm) { S.theme = d.thm; store.set('theme', d.thm); applyTheme(); t.parentNode.querySelectorAll('[data-thm]').forEach(b => b.setAttribute('aria-pressed', b === t)); return; }
  if (d.day) { M.day = d.day; M.time = null; return M.redraw(); }
  if (d.time) { M.time = d.time; return M.redraw(); }
  if (d.msg) { const v = VEH[S.opt]; closeModal(); toast(`Poruka je poslana ${v.dat}`, `„${d.msg}”`); }
});
modalEl.addEventListener('keydown', e => { if (e.key === 'Enter') { if (e.target.id === 'ph') ACT.sendcode(); else if (e.target.id === 'nm') ACT.savename(); else if (e.target.id === 'pc') ACT.applypromo(); } });
addEventListener('keydown', e => { if (e.key === 'Escape' && modalEl.classList.contains('on')) closeModal(); });

function burst(host, x, y) {
  if (reduce) return;
  const cols = ['#0A3D94', '#C4A062', '#3D6FD0', '#E4D0A3'];
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('i'), a = Math.PI * 2 * i / 18 + Math.random() * .3, d = 40 + Math.random() * 44, z = 5 + Math.random() * 4, r = Math.random() * 360;
    p.className = 'cf'; p.style.cssText = `left:${x}px;top:${y}px;width:${z}px;height:${z}px;background:${cols[i % 4]};border-radius:${i % 3 ? 1.5 : z}px`;
    host.appendChild(p);
    p.animate([{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 },
      { transform: `translate(calc(-50% + ${(Math.cos(a) * d).toFixed(1)}px),calc(-50% + ${(Math.sin(a) * d - 12).toFixed(1)}px)) rotate(${r.toFixed(0)}deg)`, opacity: 1, offset: .65 },
      { transform: `translate(calc(-50% + ${(Math.cos(a) * d * 1.12).toFixed(1)}px),calc(-50% + ${(Math.sin(a) * d + 16).toFixed(1)}px)) rotate(${(r + 160).toFixed(0)}deg)`, opacity: 0 }],
      { duration: 1100 + Math.random() * 300, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' }).onfinish = () => p.remove();
  }
}

/* ---------- uvod ---------- */
let introT = 0;
const SLOGAN = 'Osijek se vozi s nama.';
function intro() {
  const el = $('#intro');
  el.innerHTML = `<div class="ib">${LOGO}<i class="gl"></i><p class="slog">${SLOGAN}</p></div><div class="band"></div><div class="ic"><div class="ic-in"><div class="ic-b"><i class="beam"></i><img class="cs" src="${A}corolla-3d.webp" width="320" height="195" alt=""><img class="cm" src="${A}corolla-3d-m.webp" width="320" height="195" alt=""><i class="glow far" style="left:95.5%;top:55.5%"></i><i class="glow" style="left:71.4%;top:66%"></i></div></div></div>`;
  el.style.opacity = ''; el.hidden = false; delete el.dataset.out;
  const car = $('.ic', el), inn = $('.ic-in', el), bob = $('.ic-b', el), cm = $('.cm', el);
  const P0 = 'translate(-390px,-181px) scale(.6)', P1 = 'translate(0px,0px) scale(1)';
  if (reduce) { car.style.transform = P1; cm.style.opacity = 0; }
  else {
    car.animate([{ transform: P0 }, { transform: P1 }], { duration: 1250, delay: 200, easing: 'cubic-bezier(.25,.6,.3,1)', fill: 'both' });
    cm.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 320, delay: 1130, easing: 'ease-out', fill: 'both' });
    bob.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-1.2px)' }, { transform: 'translateY(0)' }], { duration: 260, delay: 200, iterations: 4, easing: 'ease-in-out' });
    inn.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(1.1deg)', offset: .35 }, { transform: 'rotate(0)' }], { duration: 560, delay: 1300, easing: 'ease-out' });
    el.querySelectorAll('.glow,.beam').forEach(g => g.animate([{ opacity: 0 }, { opacity: 1, offset: .16 }, { opacity: .1, offset: .38 }, { opacity: 1, offset: .58 }, { opacity: 0 }], { duration: 820, delay: 1750, easing: 'ease-out', fill: 'both' }));
  }
  const end = () => {
    clearTimeout(introT); if (el.hidden || el.dataset.out) return; el.dataset.out = 1;
    if (!reduce) {
      cm.animate([{ opacity: 1 }], { duration: 220, easing: 'ease-in', fill: 'forwards' });
      inn.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-.7deg)', offset: .3 }, { transform: 'rotate(0)' }], { duration: 600, easing: 'ease-out' });
      car.animate([{ transform: 'translate(350px,162px) scale(1.65)' }], { duration: 800, easing: 'cubic-bezier(.55,0,.9,.4)', fill: 'forwards' });
    }
    const a = el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: reduce ? 1 : 420, delay: reduce ? 0 : 430, easing: 'ease-out', fill: 'forwards' });
    a.onfinish = () => { el.hidden = true; delete el.dataset.out; a.cancel(); };
  };
  el.onclick = end;
  introT = setTimeout(end, reduce ? 500 : 2700);
}

go('home');
intro();
})();
</script>
