:root{color-scheme:dark;
  --bg:#12100e;--bg2:#1a1714;--card:#211d19;--card2:#2b2621;--line:rgba(212,174,90,.2);
  --gold:#d4ae5a;--gold2:#f2c872;--amber:#ff9f2e;--text:#f6f0e5;--muted:#b8ad99;--dim:#8a8070;
  --warn:#f4bf52;--ok:#8fd19e;--radius:18px;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;min-height:100vh;
  background:
    radial-gradient(120% 60% at 50% -10%,rgba(255,159,46,.13),transparent 60%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 64px),
    var(--bg);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{display:block}

/* ---------- INTRO: ulazak kroz drvena vrata u show ---------- */
#intro{position:fixed;inset:0;z-index:100;overflow:hidden;container-type:size;background:#07050a;transition:opacity .55s ease,visibility .55s;--beat:.48s;cursor:pointer}
#intro.out{opacity:0;visibility:hidden}
#intro .club{position:absolute;inset:0;overflow:hidden;background:radial-gradient(70% 45% at 50% 38%,#5b1a6e 0%,#2a0d3a 40%,#0b0710 78%);transform:scale(1.35);animation:clubIn 2s 1.1s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes clubIn{to{transform:scale(1)}}
#intro .club::after{content:"";position:absolute;left:50%;top:62%;width:120vw;height:60vh;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,170,60,.45),transparent);animation:pulse var(--beat) ease-out infinite}
@keyframes pulse{0%{opacity:1}100%{opacity:.45}}
#intro .haze{position:absolute;inset:-20%;background:radial-gradient(40% 30% at 30% 40%,rgba(255,255,255,.07),transparent),radial-gradient(35% 25% at 70% 30%,rgba(139,92,255,.12),transparent);animation:haze 6s ease-in-out infinite alternate}
@keyframes haze{to{transform:translate(6%,-4%)}}
#intro .beams i{position:absolute;top:-8%;left:var(--x);width:44vmax;height:130vh;margin-left:-22vmax;transform-origin:50% 0;background:linear-gradient(to bottom,var(--c),transparent 80%);clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);mix-blend-mode:screen;opacity:0;filter:blur(3px);transform:rotate(var(--a));animation:beamOn .4s 1s forwards,sweep 1.9s ease-in-out infinite alternate}
@keyframes beamOn{to{opacity:.55}}
@keyframes sweep{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
#intro .lasers{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:0;animation:beamOn .2s 1.35s forwards}
#intro .lz line{stroke-width:1.4;stroke-linecap:round}
#intro .lz1 line{stroke:#39ff9c;filter:drop-shadow(0 0 3px #39ff9c)}
#intro .lz2 line{stroke:#ff3fa4;filter:drop-shadow(0 0 3px #ff3fa4)}
#intro .lz{transform-box:view-box;transform-origin:200px 430px;animation:laser 2.4s ease-in-out infinite alternate,flick2 .24s steps(2) infinite}
#intro .lz2{animation-direction:alternate-reverse,normal;animation-duration:1.7s,.3s}
@keyframes laser{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes flick2{50%{opacity:.55}}
#intro .booth{position:absolute;left:50%;top:50%;width:min(64vw,300px);transform:translate(-50%,-38%)}
#intro .booth svg{width:100%;display:block;overflow:visible}
#intro .deck{filter:drop-shadow(0 0 8px rgba(242,200,114,.7))}
#intro .dj{animation:bob var(--beat) ease-in-out infinite alternate}
#intro .arm{transform-box:fill-box;transform-origin:0% 100%;animation:wave calc(var(--beat)*2) ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-10deg)}to{transform:rotate(18deg)}}
@keyframes bob{to{transform:translateY(3px)}}
#intro .crowd{position:absolute;left:0;right:0;bottom:0;width:100%;height:40vh;height:40cqh}
#intro .crowd .p{animation:bob2 var(--beat) ease-in-out infinite alternate}
@keyframes bob2{to{transform:translateY(-6px)}}
#intro .crowd .ph{filter:drop-shadow(0 0 4px #cfe0ff)}
#intro .confetti i{position:absolute;top:-4vh;width:7px;height:11px;border-radius:1px;opacity:0;animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:.9;transform:translateY(110vh) rotate(var(--rx))}}
#intro .strobe{position:absolute;inset:0;background:#fff;opacity:0;animation:strobe .9s 1.2s linear forwards;pointer-events:none}
@keyframes strobe{0%{opacity:0}4%{opacity:.85}10%{opacity:0}36%{opacity:0}40%{opacity:.6}46%{opacity:0}72%{opacity:0}76%{opacity:.45}82%,100%{opacity:0}}
#intro .welcome{position:absolute;left:0;right:0;top:12vh;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;transform:scale(.85);animation:welcome .7s 2.15s cubic-bezier(.2,.8,.2,1) forwards;color:#ffd98a}
#intro .welcome svg{width:min(40vw,170px);filter:drop-shadow(0 0 6px rgba(255,190,90,.9)) drop-shadow(0 0 24px rgba(255,140,40,.6))}
#intro .welcome b{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9.5vw,56px);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 0 12px #ff3fa4,0 0 32px rgba(255,63,164,.6);margin-top:6px;line-height:1}
#intro .welcome small{margin-top:8px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#ffd6ef;padding:0 16px}
@keyframes welcome{to{opacity:1;transform:scale(1)}}
/* pročelje */
#intro .facadewrap{position:absolute;left:50%;top:50%;width:max(100vw,50vh);height:max(200vw,100vh);width:max(100cqw,50cqh);height:max(200cqw,100cqh);transform:translate(-50%,-50%);transform-origin:50% 66%;animation:push 1.45s 1.2s cubic-bezier(.55,0,.35,1) forwards}
@keyframes push{0%{transform:translate(-50%,-50%) scale(1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-50%) scale(3.6);opacity:0}}
#intro .facade{position:absolute;inset:0;width:100%;height:100%}
#intro .neon{opacity:.15;animation:neonOn 1s .1s steps(1) forwards}
@keyframes neonOn{0%{opacity:.15}10%{opacity:1}18%{opacity:.3}24%{opacity:1}52%{opacity:.5}56%,100%{opacity:1}}
#intro .lampg{animation:pulse var(--beat) ease-out infinite}
#intro .doorway{position:absolute;left:17.5%;width:65%;top:31.25%;bottom:0;border-radius:50% 50% 0 0/23.64% 23.64% 0 0;overflow:hidden;perspective:900px}
#intro .spill{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 70%,rgba(255,190,90,.0),transparent);opacity:0}
#intro .door{position:absolute;top:0;bottom:0;width:50%;backface-visibility:hidden;
  background:
    linear-gradient(to bottom,transparent 21%,#1b1917 21% 25.5%,transparent 25.5% 71%,#1b1917 71% 75.5%,transparent 75.5%),
    linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.04) 40%,rgba(0,0,0,.25)),
    repeating-linear-gradient(90deg,#6b4526 0 18%,#5a3a1f 18% 19%,#2a190c 19% 20%,#744b2a 20% 38%,#2a190c 38% 39%,#62401f 39% 58%,#2a190c 58% 59%);
  box-shadow:inset 0 0 40px rgba(0,0,0,.65)}
#intro .door::before,#intro .door::after{content:"";position:absolute;left:4%;right:4%;height:4.5%;background:radial-gradient(circle,#b8a27a 0 1.2px,#3a342d 1.6px 2.6px,transparent 3px) 0 50%/16% 100% repeat-x}
#intro .door::before{top:21%}#intro .door::after{top:71%}
#intro .door.l{left:0;transform-origin:0 50%;animation:openL 1.05s .85s cubic-bezier(.5,0,.2,1) forwards}
#intro .door.r{right:0;transform-origin:100% 50%;animation:openR 1.05s .85s cubic-bezier(.5,0,.2,1) forwards;background-position:0 0,0 0,50% 0}
@keyframes openL{to{transform:rotateY(-105deg)}}
@keyframes openR{to{transform:rotateY(105deg)}}
#intro .ring{position:absolute;top:50%;width:26px;height:34px;border:4px solid #c9a24b;border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,.8),inset 0 0 4px rgba(0,0,0,.6)}
#intro .door.l .ring{right:10%}#intro .door.r .ring{left:10%}
#intro .gap{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:linear-gradient(to bottom,rgba(255,63,164,.9),rgba(255,190,90,1));box-shadow:0 0 18px 6px rgba(255,150,60,.6),0 0 60px 16px rgba(255,63,164,.35);animation:pulse var(--beat) ease-out infinite,gapOut .3s 1.05s forwards}
@keyframes gapOut{to{opacity:0}}
#intro .hint{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,230,200,.7);animation:fadein .4s .3s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* noćni klub štih u meniju */
.hero{position:relative}
.hero>*{position:relative;z-index:1}
.hero>.lights{position:absolute;z-index:0;inset:-60px -40px -10px;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.lights i{position:absolute;top:-10%;width:60%;height:170%;transform-origin:50% 0;clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);mix-blend-mode:screen;opacity:.16;filter:blur(6px);animation:sweep 7s ease-in-out infinite alternate}
.lights i:nth-child(1){left:-10%;background:linear-gradient(#ff3fa4,transparent 75%);--a:-25deg;--b:10deg}
.lights i:nth-child(2){left:25%;background:linear-gradient(#f2c872,transparent 75%);--a:15deg;--b:-15deg;animation-duration:9s}
.lights i:nth-child(3){left:55%;background:linear-gradient(#8b5cff,transparent 75%);--a:-10deg;--b:25deg;animation-duration:8s}
.tonight{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tonight:empty{display:none}
.live,.ev{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700}
.live{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.live b{width:8px;height:8px;border-radius:50%;background:#6b6258;flex:none}
.live.on{color:#c9f5d8}.live.on b{background:#46e08a;box-shadow:0 0 10px #46e08a;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.ev{color:#ffe0f2;background:linear-gradient(90deg,rgba(255,63,164,.22),rgba(139,92,255,.22));border:1px solid rgba(255,63,164,.45);box-shadow:0 0 18px rgba(255,63,164,.2)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;flex:none}
.eq i{width:3px;height:100%;background:#ff3fa4;border-radius:1px;transform-origin:bottom;animation:eq .48s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.2s;background:#c77dff}.eq i:nth-child(3){animation-delay:-.35s}.eq i:nth-child(4){animation-delay:-.1s;background:#f2c872}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}

/* ---------- LAYOUT ---------- */
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
.view{min-height:100vh}
.view.in-r{animation:inR .34s var(--ease)}
.view.in-l{animation:inL .34s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

/* ---------- HERO ---------- */
.hero{padding:max(14px,env(safe-area-inset-top)) 16px 4px;max-width:760px;margin:0 auto}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand>div{min-width:0}
.brand .logo{width:52px;flex:none;filter:drop-shadow(0 0 8px rgba(255,160,50,.35))}
.brand .sub{font-size:10.5px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;color:var(--muted)}
.brand h1{white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:29px;letter-spacing:.04em;line-height:1;margin:2px 0 0;text-transform:uppercase}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(0,0,0,.25)}
.lang button{min-width:40px;height:38px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted);transition:.2s}
.lang button[aria-pressed=true]{background:var(--gold);color:#1a1409}
.iconbtn{position:relative;width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);display:grid;place-items:center;color:var(--gold2);transition:transform .15s}
.iconbtn:active{transform:scale(.94)}
.count{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--amber);color:#1a1004;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 12px rgba(255,159,46,.6)}
.count:empty{display:none}

/* ---------- OCJENA + PORUKA UPRAVI ---------- */
.rate{position:relative;overflow:hidden;margin-top:14px;padding:20px 18px 4px;border-radius:24px;background:radial-gradient(90% 70% at 100% 0,rgba(242,200,114,.17),transparent 60%),linear-gradient(180deg,#2a231c,#1b1714);border:1px solid rgba(212,174,90,.32);box-shadow:0 22px 44px -30px #000}
.rate::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:1px solid rgba(242,200,114,.14);pointer-events:none}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.rate h2{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.02;letter-spacing:.02em;text-transform:uppercase;margin:8px 0 10px;text-wrap:balance}
.stars{display:flex;gap:4px;color:var(--gold2);margin:0 0 10px;filter:drop-shadow(0 0 8px rgba(242,200,114,.45))}
.rate p{margin:0 0 16px;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:46ch}
.rate .bigbtn{margin:0;text-decoration:none}
.anon{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:14px 0;border-top:1px solid rgba(212,174,90,.18);text-align:left;color:var(--text)}
.anon .ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--gold2)}
.anon .tx{flex:1;min-width:0}
.anon .tx b{display:block;font-size:15.5px;line-height:1.3}
.anon .tx span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.anon>svg{color:var(--dim);flex:none}

/* ---------- CJENIK (izbornik) ---------- */
.hub{margin-top:30px;scroll-margin-top:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 12px}
.sec-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:36px;letter-spacing:.04em;text-transform:uppercase;line-height:1;background:linear-gradient(180deg,#fff3d6,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-h span{font-size:13px;color:var(--dim)}
.search{display:block;position:relative}
.search input{width:100%;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:16px;padding:0 44px 0 46px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,174,90,.15)}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gold);pointer-events:none}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:12px;color:var(--muted);display:none;place-items:center}
.search.has .clear{display:grid}
.promo-line:empty{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:158px;padding:14px;border-radius:20px;text-align:left;color:var(--text);background:radial-gradient(115% 85% at 88% 18%,var(--tc),transparent 62%),linear-gradient(180deg,#29231d,#1a1612);border:1px solid rgba(212,174,90,.2);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 28px -22px #000;transition:transform .2s var(--ease),border-color .2s}
.tile:active{transform:scale(.975)}
.tile:hover{border-color:rgba(212,174,90,.4)}
.imgs{position:absolute;top:12px;right:8px;left:30%;height:96px;display:flex;justify-content:flex-end;align-items:flex-end;pointer-events:none}
.imgs img{height:var(--h,80px);width:auto;max-width:50px;object-fit:contain;margin-left:-10px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.imgs img:nth-child(2){--h:94px;position:relative;z-index:2}
.imgs img:nth-child(3){--h:84px}
.tile .tx{position:relative;z-index:3}
.tile .tn{display:block;font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1;letter-spacing:.03em;text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.tile .tm{display:block;margin-top:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .tag{position:absolute;z-index:3;top:10px;left:10px;height:24px;padding:0 8px;border-radius:8px;display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;color:#1a1004;background:linear-gradient(180deg,#ffbf5e,var(--amber));box-shadow:0 0 14px rgba(255,159,46,.45)}
.tile .kick{display:block;margin-bottom:6px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
.tile .tg{display:block;max-width:52%;margin-top:6px;font-size:13.5px;line-height:1.4;color:var(--muted)}
.tile .go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;height:34px;padding:0 14px;border-radius:999px;background:var(--gold);color:#1a1409;font-size:13px;font-weight:800;width:max-content}
.tile.feat{grid-column:1/-1;min-height:212px;padding:18px}
.tile.feat .imgs{height:166px;left:44%;top:14px;right:10px}
.tile.feat .imgs img{--h:124px;max-width:78px;margin-left:-14px}
.tile.feat .imgs img:nth-child(2){--h:156px}
.tile.feat .imgs img:nth-child(3){--h:138px}
.tile.feat .imgs img:nth-child(4){--h:116px}
.tile.feat .tn{font-size:38px}
#results{margin-top:14px}
.res-n{font-size:13px;color:var(--dim);margin:0 2px 4px}
.res-h{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:16px 2px 8px}

/* ---------- KARTICE PIĆA ---------- */
.list{display:grid;gap:8px}
@media (min-width:640px){.list{grid-template-columns:1fr 1fr}}
.card{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px 10px 8px;min-height:88px;border-radius:16px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid rgba(255,255,255,.045);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 22px -18px #000;cursor:pointer;transition:transform .18s var(--ease),border-color .2s}
.card:active{transform:scale(.985)}
.card:hover{border-color:rgba(212,174,90,.3)}
.card.sig{border-color:rgba(212,174,90,.38)}
.card .thumb{flex:none;width:58px;height:80px;display:grid;place-items:center}
.card .thumb img{max-width:58px;max-height:80px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(255,170,70,.08))}
.card .thumb svg{width:46px;height:62px}
.card .body{flex:1;min-width:0}
.card .row1{display:flex;align-items:baseline;gap:12px}
.card .name{flex:1;min-width:0;font-weight:700;font-size:16px;line-height:1.28}
.card .p1{flex:none;font-weight:800;font-size:16px;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .desc{font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.prs{display:grid;gap:1px;margin-top:6px}
.pr{display:flex;align-items:baseline;gap:8px;font-size:13.5px;color:var(--muted);line-height:1.55}
.pr span{white-space:nowrap}
.pr i{flex:1;min-width:10px;border-bottom:1px dotted rgba(212,174,90,.4);transform:translateY(-4px)}
.pr b{font-size:15px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.b{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.06);color:var(--muted)}
.b svg{width:13px;height:13px}
.b.sig{background:linear-gradient(90deg,rgba(242,200,114,.25),rgba(242,200,114,.08));color:var(--gold2)}
.b.na{background:rgba(143,209,158,.14);color:var(--ok)}
.b.xp{background:rgba(255,159,46,.14);color:#ffc47a}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:26px;color:var(--text);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.promo{display:flex;gap:12px;align-items:center;margin:12px 0 0;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(255,159,46,.16),rgba(255,159,46,.04));border:1px solid rgba(255,159,46,.35);font-size:14px;font-weight:600;color:#ffd9a3}
.promo b{font-family:var(--f-display);font-size:26px;color:var(--amber);text-shadow:0 0 12px rgba(255,159,46,.6);line-height:1;flex:none}

/* ---------- STRANICA KATEGORIJE ---------- */
.cbar{position:sticky;top:0;z-index:20;background:rgba(18,16,14,.9);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid rgba(212,174,90,.14)}
.cbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 12px 8px}
.back{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);display:grid;place-items:center;color:var(--gold2);transition:transform .15s}
.back:active{transform:scale(.94)}
.ct{flex:1;min-width:0;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.cbar.scrolled .ct{opacity:1;transform:none}
.ct small{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.ct b{display:block;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subnav{max-width:760px;margin:0 auto;padding:0 6px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;padding:0 6px;mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--muted);border:1px solid rgba(212,174,90,.18);white-space:nowrap;transition:color .2s,background .25s,border-color .25s,box-shadow .25s}
.chip.on{color:#1a1409;background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:transparent;box-shadow:0 0 16px rgba(242,200,114,.35)}
.chead{position:relative;overflow:hidden;margin:14px 0 4px;padding:20px 18px 18px;min-height:168px;border-radius:24px;display:flex;flex-direction:column;justify-content:flex-end;background:radial-gradient(110% 90% at 88% 22%,var(--tc),transparent 62%),linear-gradient(180deg,#2a231d,#1a1612);border:1px solid rgba(212,174,90,.22)}
.chead .imgs{left:46%;height:140px;top:12px;right:10px}
.chead .imgs img{--h:104px;max-width:70px;margin-left:-12px}
.chead .imgs img:nth-child(2){--h:132px}
.chead .imgs img:nth-child(3){--h:116px}
.chead .imgs img:nth-child(4){--h:98px}
.chead .tx{position:relative;z-index:3}
.chead h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.98;letter-spacing:.03em;text-transform:uppercase;text-shadow:0 2px 16px rgba(0,0,0,.8);max-width:62%;text-wrap:balance}
.chead p{margin:8px 0 0;max-width:56%;font-size:13.5px;line-height:1.4;color:var(--muted)}
section.cat{padding-top:20px}
.cat-h{position:relative;display:flex;align-items:baseline;justify-content:space-between;padding:4px 4px 12px}
.cat-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.05em;text-transform:uppercase;background:linear-gradient(180deg,#fff3d6,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px rgba(255,159,46,.25)}
.cat-h span{font-size:13px;color:var(--dim)}
.cat-h::after{content:"";position:absolute;left:4px;right:4px;bottom:4px;height:1px;background:linear-gradient(90deg,transparent,var(--amber) 20%,#ff3fa4 60%,transparent);opacity:.5}
.catnav{display:grid;gap:10px;margin:28px 0 calc(24px + env(safe-area-inset-bottom))}
.nextg{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px 12px 12px;border-radius:18px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);text-align:left;color:var(--text)}
.nextg .nimg{flex:none;width:44px;height:56px;display:grid;place-items:center}
.nextg .nimg img{max-width:44px;max-height:56px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.nextg .nx{flex:1;min-width:0}
.nextg small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.nextg b{display:block;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.nextg>svg{color:var(--gold2)}
.tohome{justify-self:center;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}

/* ---------- REZERVACIJA + INFO ---------- */
.bookc{margin-top:30px;padding:18px;border-radius:22px;background:linear-gradient(135deg,rgba(242,200,114,.10),rgba(255,255,255,.02)),var(--card);border:1px solid var(--line)}
.bk-h{display:flex;gap:14px;align-items:flex-start}
.bk-ic{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(242,200,114,.12);color:var(--gold2)}
.bookc h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.bookc p{margin:5px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.bookc .bigbtn{margin-top:16px;text-decoration:none}
.bookc .alt{margin-top:10px;text-align:center;font-size:13px;color:var(--muted)}
.bookc .alt a{color:var(--gold2);text-decoration:none;font-weight:700}
.info{margin-top:14px;display:grid;gap:12px}
@media (min-width:640px){.info{grid-template-columns:1fr 1fr}}
.ib{padding:16px 18px;border-radius:20px;background:var(--card);border:1px solid rgba(255,255,255,.05);min-width:0}
.ib h3{margin:0 0 8px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.hours{width:100%;border-collapse:collapse;font-size:14.5px}
.hours td{padding:5px 0;color:var(--muted)}
.hours td+td{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.hours tr.today td{color:var(--gold2);font-weight:800}
.ln{display:flex;align-items:center;gap:12px;min-height:50px;color:var(--text);text-decoration:none;font-size:15px;border-top:1px solid rgba(255,255,255,.05)}
.ln:first-of-type{border-top:0}
.ln svg{color:var(--gold2);flex:none}
.ln small{display:block;color:var(--muted);font-size:12.5px}
.soc-row{display:flex;gap:8px;margin-top:10px}
.soc-row a{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;font-size:14px}
.soc-row svg{color:var(--gold2);flex:none}
.foot{max-width:760px;margin:30px auto 0;padding:24px 16px calc(30px + env(safe-area-inset-bottom));border-top:1px solid var(--line);text-align:center;color:var(--dim);font-size:12.5px;line-height:1.6}
.foot svg{width:46px;margin:0 auto 10px;color:var(--gold);opacity:.85}
.foot p{margin:2px 0}
.foot .lg{color:var(--muted);margin-top:8px}

/* ---------- SHEETS ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,4,3,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:94vh;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#1e1a16,#141210);border-radius:26px 26px 0 0;border-top:1px solid var(--line);box-shadow:0 -20px 60px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .42s var(--ease);padding-bottom:calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px 18px;background:linear-gradient(180deg,#1e1a16 70%,rgba(30,26,22,0))}

.stage .glass{position:absolute;left:50%;top:50%;width:150px;height:200px;transform:translate(-50%,-50%);overflow:visible}

.stage.ex .glass .shell{opacity:.35}
.stage .tap{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:var(--gold2);letter-spacing:.08em;text-transform:uppercase;pointer-events:none;animation:breath 2s ease-in-out infinite}
@keyframes breath{50%{opacity:.45}}
.orb{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:8px;width:118px;opacity:0;transform:translate(-50%,-50%) scale(.3);transition:transform .65s var(--ease),opacity .4s;pointer-events:none}
.orb.r{flex-direction:row-reverse;text-align:right}
.orb .o{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.25),rgba(255,255,255,.03) 60%),var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 0 18px -2px var(--c)}
.orb .o svg{width:22px;height:22px}

.orb .t i{font-style:normal;color:var(--gold2);font-weight:700}
.stage.ex .orb{opacity:1}
.links{position:absolute;inset:0;pointer-events:none}

.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.box{background:var(--card);border-radius:16px;padding:12px 14px}

.str{display:flex;gap:4px}

.prof{display:grid;gap:7px}
.prof div{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:10px;font-size:13px;color:var(--muted)}

.bigbtn{width:100%;height:56px;border-radius:16px;margin-top:14px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}

/* ---------- točenje piva ---------- */
.pourbox{margin:0 -6px 4px;border-radius:22px;background:radial-gradient(60% 55% at 50% 60%,rgba(255,170,60,.12),transparent 70%);cursor:pointer;display:flex;justify-content:center}
.pour{width:100%;max-width:300px;height:auto;overflow:visible}
.pour .handle{transform-box:view-box;transform-origin:120px 30px;animation:hpull .35s .15s var(--ease) forwards,hback .45s 2.95s var(--ease) forwards}
@keyframes hpull{to{transform:rotate(-32deg)}}
@keyframes hback{from{transform:rotate(-32deg)}to{transform:rotate(0)}}
.pour .stream{transform-box:view-box;transform-origin:120px 74px;transform:scaleY(0);animation:sin .28s .42s ease-in forwards,sout .4s 3s ease-in forwards}
@keyframes sin{to{transform:scaleY(1)}}
@keyframes sout{from{transform:scaleY(1)}to{transform:translateY(var(--sl)) scaleY(0)}}
.pour .flow{animation:flow .35s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.pour .fill{transform:translateY(var(--y0));animation:rise 2.55s .6s cubic-bezier(.35,.55,.35,1) forwards}
@keyframes rise{to{transform:translateY(var(--y1))}}
.pour .foam{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.15);animation:foam 2.2s 1.2s ease-out forwards,settle 1.6s 3.4s ease-in-out forwards}
@keyframes foam{to{transform:scaleY(1.12)}}
@keyframes settle{from{transform:scaleY(1.12)}to{transform:scaleY(1)}}
.pour .bub{opacity:0;animation-name:bub;animation-timing-function:ease-in;animation-iteration-count:infinite}
@keyframes bub{0%{opacity:0;transform:translateY(0)}15%{opacity:.85}90%{opacity:.7}100%{opacity:0;transform:translateY(var(--d))}}
.pour .drops{opacity:1}.pour .drops ellipse{opacity:0;animation:drop .8s ease-out forwards}
@keyframes drop{to{opacity:.35}}
.pour .etch{color:#fff;opacity:.55;mix-blend-mode:screen}
.pour .glow{opacity:0;animation:fadein .8s 1.4s forwards}
.pourctl{display:flex;justify-content:center;align-items:center;gap:10px;margin:4px 0 12px;flex-wrap:wrap}

/* Minimal QR encoder (byte mode, ECC M, versions 1–15). Returns boolean matrix [y][x]. */
function qrMatrix(text){

  const dataCw=v=>Math.floor(raw(v)/8)-ECC[v]*BLK[v];

  if(ver>15)throw new Error('URL too long');
  const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1);};
  put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
  const cap=dataCw(ver)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
  for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b);}

function garnishSVG(kind,g){
 if(!kind||g.nog)return '';
 const x=g.gx,y=g.gy;
 const wheel=(c,l)=>`<g class="gar"><circle cx="${x}" cy="${y}" r="13" fill="${c}" stroke="${l}" stroke-width="2.5"/><path d="M${x} ${y-11}V${y+11}M${x-11} ${y}H${x+11}M${x-8} ${y-8}L${x+8} ${y+8}M${x+8} ${y-8}L${x-8} ${y+8}" stroke="${l}" stroke-width="1.3" opacity=".9"/></g>`;
 switch(kind){
  case 'lime':return wheel('#8cc63f','#e8f6c6');
  case 'lemon':return wheel('#f2d94e','#fff8d0');
  case 'orange':return wheel('#f7931e','#ffe2b5');
  case 'mint':return `<g class="gar"><path d="M${x-26} ${y+6} q-2-16 10-20 q4 12-10 20z" fill="#3fa34d"/><path d="M${x-18} ${y+4} q6-18 20-16 q-2 14-20 16z" fill="#4fbf5c"/><path d="M${x-22} ${y+4} q-14-8-8-22 q12 6 8 22z" fill="#2f8c3e"/></g>`;
  case 'cherry':return `<g class="gar"><path d="M${x} ${y-2} q4-16 14-20" stroke="#6b3a1a" stroke-width="2" fill="none"/><circle cx="${x}" cy="${y}" r="7.5" fill="#c8102e"/><circle cx="${x-2.5}" cy="${y-2.5}" r="2" fill="#ff8a9a"/></g>`;
  case 'pineapple':return `<g class="gar"><path d="M${x-10} ${y+6} L${x+14} ${y-14} L${x+16} ${y+8} Z" fill="#f6d64a" stroke="#fff3b0" stroke-width="1.5"/><path d="M${x+14} ${y-14} l4-14 l2 12 l6-8 l-4 12" fill="#3fa34d"/></g>`;
 }
 return '';
}
function glassSVG(type,layers,garnish,mini){
 const g=GL[type]||GL.rocks,id='gc'+(++uid),h=g.b-g.t;let y=g.b,r='';
 (layers||[]).forEach((L,i)=>{const lh=L[1]*h;y-=lh;
  r+=`<g class="lg"><rect x="0" y="${y.toFixed(1)}" width="120" height="${(lh+.7).toFixed(1)}" fill="${L[0]}" clip-path="url(#${id})"/></g>`;});
 const sw=mini?3.4:2.4;
 return `<svg viewBox="0 0 120 160" aria-hidden="true"><defs><clipPath id="${id}"><path d="${g.c}"/></clipPath><linearGradient id="${id}s" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".14"/></linearGradient></defs>`+
  `<path d="${g.c}" fill="rgba(255,255,255,.035)"/>${r}<g class="shell"><rect x="0" y="0" width="120" height="160" fill="url(#${id}s)" clip-path="url(#${id})"/><g fill="none" stroke="rgba(255,248,235,.8)" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="${g.o}"/>${g.x}</g></g>${garnishSVG(garnish,g)}</svg>`;
}
const COLORS=[[/cola|cockta/,'#3b1a0c'],[/fanta orange|tangerine|marelica|cijeđeni|juicy/,'#f7931e'],[/lemon|sprite|radler|limunad/,'#e5e27a'],[/tonic|voda|römer|emotion/,'#d7ecf3'],[/cherry|višnj|višnjevac|šipak/,'#8e1030'],[/ribiz/,'#3d0f2a'],[/breskva/,'#e2833a'],[/šumsko/,'#8e1f3a'],[/red bull/,'#2a4a8a'],[/aperol/,'#f06a1d'],[/jäger|pelinkovac|teranino|crno/,'#3a140c'],[/medica|dunja|southern|bazga|kajsija|lješnjak|štrukani/,'#e0a43a'],[/malibu/,'#f4f0e6'],[/martini bianco/,'#efe6c2'],[/fiero/,'#e8401e'],[/čaj/,'#c96a1c'],[/čokolad/,'#5b3421']];

  case 'soda':return it.prices[0].unit==='can'?glassSVG('can',[[col||'#2a4a8a',1]],null,mini):it.prices[0].unit==='glass'?glassSVG('highball',[[col||'#f3a93a',.8]],null,mini):glassSVG('bottle',[[col||'#b8332a',.85]],null,mini);

  case 'spirit':{const b=it.base;const cc=col||({vodka:'#eef3f5',gin:'#eaf3ee',rakija:'#f2e8c0',tequila:'#f1e2b8',vermouth:'#efe6c2'}[b])||'#c47a2a';return glassSVG(it.prices.some(p=>p.unit==='glass')?'rocks':'bottle',[[cc,it.prices.some(p=>p.unit==='glass')?.4:.85]],null,mini);}

function go(st,opt={}){if(VIEW.v==='home')homeY=scrollY;const prev=keyOf(VIEW);VIEW=st;
 try{history.pushState({view:st},'',st.v==='cat'?'#'+st.g:location.pathname+location.search);depth++;}catch(e){}
 applyView(prev!==keyOf(st),opt);}
function goBack(){if(depth>0){try{history.back();return}catch(e){}}go({v:'home'});}
function applyView(changed,opt={}){
 const qr=VIEW.v==='qr';document.body.classList.toggle('qr',qr);if(qr){renderQR();return}
 const home=VIEW.v==='home',vh=$('#vHome'),vc=$('#vCat');vh.hidden=!home;vc.hidden=home;
 const anim=(el,c)=>{el.classList.remove('in-r','in-l');if(opt.first||reduced)return;void el.offsetWidth;el.classList.add(c);};
 if(home){if(changed){anim(vh,'in-l');jump(opt.focusSearch?Math.max(0,$('#hub').getBoundingClientRect().top+scrollY-8):homeY);}}
 else{renderCat(GBY[VIEW.g]);anim(vc,'in-r');jump(0);$('.cbar').classList.remove('scrolled');requestAnimationFrame(()=>{spy();onScroll();});}
}
$$('.view').forEach(v=>v.addEventListener('animationend',()=>v.classList.remove('in-r','in-l')));

/* ================= podkartice (scrollspy) ================= */
let lockTo=null,lockT=null,spyQ=false,active=null;
const barH=()=>{const b=$('.cbar');return b?b.offsetHeight:0};
function spy(){if(VIEW.v!=='cat'||lockTo)return;const y=barH()+24;let cur=null;const secs=$$('#catBody section.cat');
 for(const s of secs){if(!cur)cur=s.dataset.cat;if(s.getBoundingClientRect().top<=y)cur=s.dataset.cat;else break;}
 if(secs.length&&innerHeight+scrollY>=document.documentElement.scrollHeight-4)cur=secs[secs.length-1].dataset.cat; // dno stranice = zadnje poglavlje
 if(cur)setActive(cur);}
function onScroll(){if(VIEW.v!=='cat')return;const hd=$('#catBody .chead');$('.cbar').classList.toggle('scrolled',!!hd&&hd.getBoundingClientRect().bottom<barH()+6);
 if(lockTo){clearTimeout(lockT);lockT=setTimeout(()=>{lockTo=null;spy();},160);return;}
 if(!spyQ){spyQ=true;requestAnimationFrame(()=>{spyQ=false;spy();});}}
addEventListener('scroll',onScroll,{passive:true});
function goSec(id,smooth=true){const s=$('#s-'+id);if(!s)return;lockTo=id;setActive(id);
 const top=Math.max(0,s.getBoundingClientRect().top+scrollY-barH()+2);
 if(Math.abs(top-scrollY)<2){lockTo=null;return;}
 clearTimeout(lockT);lockT=setTimeout(()=>{lockTo=null;spy();},1200);
 if(smooth&&!reduced)scrollTo({top,behavior:'smooth'});else jump(top);}
function setActive(id){if(active===id)return;active=id;$$('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.sec===id));
 const ch=$(`#chips .chip[data-sec="${id}"]`),row=$('#chips');if(ch)row.scrollTo({left:ch.offsetLeft-row.clientWidth/2+ch.clientWidth/2,behavior:reduced?'auto':'smooth'});}

/* ================= sheets ================= */
const scrim=$('#scrim');let openSheet=null;
function showSheet(el){if(openSheet&&openSheet!==el)hideSheet(true);openSheet=el;el.hidden=false;requestAnimationFrame(()=>{el.classList.add('on');scrim.classList.add('on');});document.body.classList.add('lock');el.scrollTop=0;
 try{history.pushState({sheet:el.id},'')}catch(e){}}
function hideSheet(silent){const el=openSheet;if(!el)return;el.classList.remove('on');el.style.transform='';scrim.classList.remove('on');document.body.classList.remove('lock');openSheet=null;setTimeout(()=>{if(!el.classList.contains('on'))el.hidden=true;},450);
 if(!silent&&history.state&&history.state.sheet){skipPop=true;try{history.back()}catch(e){skipPop=false}}}
addEventListener('popstate',e=>{if(skipPop){skipPop=false;return}
 if(openSheet){hideSheet(true);return}
 const st=(e.state&&e.state.view)||stateFromHash();if(VIEW.v==='home')homeY=scrollY;const prev=keyOf(VIEW);VIEW=st;depth=Math.max(0,depth-1);applyView(prev!==keyOf(st));});
addEventListener('hashchange',()=>{const st=stateFromHash();if(keyOf(st)===keyOf(VIEW))return;if(VIEW.v==='home')homeY=scrollY;VIEW=st;applyView(true);});
scrim.addEventListener('click',()=>hideSheet());
addEventListener('keydown',e=>{if(e.key==='Escape'&&openSheet)hideSheet();});

/* drag to close / implode */
$$('.sheet').forEach(sh=>{let y0=null,dy=0;
 sh.addEventListener('touchstart',e=>{if(sh.scrollTop<=0){y0=e.touches[0].clientY;dy=0;}else y0=null;},{passive:true});
 sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){sh.classList.add('drag');sh.style.transform=`translateY(${dy*.6}px)`;}},{passive:true});
 sh.addEventListener('touchend',()=>{if(y0==null)return;sh.classList.remove('drag');const st=$('.stage',sh);
  if(dy>80){if(st&&st.classList.contains('ex')){explode(st,false);sh.style.transform='';buzz(8);}else{hideSheet();}}else sh.style.transform='';y0=null;});
});


/* ================= draft pour animation ================= */
function pourScene(it,size){
 const big=size!=='s',P=it.pour||{},c1=P.color||'#f2b12e',c2=P.deep||'#c97d0c';
 // čaša: 0,5 l (pint) ili 0,25 l (manja)
 const G=big?{t:112,b:292,wt:62,wb:44}:{t:172,b:292,wt:50,wb:38};
 const cx=120,h=G.b-G.t,L=cx-G.wt,R=cx+G.wt,bl=cx-G.wb,br=cx+G.wb;
 const surf=G.t+h*.16,foamH=h*.13,start=G.b+6;
 let bub='';for(let i=0;i<16;i++){const x=cx-G.wb+8+Math.random()*(G.wb*2-16),y=40+Math.random()*(h*.7),r=(0.8+Math.random()*1.8).toFixed(1);
  bub+=`<circle class="bub" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" style="--d:-${(y-6).toFixed(0)}px;animation-delay:${(0.7+Math.random()*2.2).toFixed(2)}s;animation-duration:${(1.2+Math.random()*1.4).toFixed(2)}s"/>`;}
 let drops='';for(let i=0;i<14;i++){const f=Math.random(),y=G.t+18+Math.random()*(h-30),w=G.wt-(G.wt-G.wb)*((y-G.t)/h)-6,x=cx+(Math.random()*2-1)*w;
  drops+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(1+f*1.4).toFixed(1)}" ry="${(1.4+f*2).toFixed(1)}" style="animation-delay:${(3+Math.random()*.9).toFixed(2)}s"/>`;}
 let foam='';for(let x=L-6;x<=R+6;x+=11)foam+=`<circle cx="${x}" cy="${(-foamH+2+Math.random()*3).toFixed(1)}" r="${(6+Math.random()*4).toFixed(1)}"/>`;
 const logo=`<g class="etch" transform="translate(${cx-22} ${G.t+h*.5-16}) scale(.2)"><g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M44 8 C26 8 30 26 30 42 C30 60 26 74 14 78 C26 82 30 96 30 114 C30 130 26 148 44 148"/><path d="M176 8 C194 8 190 26 190 42 C190 60 194 74 206 78 C194 82 190 96 190 114 C190 130 194 148 176 148"/><path d="M69 16 V60 M69 16 H89 A10 10 0 0 1 89 36 H69 M69 36 H91 A12 12 0 0 1 91 60 H69"/><path d="M117 16 V45 A17 17 0 0 0 151 45 V16"/><path d="M69 112 V68 H89 A11 11 0 0 1 89 90 H69 M85 90 L103 112"/><path d="M117 68 H151 V112 H117 M125 90 H151"/></g></g>`;
 return `<svg class="pour" viewBox="0 -54 240 360" role="img" aria-label="${lang==='hr'?'Točenje piva':'Pouring a beer'}" style="--y0:${start}px;--y1:${surf.toFixed(1)}px;--sl:${(G.b-78)}px">
  <defs>
   <linearGradient id="pChrome" x1="0" x2="1"><stop offset="0" stop-color="#6d6a66"/><stop offset=".35" stop-color="#f4f1ec"/><stop offset=".55" stop-color="#a9a49c"/><stop offset="1" stop-color="#4c4945"/></linearGradient>
   <linearGradient id="pChromeV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f1ec"/><stop offset=".5" stop-color="#9c978f"/><stop offset="1" stop-color="#5a5752"/></linearGradient>
   <linearGradient id="pBeer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>
   <linearGradient id="pBeerH" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".22" stop-color="#fff" stop-opacity=".28"/><stop offset=".32" stop-color="#fff" stop-opacity="0"/><stop offset=".85" stop-color="#000" stop-opacity=".12"/></linearGradient>
   <linearGradient id="pStream" x1="0" x2="1"><stop offset="0" stop-color="${c2}"/><stop offset=".45" stop-color="#ffe19a"/><stop offset="1" stop-color="${c2}"/></linearGradient>
   <clipPath id="pGlass"><path d="M${L+2} ${G.t} L${bl+2} ${G.b-4} Q${cx} ${G.b+2} ${br-2} ${G.b-4} L${R-2} ${G.t} Z"/></clipPath>
   <radialGradient id="pGlow"><stop offset="0" stop-color="#ffb347" stop-opacity=".35"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="${cx}" cy="${G.b+8}" rx="${G.wb+26}" ry="8" fill="#000" opacity=".45"/>
  <ellipse class="glow" cx="${cx}" cy="${G.t+h*.55}" rx="110" ry="${h*.7}" fill="url(#pGlow)"/>
  <!-- točionik -->
  <rect x="18" y="-60" width="34" height="170" rx="8" fill="url(#pChrome)"/>
  <rect x="44" y="30" width="70" height="20" rx="9" fill="url(#pChromeV)"/>
  <rect x="104" y="26" width="32" height="28" rx="10" fill="url(#pChrome)"/>
  <path d="M112 52 h16 v14 q0 10 -8 10 q-8 0 -8 -10z" fill="url(#pChrome)"/>
  <g class="handle"><rect x="112" y="-44" width="16" height="74" rx="8" fill="#1d1a17" stroke="#3a332c" stroke-width="2"/><rect x="115" y="-38" width="4" height="56" rx="2" fill="#fff" opacity=".12"/><circle cx="120" cy="30" r="7" fill="url(#pChrome)"/></g>
  <!-- mlaz -->
  <g class="stream"><rect x="116.5" y="74" width="7" height="${G.b-74}" rx="3.5" fill="url(#pStream)"/><line x1="120" y1="74" x2="120" y2="${G.b}" stroke="#fff6d8" stroke-width="1.6" stroke-dasharray="6 10" class="flow" opacity=".7"/></g>
  <!-- čaša: stražnji dio -->
  <path d="M${L} ${G.t} L${bl} ${G.b-4} Q${cx} ${G.b+3} ${br} ${G.b-4} L${R} ${G.t}" fill="rgba(255,255,255,.05)"/>
  <g clip-path="url(#pGlass)">
   <g class="fill">
    <rect x="${L-10}" y="0" width="${R-L+20}" height="${h+40}" fill="url(#pBeer)"/>
    <rect x="${L-10}" y="0" width="${R-L+20}" height="${h+40}" fill="url(#pBeerH)"/>
    <g fill="#fff8e6" class="bubs">${bub}</g>
    <g class="foam"><rect x="${L-10}" y="${(-foamH).toFixed(1)}" width="${R-L+20}" height="${(foamH+3).toFixed(1)}" fill="#fbf3dc"/><rect x="${L-10}" y="-4" width="${R-L+20}" height="7" fill="#f1dca4" opacity=".8"/><g fill="#fffaf0">${foam}</g></g>
   </g>
  </g>
  ${logo}
  <g class="drops" fill="#fff" opacity=".0">${drops}</g>
  <!-- čaša: obrub i odsjaj -->
  <path d="M${L} ${G.t} L${bl} ${G.b-4} Q${cx} ${G.b+3} ${br} ${G.b-4} L${R} ${G.t}" fill="none" stroke="rgba(255,248,235,.85)" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M${bl} ${G.b-4} Q${cx} ${G.b+3} ${br} ${G.b-4}" fill="none" stroke="rgba(255,248,235,.9)" stroke-width="7" stroke-linecap="round"/>
  <path d="M${L+9} ${G.t+10} L${bl+7} ${G.b-16}" stroke="#fff" stroke-opacity=".32" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="${cx}" cy="${G.t}" rx="${G.wt}" ry="4" fill="none" stroke="rgba(255,248,235,.6)" stroke-width="1.5"/>
 </svg>`;
}
function pourBlock(it,size){
 return `<div class="pourbox" data-size="${size}">${pourScene(it,size)}</div>
 <div class="pourctl"><div class="seg">${[['s','0,25 l'],['b','0,5 l']].map(([k,l])=>`<button data-psize="${k}" aria-pressed="${k===size}">${l}</button>`).join('')}</div>
 <button class="pill" data-replay>↻ ${lang==='hr'?'Natoči ponovno':'Pour again'}</button></div>`;
}
function runPour(){if(reduced)return;buzz([20,60,20,60,20,60,20,60,20,300,40]);}

/* ================= detail / exploded ================= */
function strengthHTML(s){if(s==null)return `<span class="small">${t('askStaff')}</span>`;return `<div class="str" aria-label="${s}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;}
function ingIcon(k,size){const g=MENU.ingredients[k]||MENU.ingredients.secret;const c=g.color;const lum=parseInt(c.slice(1,3),16)*.3+parseInt(c.slice(3,5),16)*.59+parseInt(c.slice(5,7),16)*.11;
 return `<span class="o" style="--c:${c};color:${lum>150?'#2a1a0c':'#fff5e6'}">${svg(II[g.icon]||II.mystery,size)}</span>`;}
const AMT={top:['dopuna','top up'],'2 tsp':['2 žličice','2 tsp'],'8 lvs':['8 listića','8 leaves'],'shot':['1 espresso','1 espresso']};
function amt(a){return AMT[a]?AMT[a][lang==='hr'?0:1]:a;}
function openDetail(it){
 const d=$('#detail'),R=it.recipe,I=MENU.ingredients,f=favs.has(it.id);
 let h=`<div class="grab"><span></span><button class="close" data-close aria-label="${t('close')}">${svg(UI.x,24)}</button></div><div class="pad">`;
 h+=`<div class="d-head">${R?photo(it,'d-ph'):''}<div>`+badges(it,true)+`<h2 class="d-name">${esc(nm(it))}</h2>${dsc(it)?`<p class="d-desc">${esc(dsc(it))}</p>`:''}</div></div>`;
 if(R){
  h+=`<div class="stage" id="stage" aria-label="${t('tapExplode')}">${glassSVG(R.glass,R.layers,R.garnish,false).replace('<svg ','<svg class="glass" ')}<svg class="links"></svg>`+
   R.ings.map(([k,a],i)=>{const g=I[k]||I.secret;return `<div class="orb${i%2?' r':''}" data-i="${i}">${ingIcon(k,22)}<span class="t"><b>${esc(L(g))}</b>${a?`<i>${esc(amt(a))}</i>`:''}</span></div>`}).join('')+`<div class="tap">${t('tapExplode')}</div></div>`;
 }else if(it.pour){h+=pourBlock(it,'b');}
 else h+=`<div class="hero-ico">${thumbFor(it,false)}</div>`;
 h+=`<div class="box"><h4>${t('prices')}</h4><div class="plist">${it.prices.map(p=>`<div class="prow"><span>${esc(priceLabel(p)||L({hr:'Cijena',en:'Price'}))}</span><b>${money(p.eur)}</b></div>`).join('')}</div>
  ${it.cat.promo&&it.prices.some(p=>p.unit==='bottle')?`<div class="promo" style="margin:10px 0 0"><b>−30%</b><span>${esc(L(MENU.meta.promo))}</span></div>`:''}</div>`;
 if(R){
  h+=`<div class="meta"><div class="box"><h4>${t('strength')}</h4>${strengthHTML(it.strength)}</div><div class="box"><h4>${t('glass')}</h4>${esc(t('glasses')[R.glass]||'')}</div>
   <div class="box full"><h4>${t('taste')}</h4><p style="margin:0 0 8px">${esc(L(R.taste))}</p><h4>${t('lovers')}</h4><p style="margin:0">${esc(L(R.lovers))}</p></div>
   ${R.profile?`<div class="box full"><h4>${t('profile')}</h4><div class="prof">${t('pf').map((n,i)=>`<div>${n}<s style="--w:0%" data-w="${Math.round(R.profile[i]/3*100)}%"></s></div>`).join('')}</div></div>`:''}
   <div class="box full"><h4>${t('ingredients')}</h4>${R.ings.map(([k,a])=>{const g=I[k]||I.secret;return `<div class="ing">${ingIcon(k,18)}<div><b>${esc(L(g))}</b>${a?`<em>${esc(amt(a))}</em>`:''}<p>${esc(L(g.why))}</p></div></div>`}).join('')}${it.check.includes('recipe')?`<p class="small" style="margin:8px 0 0">${t('approx')}</p>`:''}</div></div>`;
 }else h+=`<div class="meta"><div class="box"><h4>${t('strength')}</h4>${it.alcohol?strengthHTML(it.strength):`<span class="b na">${t('noAlc')}</span>`}</div><div class="box"><h4>${lang==='hr'?'Kategorija':'Category'}</h4>${esc(L(it.cat.name))}</div></div>`;
 h+=`<button class="bigbtn ${f?'':'gold'}" data-favbig="${it.id}">${svg(f?UI.heartF:UI.heart,22)} ${f?t('inFav'):t('addFav')}</button></div>`;
 d.innerHTML=h;showSheet(d);buzz(10);
 if(it.pour){d._pourIt=it;setTimeout(runPour,450);}
 if(R){const st=$('#stage');layoutOrbs(st);st.addEventListener('click',()=>{explode(st,!st.classList.contains('ex'));});
  setTimeout(()=>{if(openSheet===d)explode(st,true);$$('.prof s',d).forEach(s=>s.style.setProperty('--w',s.dataset.w));},reduced?0:420);}
}
function layoutOrbs(st){const w=st.clientWidth,h=st.clientHeight,orbs=$$('.orb',st),n=orbs.length,k=Math.ceil(n/2),ow=Math.min(118,w*.31);
 const pos=orbs.map((o,i)=>{const col=i%2,row=Math.floor(i/2),rows=col?Math.floor(n/2):k;const y=rows<=1?h*.42:h*(.14+row*(.68/(rows-1)));const x=col?w-ow/2-6:ow/2+6;o.style.width=ow+'px';return {x,y,col};});
 st._pos=pos;const lk=$('.links',st);lk.setAttribute('viewBox',`0 0 ${w} ${h}`);
 lk.innerHTML=pos.map(p=>{const ox=p.col?p.x+ow/2-21:p.x-ow/2+21;return `<line x1="${ox}" y1="${p.y}" x2="${w/2+(p.col?18:-18)}" y2="${h/2+(p.y-h/2)*.35}"/>`}).join('');}
function explode(st,on){st.classList.toggle('ex',on);const w=st.clientWidth,h=st.clientHeight;
 const lgs=$$('.glass .lg',st),n=lgs.length;lgs.forEach((g,i)=>{g.style.transform=on?`translateY(${(-(i-(n-1)/2)*18-8).toFixed(1)}px)`:'';});
 const gar=$('.glass .gar',st);if(gar)gar.style.transform=on?'translate(14px,-30px) rotate(18deg)':'';
 $$('.orb',st).forEach((o,i)=>{const p=st._pos[i];o.style.transitionDelay=on?(i*55)+'ms':'0ms';o.style.transform=on?`translate(calc(-50% + ${(p.x-w/2).toFixed(1)}px),calc(-50% + ${(p.y-h/2).toFixed(1)}px)) scale(1)`:'';});
 const tp=$('.tap',st);if(tp)tp.textContent=on?t('tapImplode'):t('tapExplode');buzz(on?[6,30,10]:8);}

/* ================= favourites ================= */
function toggleFav(id){if(favs.has(id)){favs.delete(id);toast(t('removed'));}else{favs.add(id);toast(t('added'));}store.set('bure_favs',[...favs]);buzz(12);
 $$(`[data-fav="${id}"]`).forEach(b=>{const on=favs.has(id);b.setAttribute('aria-pressed',on);b.innerHTML=svg(on?UI.heartF:UI.heart,26);});updateFavCount();}
function updateFavCount(){const n=favs.size||'';$$('.favcount').forEach(e=>e.textContent=n);}
function openFavs(){const d=$('#favs');const list=[...favs].map(id=>BYID[id]).filter(Boolean);
 d.innerHTML=`<div class="grab"><h3>♥ ${t('fav')}</h3><button class="close" data-close aria-label="${t('close')}">${svg(UI.x,24)}</button></div><div class="pad" id="favpad">`+
 (list.length?list.map(it=>`<div class="fitem"><span class="n">${esc(nm(it))}</span><span class="p">${it.prices[0].eur?money(it.prices[0].eur):''}</span><button data-unfav="${it.id}" aria-label="×">${svg(UI.x,20)}</button></div>`).join('')+
  `<button class="bigbtn gold" id="showW">${t('showWaiter')}</button><button class="bigbtn" id="favClear">${t('clearAll')}</button>`:`<p class="empty" style="padding:24px 0">${t('favEmpty')}</p>`)+`</div>`;
 showSheet(d);}
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600);}

/* ================= events ================= */
document.addEventListener('click',e=>{const tg=e.target;
 const ps=tg.closest('[data-psize],[data-replay],.pourbox');if(ps){const d=$('#detail'),it=d._pourIt;if(it){const box=$('.pourbox',d);const sz=ps.dataset.psize||box.dataset.size;box.dataset.size=sz;box.innerHTML=pourScene(it,sz);$$('[data-psize]',d).forEach(b=>b.setAttribute('aria-pressed',b.dataset.psize===sz));runPour();}return;}
 const fb=tg.closest('[data-favbig]');if(fb){toggleFav(fb.dataset.favbig);const on=favs.has(fb.dataset.favbig);fb.className='bigbtn '+(on?'':'gold');fb.innerHTML=svg(on?UI.heartF:UI.heart,22)+' '+(on?t('inFav'):t('addFav'));return;}
 const uf=tg.closest('[data-unfav]');if(uf){toggleFav(uf.dataset.unfav);openFavs();return;}
 if(tg.closest('[data-close]')){hideSheet();return;}
 if(tg.closest('#showW')){const p=$('#favpad');p.classList.toggle('showmode');tg.closest('#showW').textContent=p.classList.contains('showmode')?t('normalView'):t('showWaiter');buzz(8);return;}
 if(tg.closest('#favClear')){favs.clear();store.set('bure_favs',[]);updateFavCount();openFavs();return;}
 const cd=tg.closest('.card');if(cd){openDetail(BYID[cd.dataset.id]);return;}
 const gt=tg.closest('[data-group]');if(gt){buzz(8);go({v:'cat',g:gt.dataset.group});return;}
 const sc=tg.closest('[data-sec]');if(sc){buzz(6);goSec(sc.dataset.sec);return;}
 if(tg.closest('#back')){buzz(6);goBack();return;}
 if(tg.closest('[data-home]')){go({v:'home'});return;}
 if(tg.closest('#catSearch')){go({v:'home'},{focusSearch:true});setTimeout(()=>{try{$('#q').focus({preventScroll:true})}catch(e){$('#q').focus()}},80);return;}
 if(tg.closest('[data-anon]')){buzz(8);openFeedback();return;}
 const lb=tg.closest('.lang button');if(lb){lang=lb.dataset.l;store.set('bure_lang',lang);buzz(6);renderAll();return;}

});

/* ================= anonymous feedback ================= */
function openFeedback(){const d=$('#fbsheet'),f=$('#fbform');
 $('#fbtopics').innerHTML=t('topics').map(([v,l],i)=>`<label class="tp"><input type="radio" name="tema" value="${v}"${i===0?' checked':''}><span>${esc(l)}</span></label>`).join('');
 $('#fbmsg').placeholder=t('fbMsgPh');$('#fbwhen').placeholder=t('fbWhenPh');$('#fbcontact').placeholder=t('fbContactPh');
 $('#fbstatus').textContent='';$('#fbstatus').className='fbstatus';f.hidden=false;$('#fbdone').hidden=true;
 const b=$('#fbsend');b.disabled=false;b.textContent=t('fbSend');showSheet(d);}
$('#fbform').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,st=$('#fbstatus'),b=$('#fbsend');
 if($('#fbmsg').value.trim().length<5){st.textContent=t('fbShort');st.className='fbstatus err';$('#fbmsg').focus();return;}
 b.disabled=true;b.textContent=t('fbSending');st.textContent='';
 const fd=new FormData(f);fd.set('jezik',lang);fd.set('vrijeme-slanja',new Date().toLocaleString('hr-HR'));
 const ep=MENU.meta.feedbackEndpoint;
 try{const r=ep?await fetch(ep,{method:'POST',headers:{Accept:'application/json'},body:fd})
   :await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(fd).toString()});
  if(!r.ok)throw new Error(r.status);
  f.reset();f.hidden=true;$('#fbdone').hidden=false;buzz([10,40,10]);
 }catch(err){st.textContent=t('fbErr');st.className='fbstatus err';b.disabled=false;b.textContent=t('fbSend');buzz(30);}
});

/* ================= QR route ================= */
function qrSVG(text){const m=qrMatrix(text),n=m.length,qz=4,s=n+qz*2;let d='';m.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+qz} ${y+qz}h1v1h-1z`;}));
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;}
function renderQR(){
 const url=MENU.meta.url||location.href.split('#')[0];const s=qrSVG(url);
 $('#qrview').innerHTML=`<div style="max-width:420px;margin:0 auto"><svg viewBox="0 0 220 160" style="width:120px;margin:0 auto;color:#111">${LOGO}</svg><h2>${esc(MENU.meta.name)}</h2><div>${t('qrTitle')}</div>
  <div class="qrbox">${s}</div><div style="font-weight:800;font-size:18px">${t('qrHint')}</div><div class="u">${esc(url)}</div>
  ${MENU.meta.url?'':`<p class="small" style="color:#a15c00">⚠️ MENU.meta.url ${lang==='hr'?'nije upisan — QR vodi na trenutnu adresu.':'is empty — QR points to the current address.'}</p>`}
  <div class="btns"><button onclick="print()">${t('qrPrint')}</button><a id="qrdl" download="bure-bar-qr.svg">${t('qrSave')}</a><a class="sec" href="#">${t('qrBack')}</a></div></div>`;
 try{$('#qrdl').href=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));}catch(e){}
}

/* ================= intro: ulazak kroz vrata ================= */
(function intro(){const el=$('#intro');let seen=false;try{seen=sessionStorage.getItem('bure_intro2')}catch(e){}
 if(seen||reduced||location.hash==='#qr'){el.remove();return;}
 try{sessionStorage.setItem('bure_intro2','1')}catch(e){}
 $('.hint',el).textContent=t('enter');
 const ev=eventToday();$('#introSub').textContent=ev?`${t('tonight')}: ${ev[lang]||ev.hr}`:(lang==='hr'?'Pivnica · Bar · Osijek':'Pub · Bar · Osijek');
 $('#introHello').textContent=t('welcome');
 // publika
 const cr=$('#crowd');let g='';const rows=[[150,16,'#2a1638',1.35],[178,13,'#170c20',1.6],[210,11,'#07040a',1.9]];
 rows.forEach(([y,n,c,sc],ri)=>{for(let i=0;i<n;i++){const x=(i+.5)*(400/n)+(Math.random()*10-5),s=sc*(0.85+Math.random()*.3),up=Math.random();
   const arms=up<.45?`<path d="M-9 -2 L-16 -34 M9 -2 L16 -34" stroke="${c}" stroke-width="${5*s}" stroke-linecap="round"/>`:up<.75?`<path d="M9 -2 L14 -36" stroke="${c}" stroke-width="${5*s}" stroke-linecap="round"/>${Math.random()<.5?`<rect x="11" y="-44" width="5" height="8" rx="1" fill="#e8f0ff" class="ph"/>`:''}`:'';
   g+=`<g class="p" style="animation-delay:-${(Math.random()*.48).toFixed(2)}s"><g transform="translate(${x.toFixed(1)} ${y}) scale(${s.toFixed(2)})">${arms}<path d="M-14 40 Q-15 4 -8 0 L8 0 Q15 4 14 40Z" fill="${c}"/><circle cy="-10" r="9" fill="${c}"/></g></g>`;}});
 cr.innerHTML=g;
 // konfeti
 const cf=$('#confetti');let f='';for(let i=0;i<34;i++){f+=`<i style="left:${(Math.random()*100).toFixed(1)}%;background:${['#f2c872','#fff','#ff3fa4','#8b5cff','#39e6ff'][i%5]};animation-delay:${(1.25+Math.random()*1.1).toFixed(2)}s;animation-duration:${(1.4+Math.random()*1.2).toFixed(2)}s;--rx:${Math.floor(Math.random()*720-360)}deg"></i>`}cf.innerHTML=f;
 buzz([20,460,20,460,60,120,60]);
 const done=()=>{if(el.classList.contains('out'))return;el.classList.add('out');setTimeout(()=>el.remove(),600);};
 const tmr=setTimeout(done,3700);el.addEventListener('click',()=>{clearTimeout(tmr);buzz(8);done();});
})();

VIEW=stateFromHash();try{history.scrollRestoration='manual';history.replaceState({view:VIEW},'')}catch(e){}
renderAll();applyView(true,{first:true});

})();
