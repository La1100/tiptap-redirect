/* TipTap suite — zajednički stil (rezervacije, admin, grupa). Boje lokala dolaze iz :root varijabli. */
:root{
  color-scheme:dark;
  --bg:#12100e;--card:#211d19;--card2:#2b2621;
  --gold:#d4ae5a;--gold2:#f2c872;--amber:#ff9f2e;--text:#f6f0e5;--muted:#b8ad99;--dim:#8a8070;
  --gold-rgb:212,174,90;--gold2-rgb:242,200,114;--amber-rgb:255,159,46;--bg-rgb:18,16,14;
  --line:rgba(var(--gold-rgb),.22);
  --ok:#8fd19e;--warn:#f4bf52;--bad:#ff8a7a;--blue:#8ab8ff;--ink:#1a1409;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 50% at 50% -10%,rgba(var(--amber-rgb),.12),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 64px),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--gold2)}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:10px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(14px,env(safe-area-inset-top)) 0 8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);min-width:0}
.brand svg{width:52px;height:38px;flex:none;color:var(--gold2);filter:drop-shadow(0 0 8px rgba(var(--amber-rgb),.35))}
.brand.wm svg{width:auto;height:30px;max-width:150px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.05em;text-transform:uppercase;line-height:1;white-space:nowrap}
.brand small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1.title{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;letter-spacing:.03em;text-transform:uppercase;margin:14px 0 4px;background:linear-gradient(180deg,#fff,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);margin:0 0 14px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(0,0,0,.25);flex:none}
.lang button{min-width:44px;height:40px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid rgba(255,255,255,.05);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 24px -18px #000}
.card h2{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.card h2 .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--ink);font-family:var(--f-body);font-size:14px;letter-spacing:0;flex:none}
.lbl{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:16px 0 8px}
.lbl:first-child{margin-top:0}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
.row::-webkit-scrollbar{display:none}
.wrapx{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-weight:700;font-size:15px;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.18s;white-space:nowrap}
.chip small{font-weight:500;color:var(--muted);font-size:12px}
.chip.day{flex-direction:column;gap:0;min-width:62px;height:66px;padding:0 10px;line-height:1.15}
.chip.day small{text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.chip[aria-pressed=true]{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink);border-color:transparent;box-shadow:0 0 16px rgba(var(--gold2-rgb),.35)}
.chip[aria-pressed=true] small{color:rgba(0,0,0,.6)}
.chip:disabled{opacity:.32;cursor:not-allowed;text-decoration:line-through}
.chip.day:disabled{text-decoration:none}
.chip.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:11px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:56px;height:56px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.2);font-size:28px;font-weight:700;color:var(--gold2)}
.stepper button:disabled{opacity:.3}
.stepper output{min-width:90px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1}
.stepper output small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=password],input[type=time],input[type=search],select,textarea{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font-size:16px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.15)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--muted);cursor:pointer;margin-top:14px}
.check input{width:24px;height:24px;flex:none;accent-color:var(--gold);margin:0}
.btn{min-height:56px;padding:0 20px;border-radius:16px;font-weight:800;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink);border:0;box-shadow:0 8px 24px -10px rgba(var(--gold2-rgb),.6)}
.btn.ok{background:#2f5a3a;border-color:#4f8a5d;color:#dff5e3}
.btn.bad{background:#5a2f2f;border-color:#8a4f4f;color:#ffe0dc}
.btn.wa{background:#1f7a4a;border-color:#2aa760;color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.xs{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.small{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.st-pending,.st-new{background:rgba(255,159,46,.16);color:#ffc47a}
.st-confirmed,.st-done{background:rgba(143,209,158,.16);color:var(--ok)}
.st-seated,.st-ack{background:rgba(138,184,255,.16);color:var(--blue)}
.st-declined,.st-cancelled,.st-noshow,.st-skip{background:rgba(255,138,122,.14);color:var(--bad)}
.st-done.grey{background:rgba(255,255,255,.08);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:150;pointer-events:none;transform:translate(-50%,160%);opacity:0;background:var(--card2);color:var(--text);padding:12px 18px;border-radius:14px;border:1px solid var(--line);font-weight:600;font-size:14px;transition:.35s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold2);animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.demo-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--gold2);border-radius:999px;padding:3px 9px}

/* ---------- tlocrt ---------- */
.planbox{position:relative;margin:0 -16px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding:0 16px 6px;scrollbar-width:thin}
.planbox svg{display:block;width:100%;min-width:580px;height:auto;border-radius:18px}
.plan{--pl-free:var(--gold2)}
.plan .pl-top{fill:var(--pl-table,#3b3129);stroke:none;transition:fill .25s}
.plan .pl-ring{stroke:#6b5e50;stroke-width:3;transition:stroke .25s}
.plan .pl-halo,.plan .pl-alert{opacity:0;transition:opacity .3s;pointer-events:none}
.plan .pl-label{fill:var(--text);font:800 21px var(--f-body);pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:4px;stroke-linejoin:round}

      if (ACTIVE.has(r.status) && !tableFree(cfg, list, body.tableId, r.start, r.id)) return { error: 'taken', status: 409 };
      r.tableId = body.tableId;
      const c = catOf(cfg, r.tableId);
      if (c && (c.minSpend || c.noShow)) Object.assign(r, { cat: c.id, minSpend: c.minSpend, noShowFee: c.noShow }); else { delete r.cat; delete r.minSpend; delete r.noShowFee; }

const LIVE_KINDS = ['call', 'bill', 'order', 'song'];
const liveKey = d => `live/${d}`;
const OPEN = new Set(['new', 'ack']);
async function liveCreate(store, body) {
  const cfg = await getConfig(store);
  const kind = str(body.kind, 10);
  if (!LIVE_KINDS.includes(kind)) return { error: 'kind', status: 400 };
  if (kind === 'song' && !cfg.features?.songs) return { error: 'kind', status: 400 };
  if (kind === 'order' && cfg.features?.orders === false) return { error: 'kind', status: 400 };
  if (kind === 'bill' && cfg.features?.bill === false) return { error: 'kind', status: 400 };
  if (!cfg.features?.tableMode) return { error: 'off', status: 403 };
  const table = str(body.table, 8).replace(/[^\w-]/g, '');
  if (!table && kind !== 'song') return { error: 'table', status: 400 };
  const b = bizNow();
  const item = { id: token(6), k: token(10), kind, table, status: 'new', createdAt: isoNow(), lang: body.lang === 'en' ? 'en' : 'hr' };
  if (kind === 'bill') item.pay = ['card', 'cash'].includes(body.pay) ? body.pay : '';
  if (kind === 'order') {
    const items = Array.isArray(body.items) ? body.items.slice(0, 25).map(x => ({ id: str(x.id, 80), n: str(x.n, 80), v: str(x.v, 24), q: Math.floor(num(x.q, 1, 20) ?? 1), e: num(x.e, 0, 10000) ?? 0 })).filter(x => x.n) : [];
    if (!items.length) return { error: 'items', status: 400 };
    item.items = items; item.total = Math.round(items.reduce((a, x) => a + x.q * x.e, 0) * 100) / 100;
  }
  if (kind === 'song') {
    item.song = { title: str(body.title, 80), artist: str(body.artist, 60), ded: str(body.ded, 120) };
    if (item.song.title.length < 2) return { error: 'title', status: 400 };
  }
  item.note = str(body.note, 200);
  return mutate(store, liveKey(b.date), [], list => {
    const open = list.filter(x => OPEN.has(x.status) && x.table === table);
    if ((kind === 'call' || kind === 'bill') && table) {
      const dup = open.find(x => x.kind === kind && Date.now() - Date.parse(x.createdAt) < 20 * 60e3);
      if (dup) {
        // isti stol već čeka konobara: novi razlog (npr. "Kombo: Silver Goose") dopiše se postojećem pozivu
        if (item.note && !(dup.note || '').includes(item.note)) { dup.note = str((dup.note ? dup.note + ' · ' : '') + item.note, 200); dup.updatedAt = isoNow(); return { ok: true, dup: true, id: dup.id, k: dup.k, item: dup }; }
        return { ok: true, noop: true, dup: true, id: dup.id, k: dup.k, item: dup };
      }
    }
    if (open.length >= 12) return { error: 'limit', status: 429 };
    if (kind === 'song' && list.filter(x => x.kind === 'song' && x.status === 'new' && x.table === table).length >= 3) return { error: 'limit', status: 429 };
    list.push(item);
    if (list.length > 600) list.splice(0, list.length - 600);
    return { ok: true, id: item.id, k: item.k, item };
  });
}

   STATISTIKA (otvaranja menija, pregledi pića, klikovi na recenziju…)
   Podijeljeno u 8 komada da se istovremeni upisi ne sudaraju.
   ===================================================================== */
const SHARDS = 8;
const stKey = (d, s) => `st/${d}/${s}`;
const EMPTY_ST = { open: 0, review: 0, book: 0, table: 0, view: {}, names: {} };
async function statsHit(store, body) {
  const ev = Array.isArray(body.ev) ? body.ev.slice(0, 40) : [];
  if (!ev.length) return { ok: true };
  const date = isDate(body.date) && body.date >= addDays(zagrebNow().date, -30) ? body.date : bizNow().date;
  const s = Math.floor(Math.random() * SHARDS);
  return mutate(store, stKey(date, s), EMPTY_ST, doc => {
    for (const e of ev) {
      const t = str(e.t, 10), n = Math.max(1, Math.min(500, Math.floor(+e.n || 1)));
      if (t === 'view') { const id = str(e.id, 80); if (!id) continue; doc.view[id] = (doc.view[id] || 0) + n; if (e.name) doc.names[id] = str(e.name, 80); }
      else if (['open', 'review', 'book', 'table'].includes(t)) doc[t] = (doc[t] || 0) + n;
    }
    return { ok: true };
  });
}
async function statsDay(store, date) {
  const out = structuredClone(EMPTY_ST);
  for (let s = 0; s < SHARDS; s++) {
    const r = await store.getJSON(stKey(date, s)); if (!r?.data) continue; const d = r.data;
    for (const k of ['open', 'review', 'book', 'table']) out[k] += d[k] || 0;
    for (const [id, n] of Object.entries(d.view || {})) out.view[id] = (out.view[id] || 0) + n;
    Object.assign(out.names, d.names || {});
  }
  return out;
}
async function adminStats(store, days = 14) {
  const b = bizNow(); const series = []; const tot = structuredClone(EMPTY_ST);
  for (let i = days - 1; i >= 0; i--) {
    const d = addDays(b.date, -i); const s = await statsDay(store, d);
    series.push({ date: d, open: s.open, review: s.review, book: s.book, table: s.table });
    for (const k of ['open', 'review', 'book', 'table']) tot[k] += s[k];
    for (const [id, n] of Object.entries(s.view)) tot.view[id] = (tot.view[id] || 0) + n;
    Object.assign(tot.names, s.names);
  }
  const top = Object.entries(tot.view).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([id, n]) => ({ id, n, name: tot.names[id] || id }));
  return { ok: true, days: series, total: { open: tot.open, review: tot.review, book: tot.book, table: tot.table }, top };
}

/* =====================================================================

const DAYS = { hr: ['nedjelja', 'ponedjeljak', 'utorak', 'srijeda', 'četvrtak', 'petak', 'subota'], en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'] };
const MONTHS_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function humanDate(date, lang = 'hr') { const [, m, d] = date.split('-'); return lang === 'en' ? `${DAYS.en[weekday(date)]}, ${+d} ${MONTHS_EN[+m - 1]}` : `${DAYS.hr[weekday(date)]}, ${+d}.${+m}.`; }
const formsOf = cfg => cfg.forms || { loc: 'u ' + cfg.venue, gen: 'iz ' + cfg.venue };
const eur = (v, L) => new Intl.NumberFormat(L === 'en' ? 'en-IE' : 'hr-HR', { style: 'currency', currency: 'EUR', minimumFractionDigits: Number.isInteger(+v) ? 0 : 2, maximumFractionDigits: 2 }).format(v);
const CARD_NAME = { visa: 'Visa', mc: 'Mastercard', amex: 'Amex', apple: 'Apple Pay', google: 'Google Pay' };
const cardLabel = c => (c ? `${CARD_NAME[c.brand] || 'Kartica'} •••• ${c.last4}` : '');
/** Trenutak pomaknut za delta minuta: { date, min } (min 0–1439). */
function shiftDM(date, min, delta) { const m = min + delta, d = Math.floor(m / 1440); return { date: addDays(date, d), min: m - d * 1440 }; }
function dlText(r, L) {
  const dl = guarDeadline(r), same = dl.date === r.date;
  return L === 'hr' ? (same ? `do ${fmt(dl.min)} na dan dolaska` : `do ${humanDate(dl.date, L)} u ${fmt(dl.min)}`) : (same ? `until ${fmt(dl.min)} on the day` : `until ${humanDate(dl.date, L)} at ${fmt(dl.min)}`);
}
function guarMsg(r, L) {
  const v = eur(r.guar.eur, L), c = cardLabel(r.guar.card), h = r.guar.hours || 12;
  // rezervirano kad je rok za besplatni otkaz već prošao (npr. danas za večeras): blokada odmah
  if (r.bookedAt && reached(guarDeadline(r), r.bookedAt)) return L === 'hr'
    ? `💳 Jamstvo ${v} · ${c}\nDo dolaska je manje od ${h} sati, pa je ${v} odmah blokirano na kartici — ništa nije naplaćeno. Čim hostesa skenira vašu ulaznicu, blokada se ukida. Ako otkažete ili ne dođete, naplaćuje se ${v}.`
    : `💳 ${v} guarantee · ${c}\nYour arrival is less than ${h} hours away, so ${v} is held on your card now — nothing has been charged. It's released as soon as the host scans your ticket. If you cancel or don't show up, ${v} is charged.`;
  return L === 'hr'
    ? `💳 Jamstvo ${v} · ${c} — ništa nije naplaćeno.\nBesplatno otkazivanje ${dlText(r, L)}. Od tada je ${v} blokirano na kartici, a čim hostesa skenira vašu ulaznicu, blokada se ukida.`
    : `💳 ${v} guarantee · ${c} — nothing has been charged.\nFree cancellation ${dlText(r, L)}. After that ${v} is held on your card and released as soon as the host scans your ticket.`;
}
/** WhatsApp poruke koje gost dobiva: potvrda odmah, podsjetnik dan prije, „vidimo se” 2 h prije (bez gnjavaže — najviše 3). */
function guestTimeline(r, cfg, site, now = zagrebNow()) {
  const abs = dm => Date.parse(dm.date + 'T00:00:00Z') / 6e4 + dm.min;   // minute za usporedbu
  const booked = r.bookedAt || null;
  const rem = shiftDM(r.date, r.start, -24 * 60), soon = shiftDM(r.date, r.start, -120);
  const out = [{ kind: 'confirmed', at: booked, sent: true, text: guestMessage(r, cfg, site, 'confirmed') }];
  // podsjetnik i „vidimo se” samo ako ima smisla (rezervacija nije napravljena tik prije)
  if (!booked || abs(rem) > abs(booked) + 60) out.push({ kind: 'remind', at: rem, sent: abs(now) >= abs(rem), text: guestMessage(r, cfg, site, 'remind', rem) });
  if (!booked || abs(soon) > abs(booked) + 30) out.push({ kind: 'soon', at: soon, sent: abs(now) >= abs(soon), text: guestMessage(r, cfg, site, 'soon') });
  return out;
}
/** „sutra u 21:00” / „danas u 09:00” / „petak, 23.10. u 21:00” — u odnosu na trenutak slanja poruke. */
function rel(date, min, asOf, L) {
  const d = (min >= 1440 ? addDays(date, 1) : date), t = fmt(min), base = asOf.date;
  const w = d === base ? (L === 'hr' ? (min >= 17 * 60 ? 'večeras' : 'danas') : (min >= 17 * 60 ? 'tonight' : 'today')) : d === addDays(base, 1) ? (L === 'hr' ? 'sutra' : 'tomorrow') : humanDate(d, L);
  return L === 'hr' ? `${w} u ${t}` : `${w} at ${t}`;
}
function guestMessage(r, cfg, site, kind, asOf = null) {

  const catTxt = r.minSpend ? (L === 'hr' ? ` (${zn.short || r.cat})\n💶 Minimalna potrošnja ${eur(r.minSpend, L)} po stolu` : ` (${zn.short || r.cat})\n💶 Minimum spend ${eur(r.minSpend, L)} per table`) : '';
  const dl = cancelDeadline(cfg, r.date);

.pm .hd h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:7mm;line-height:1;text-transform:uppercase}
.pm .hd h1 small{display:block;font:600 3.2mm var(--f-body);text-transform:none;color:#555;margin-top:1mm}
.pm .hd .sm{margin-left:auto;text-align:right;font:600 3mm/1.4 var(--f-body);color:#444}
.pm .sv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:4mm}
.pm .sv svg{width:100%;height:100%}
.pm .lgd{display:flex;gap:6mm;justify-content:center;font:600 2.8mm var(--f-body);color:#555;padding-top:2mm}
.pm .lgd i{display:inline-block;width:4mm;height:3mm;border-radius:.8mm;vertical-align:-.3mm;margin-right:1.5mm}
@media print{
  html.ttp-on,html.ttp-on body{background:#fff!important;height:auto!important;overflow:visible!important}
  html.ttp-on body>*:not(#ttp){display:none!important}
  html.ttp-on #ttp,html.ttp-on #ttp *{visibility:visible!important}
  html.ttp-on #ttp{position:static!important;inset:auto;overflow:visible!important;background:#fff!important;display:block!important}
  html.ttp-on #ttp .bar,html.ttp-on #ttp .empty{display:none!important}
  html.ttp-on #ttp .pages{padding:0!important;gap:0!important;display:block!important;zoom:1!important}
  html.ttp-on .pp{box-shadow:none!important;break-after:page;page-break-after:always;margin:0!important}
  html.ttp-on .pp:last-child{break-after:auto;page-break-after:auto}
}`;
    document.head.appendChild(st);
  }

  /* ---------- podaci ---------- */
  function rows() {
    const keep = r => r.status === 'confirmed' || r.status === 'seated' || (S.pend && r.status === 'pending');
    return (S.list || []).filter(keep);
  }
  const zoneOf = t => t && (S.cfg.zones || []).find(z => z.id === t.zone);
  const zLabel = z => z ? (z.short || (z.name && (z.name.hr || z.name)) || z.id) : '';
  const tableOf = id => (S.cfg.tables || []).find(t => t.id === id);
  const dateLbl = (long) => { const [y, m, d] = S.date.split('-').map(Number); const wd = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); return long ? `${DAYS[wd]}, ${d}. ${m}. ${y}.` : `${DAYS[wd]} ${d}. ${m}.`; };
  const logo = () => S.logo ? `<svg viewBox="${esc(S.logoVB)}" aria-hidden="true">${S.logo}</svg>` : `<b>${esc(S.cfg.venue || '')}</b>`;
  const printedAt = () => { const n = new Date(); return `Ispisano ${n.toLocaleDateString('hr-HR')} u ${n.toLocaleTimeString('hr-HR', { hour: '2-digit', minute: '2-digit' })}`; };

  /* ---------- kartice za stolove ---------- */
  function cardFace(r, cls) {
    const t = tableOf(r.tableId), z = zoneOf(t), full = cap(r.name || '').trim();
    const L = full.length, size = Math.max(8, Math.min(17, 118 / Math.max(1, L * .5)));
    const zc = z ? zLabel(z) : '';
    return `<div class="face ${cls}"><div class="lg">${logo()}</div>
      <div class="md"><small>Rezervirano</small><b style="font-size:${size.toFixed(1)}mm">${esc(full)}</b>
        <span>od ${fmt(r.start)} · ${r.party} ${pl(r.party, 'osoba', 'osobe', 'osoba')}</span>${r.occasion && OCC[r.occasion] ? `<em>${esc(OCC[r.occasion])}</em>` : ''}</div>
      <div class="tb"><small>Stol</small><b>${esc(r.tableId)}</b>${zc ? `<i class="${esc(z.id)}">${esc(zc)}</i>` : ''}</div></div>`;
  }
  function cards(list) {
    const L = list.slice().sort((a, b) => nat(a.tableId, b.tableId) || a.start - b.start);
    const out = [];
    for (let i = 0; i < L.length; i += 2) {
      const pair = L.slice(i, i + 2);
      out.push(`<section class="pp">${pair.map((r, k) => `<div class="tc ${k ? 'b' : 'a'}">${cardFace(r, 'up')}<div class="fold"><span>presavijte</span></div>${cardFace(r, 'dn')}${k === 0 && pair.length > 1 ? '<span class="cut">✂ izrežite</span>' : ''}</div>`).join('')}</section>`);
    }
    return out;
  }

  /* ---------- popis za ulaz ---------- */
  function hostList(list) {
    const L = list.slice();
    const by = S.sort;
    L.sort((a, b) => by === 'time' ? (a.start - b.start || nat(split(a.name).sur, split(b.name).sur))
      : by === 'table' ? (nat(a.tableId, b.tableId) || a.start - b.start)
      : (nat(split(a.name).sur, split(b.name).sur) || nat(split(a.name).first, split(b.name).first)));
    const guests = L.reduce((a, r) => a + r.party, 0), arr = L.filter(r => r.arrive).length, cf = L.filter(r => r.status === 'confirmed').length;
    const byZ = {}; L.forEach(r => { const z = zoneOf(tableOf(r.tableId)); const k = z ? zLabel(z) : ''; if (k) byZ[k] = (byZ[k] || 0) + 1; });
    const minS = L.reduce((a, r) => a + (r.minSpend || 0), 0);
    const zs = (S.cfg.zones || []).map(z => zLabel(z)).filter(k => byZ[k]).map(k => `${k} ${byZ[k]}`).join(' · ');
    const head = (first, pg, pages) => `<div class="hd">${logo()}<h1>${first ? 'Popis rezervacija' : 'Popis rezervacija — nastavak'}<small>${esc(S.cfg.venue || '')} · ${esc(dateLbl(true))}${by === 'sur' ? ' · po prezimenu' : by === 'time' ? ' · po vremenu dolaska' : ' · po stolu'}</small></h1>
      ${first ? `<div class="sm"><b>${L.length} ${pl(L.length, 'rezervacija', 'rezervacije', 'rezervacija')} · ${guests} ${pl(guests, 'gost', 'gosta', 'gostiju')}</b>${zs ? esc(zs) + '<br>' : ''}${minS ? `Zajamčena min. potrošnja ${Math.round(minS).toLocaleString('hr-HR')} €<br>` : ''}${cf ? `Potvrdilo dolazak ${arr} od ${cf}` : ''}</div>` : `<div class="sm">${pg}/${pages}</div>`}</div>`;
    const showCat = (S.cfg.zones || []).length > 0;
    const th = `<tr><th style="width:8mm"></th><th style="width:${showCat ? 50 : 66}mm">Prezime i ime</th><th style="width:15mm;text-align:center">Stol</th><th style="width:13mm;text-align:center">Osoba</th><th style="width:16mm;text-align:center">Dolazak</th>${showCat ? '<th style="width:22mm">Kategorija</th>' : ''}<th>Napomena</th><th style="width:17mm">Kod</th></tr>`;
    const tr = r => {
      const n = split(r.name), z = zoneOf(tableOf(r.tableId));
      const pre = (r.preorder || []).map(x => `${x.qty > 1 ? x.qty + '× ' : ''}${x.name}`).join(', ');
      const g = r.guest || {};
      const bd = (() => { const x = g.bday, d = r.date; if (!x || !d || x.slice(0, 4) >= d.slice(0, 4)) return false; const a1 = Date.UTC(2000, +x.slice(5, 7) - 1, +x.slice(8, 10)), a2 = Date.UTC(2000, +d.slice(5, 7) - 1, +d.slice(8, 10)), dd = Math.abs(a1 - a2) / 864e5; return Math.min(dd, 366 - dd) <= 7; })();
      const gb = [g.visits > 0 ? `★ ${g.visits + 1}. posjet` : '', bd ? 'rođendan ovih dana' : '', g.noShows ? `${g.noShows}× nije došao` : '', r.deposit ? (r.deposit.paid ? `kapara ${r.deposit.eur} € plaćena` : `kapara ${r.deposit.eur} € NIJE plaćena`) : '', r.guar && !['free', 'waived', 'charged'].includes(r.gs || r.guar.state) ? `zajamčeno karticom ${r.guar.eur} €` : '', g.note ? 'Napomena: ' + g.note : ''];
      const vp = z && z.show ? (() => {   // VIP doček: izbor gosta + priprema stola prije dolaska
        const x = r.vip || {}, sh = z.show, shots = ((sh.choose || {}).shots || []).map(s => typeof s === 'string' ? { id: s, hr: s } : s), s1 = shots.find(s => s.id === x.shot);
        const cr = (r.preorder || []).some(p => (sh.crystal || []).includes(String(p.id || '').split('@')[0]));
        const a = [x.spark && 'prskalice', x.dj && `DJ „${x.djName || 'ime gosta'}”`, shots.length && `${s1 ? s1.hr.toLowerCase() : 'rakija'} ×${r.party}`, sh.prep && 'stol spreman do ' + fmt(r.start - (sh.prep.min || 15)), cr && 'kristalne čaše'].filter(Boolean);
        return 'VIP: ' + a.join(', '); })() : '';
      const note = [vp, ...gb, r.occasion && OCC[r.occasion], r.note, pre && 'Boce: ' + pre, r.staffNote && 'Osoblje: ' + r.staffNote].filter(Boolean).join(' · ');
      return `<tr><td class="ck"><i></i></td><td class="nm"><b>${esc(n.sur)}</b> ${esc(n.first)}${r.arrive ? '<span class="ok">✓ potvrđeno</span>' : ''}${r.status === 'pending' ? '<span class="pd">čeka potvrdu</span>' : ''}</td><td class="tb">${esc(r.tableId)}</td><td class="pp2">${r.party}</td><td class="tm">${fmt(r.start)}</td>${showCat ? `<td class="ct">${z ? esc(zLabel(z)) : ''}${r.minSpend ? ` · ${r.minSpend} €` : ''}</td>` : ''}<td class="nt">${esc(note.length > 130 ? note.slice(0, 128) + '…' : note)}</td><td class="cd">${esc(r.code || '')}</td></tr>`;
    };
    const first = 22, next = 25, chunks = [];
    if (!L.length) chunks.push([]);
    else { chunks.push(L.slice(0, first)); for (let i = first; i < L.length; i += next) chunks.push(L.slice(i, i + next)); }
    return chunks.map((ch, i) => `<section class="pp pl${i ? ' cont' : ''}">${head(i === 0, i + 1, chunks.length)}<table>${th}${ch.map(tr).join('')}</table>${!ch.length ? '<p style="margin-top:8mm;color:#777;font-size:4mm">Nema potvrđenih rezervacija za ovaj dan.</p>' : ''}<div class="ft"><span>${esc(printedAt())}</span><span>☐ = stigli · TipTap</span><span>${i + 1}/${chunks.length}</span></div></section>`);
  }

  /* ---------- tlocrt s imenima ---------- */
  function planPage(list) {
    const c0 = S.cfg, P0 = c0.plan || { w: 1000, h: 640, walls: [] };
    const cfg = P0.w > P0.h * 1.3 && !(P0.floors || []).length && g.TTPlan && g.TTPlan.rot90 ? g.TTPlan.rot90(c0) : c0;
    const P = cfg.plan || P0;
    const byT = {}; list.slice().sort((a, b) => a.start - b.start).forEach(r => (byT[r.tableId] = byT[r.tableId] || []).push(r));
    const FS = Math.max(14, Math.round(P.w / 52));          // veličina slova u jedinicama tlocrta
    let s = '';
    for (const w of P.walls || []) {
      const dashed = ['area', 'deck'].includes(w.type);
      const fill = { bar: '#ece6dc', door: '#e2efe4', dance: '#eeeaf6', river: '#e4eff4', stage: '#f1e6e6', dj: '#ebe7f1', wardrobe: '#efefef' }[w.type] || (dashed ? 'none' : '#f0f0f0');
      s += `<rect x="${w.x}" y="${w.y}" width="${w.w}" height="${w.h}" rx="10" fill="${fill}" stroke="${dashed ? '#b9b9b9' : '#a5a5a5'}" stroke-width="2"${dashed ? ' stroke-dasharray="10 8"' : ''}/>`;
      if (w.label) {
        const cx = w.x + w.w / 2, cy = w.y + w.h / 2, vert = w.h > w.w * 1.4;
        if (dashed) s += `<text x="${w.x + 14}" y="${w.y + FS + 8}" font-size="${FS * .8}" fill="#9a9a9a" font-weight="700" letter-spacing="2">${esc(w.label)}</text>`;
        else s += `<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" font-size="${Math.min(FS * 1.05, (vert ? w.h : w.w) / Math.max(3, w.label.length) * 1.3)}" fill="#7a7a7a" font-weight="800" letter-spacing="3"${vert ? ` transform="rotate(-90 ${cx} ${cy})"` : ''}>${esc(w.label)}</text>`;
      }
    }
    const F = (P0.floors || []);
    if (F.length && cfg === c0) F.forEach(f => { s += `<rect x="4" y="${f.y + 4}" width="${P.w - 8}" height="${f.h - 8}" rx="18" fill="none" stroke="#9a9a9a" stroke-width="3"/><text x="${P.w - 22}" y="${f.y + FS * 1.4}" text-anchor="end" font-size="${FS * 1.15}" font-weight="800" fill="#555" letter-spacing="4">${esc(String(f.name || '').toUpperCase())}</text>`; });
    const boxes = [];   // zauzeti pravokutnici (stolovi + oznake)
    const geo = cfg.tables.map(t => {
      let w, h, round = false;
      if (['round', 'barrel', 'high'].includes(t.shape)) { const r = t.r || 28; w = h = r * 2; round = true; }
      else { w = t.w || 100; h = t.h || 60; if ((t.shape === 'booth' || t.shape === 'lounge') && [90, 270].includes((+t.rot || 0) % 360)) [w, h] = [h, w]; }
      const b = { x: t.x - w / 2, y: t.y - h / 2, w, h }; boxes.push(b);
      return { t, w, h, round, b };
    });
    const hit = (a) => boxes.some(b => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y) || a.x < -10 || a.y < -10 || a.x + a.w > P.w + 10 || a.y + a.h > P.h + 10;
    let lab = '';
    for (const G of geo) {
      const { t, w, h, round } = G, rs = byT[t.id], on = !!rs;
      const st = on ? 'fill="#fff" stroke="#111" stroke-width="3.5"' : 'fill="#f6f6f6" stroke="#c4c4c4" stroke-width="2"';
      s += round ? `<circle cx="${t.x}" cy="${t.y}" r="${w / 2}" ${st}/>` : `<rect x="${t.x - w / 2}" y="${t.y - h / 2}" width="${w}" height="${h}" rx="${Math.min(10, h / 4)}" ${st}/>`;
      s += `<text x="${t.x}" y="${t.y}" text-anchor="middle" dominant-baseline="central" font-size="${Math.min(FS * 1.15, Math.max(11, Math.min(w, h) * .55))}" font-weight="800" fill="${on ? '#111' : '#b5b5b5'}">${esc(t.id)}</text>`;
      if (!on) continue;
      const lines = rs.slice(0, 3).map(r => [split(r.name).sur || r.name, `${fmt(r.start)} · ${r.party}`]);
      const lw = Math.max(...lines.map(([a, b]) => Math.max(a.length * FS * .62, b.length * FS * .5))) + 10, lh = lines.length * FS * 2.05 + 4;
      const gap = 8, cand = [
        { x: t.x - lw / 2, y: t.y + h / 2 + gap }, { x: t.x + w / 2 + gap, y: t.y - lh / 2 }, { x: t.x - w / 2 - gap - lw, y: t.y - lh / 2 }, { x: t.x - lw / 2, y: t.y - h / 2 - gap - lh },
        { x: t.x + w / 2 + gap, y: t.y + h / 2 }, { x: t.x - w / 2 - gap - lw, y: t.y + h / 2 }, { x: t.x + w / 2 + gap, y: t.y - h / 2 - lh }, { x: t.x - w / 2 - gap - lw, y: t.y - h / 2 - lh }
      ].map(p => ({ x: p.x, y: p.y, w: lw, h: lh }));
      const pos = cand.find(c => !hit(c)) || cand[0]; boxes.push(pos);
      lab += `<g>${lines.map(([a, b], i) => `<text x="${pos.x + pos.w / 2}" y="${pos.y + 2 + i * FS * 2.05 + FS * .9}" text-anchor="middle" font-size="${FS}" font-weight="800" fill="#111" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">${esc(a)}</text><text x="${pos.x + pos.w / 2}" y="${pos.y + 2 + i * FS * 2.05 + FS * 1.85}" text-anchor="middle" font-size="${FS * .82}" font-weight="600" fill="#444" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">${esc(b)}</text>`).join('')}</g>`;
    }
    const nT = Object.keys(byT).length, guests = list.reduce((a, r) => a + r.party, 0);
    return [`<section class="pp pm"><div class="hd">${logo()}<h1>Tlocrt s rezervacijama<small>${esc(S.cfg.venue || '')} · ${esc(dateLbl(true))}</small></h1><div class="sm"><b>${nT}</b> ${pl(nT, 'stol', 'stola', 'stolova')} · <b>${guests}</b> ${pl(guests, 'gost', 'gosta', 'gostiju')}<br>ime · vrijeme dolaska · broj osoba</div></div>
      <div class="sv"><svg viewBox="-24 -24 ${P.w + 48} ${P.h + 48}" preserveAspectRatio="xMidYMid meet" font-family="Inter, system-ui, sans-serif"><rect x="-6" y="-6" width="${P.w + 12}" height="${P.h + 12}" rx="16" fill="#fff" stroke="#d0d0d0" stroke-width="3"/>${s}${lab}</svg></div>
      <div class="lgd"><span><i style="border:.5mm solid #111;background:#fff"></i>rezervirano</span><span><i style="border:.4mm solid #c4c4c4;background:#f6f6f6"></i>slobodno</span><span>${esc(printedAt())}</span></div></section>`];
  }

  /* ---------- prikaz ---------- */
  function render() {
    const list = rows(), pend = (S.list || []).filter(r => r.status === 'pending').length;
    const pages = [];
    if (S.cards) pages.push(...cards(list));
    if (S.host) pages.push(...hostList(list));
    if (S.plan) pages.push(...planPage(list));
    const cardsN = list.length;
    el.innerHTML = `<div class="bar"><div class="b1"><button class="x" data-x aria-label="Zatvori">✕</button><h2>Ispis za večer<small>${esc(dateLbl(true))} · ${list.length} ${pl(list.length, 'rezervacija', 'rezervacije', 'rezervacija')} · ${pages.length} ${pl(pages.length, 'stranica', 'stranice', 'stranica')} A4</small></h2><button class="go" data-go ${pages.length ? '' : 'disabled'}>🖨️ Ispiši</button></div>
      <div class="b2"><button class="ch" data-t="cards" aria-pressed="${S.cards}"><i></i>Kartice za stolove (${cardsN})</button><button class="ch" data-t="host" aria-pressed="${S.host}"><i></i>Popis za ulaz</button><button class="ch" data-t="plan" aria-pressed="${S.plan}"><i></i>Tlocrt s imenima</button>
        <span class="sg"><span>Popis:</span>${[['sur', 'prezime'], ['time', 'vrijeme'], ['table', 'stol']].map(([k, l]) => `<button data-s="${k}" aria-pressed="${S.sort === k}">${l}</button>`).join('')}</span>
        ${pend ? `<button class="ch" data-t="pend" aria-pressed="${S.pend}"><i></i>I one koje čekaju potvrdu (${pend})</button>` : ''}</div>
      <p class="note">Kartice se ispisuju po 2 na A4 — izrežite po crti i presavijte na pola, ime stoji s obje strane stola. ${g.TT && g.TT.mode === 'demo' ? '<b>Na laptopu: Ispiši → Spremi kao PDF.</b>' : ''}</p></div>
      <div class="pages" id="ttpPages">${pages.length ? pages.join('') : '<p class="empty">Odaberite što želite ispisati.</p>'}</div>`;
    fit();
  }
  function fit() {
    const p = el && el.querySelector('#ttpPages'); if (!p) return;
    const pageW = 210 * 96 / 25.4, z = Math.min(1, (el.clientWidth - 24) / pageW);
    p.style.zoom = z.toFixed(4);
  }
  function onClick(e) {
    const x = e.target.closest('[data-x]'); if (x) { close(); return; }
    if (e.target.closest('[data-go]')) { try { g.print(); } catch (err) { } return; }
    const t = e.target.closest('[data-t]'); if (t) { S[t.dataset.t] = !S[t.dataset.t]; save(); render(); return; }
    const s = e.target.closest('[data-s]'); if (s) { S.sort = s.dataset.s; save(); render(); }
  }
  function save() { try { localStorage.setItem('tt_print', JSON.stringify({ cards: S.cards, host: S.host, plan: S.plan, sort: S.sort })); } catch (e) { } }
  function load() { try { return JSON.parse(localStorage.getItem('tt_print') || 'null') || {}; } catch (e) { return {}; } }
  function close() { if (!el) return; el.hidden = true; el.innerHTML = ''; document.documentElement.style.overflow = ''; document.documentElement.classList.remove('ttp-on'); const pg = document.getElementById('ttp-page'); if (pg) pg.remove(); removeEventListener('resize', fit); removeEventListener('keydown', onKey); }
  function onKey(e) { if (e.key === 'Escape') close(); }

  /** open({cfg, list, date, logo, logoVB}) */
  function open(o) {
    css();
    const pref = load();
    S = Object.assign({ cards: true, host: true, plan: true, sort: 'sur', pend: false }, pref, o);
    if (!el) { el = document.createElement('div'); el.id = 'ttp'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Ispis rezervacija'); el.addEventListener('click', onClick); document.body.appendChild(el); }
    el.hidden = false; document.documentElement.style.overflow = 'hidden'; document.documentElement.classList.add('ttp-on');
    if (!document.getElementById('ttp-page')) { const pg = document.createElement('style'); pg.id = 'ttp-page'; pg.textContent = '@page{size:A4 portrait;margin:0}'; document.head.appendChild(pg); }
    render(); el.scrollTop = 0;
    addEventListener('resize', fit); addEventListener('keydown', onKey);
  }
  g.TTPrint = { open, close };
})(window);

</script>
<script>
(function(){'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=TT.esc,fmt=TT.fmt,toMin=TT.toMin,addDays=TT.addDays,wd=TT.wd,buzz=TT.buzz;
const V=TT_CFG,DEMO=TT.mode==='demo',CAT=window.TT_MENU||{cats:[]};
const money=v=>TT.money(v,'hr');
const money0=v=>new Intl.NumberFormat('hr-HR',{style:'currency',currency:'EUR',minimumFractionDigits:Number.isInteger(+v)?0:2,maximumFractionDigits:2}).format(+v||0);
const pl=(n,one,few,many)=>{const a=n%10,b=n%100;return a===1&&b!==11?one:(a>=2&&a<=4&&(b<12||b>14))?few:many};
const arm=(btn,label)=>{if(btn.dataset.armed)return true;btn.dataset.armed=1;const o=btn.innerHTML;btn.innerHTML=label;btn.classList.add('armed');setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.innerHTML=o;btn.classList.remove('armed')}},3500);return false};

  S.tab=k;closeSheet();$$('.content>section').forEach(s=>s.hidden=s.id!=='tab-'+k);$('#hdr').hidden=!['list','plan'].includes(k);

}
function moreSheet(){openSheet(shHead('Više')+`<div style="display:grid;gap:8px">${NAV().filter(([k])=>!MOB().some(([x])=>x===k)).map(([k,l])=>`<button class="btn block" data-tab="${k}" style="justify-content:flex-start">${IC[k].replace('<svg','<svg width="22" height="22"')} ${l}${k==='msgs'&&S.fbUnread?` <span class="pill st-new" style="margin-left:auto">${S.fbUnread} ${pl(S.fbUnread,'nova','nove','novih')}</span>`:''}${k==='songs'&&S.live.some(x=>x.kind==='song'&&x.status==='new')?` <span class="pill st-new" style="margin-left:auto">nova pjesma</span>`:''}</button>`).join('')}${(V.features||{}).hostess?`<a class="btn block" href="${esc(TT.keepClock('../hostesa/'))}" style="justify-content:flex-start">${V.venue==='qclub'?'🧥 Garderoba — hostesa':'🚪 Hostesa — ulaz'+((V.features.hostess||[]).includes('coat')?' i garderoba':'')}</a>`:''}<button class="btn block" data-logout style="justify-content:flex-start">⎋ Odjava</button></div>`)}

async function loadDay(silent){
  try{const d=await api('/admin/day'+(S.date?'?date='+S.date:''));const prev=S.date===d.date?new Map((S.list||[]).map(r=>[r.id,r.status])):null;S.date=d.date;S.list=d.list;S.cfg=d.config;S.slots=d.slots;
    if(prev&&prev.size){const n=d.list.filter(r=>r.status==='seated'&&prev.has(r.id)&&prev.get(r.id)!=='seated'&&r.checkedBy==='hostesa');if(n.length)arrived(n[n.length-1]);}
    renderNav();if(['list','plan'].includes(S.tab))render();
  }catch(e){if(!silent)toast(errMsg(e))}
}
async function loadUpcoming(){try{const u=await api('/admin/upcoming');S.upcoming=u.days;renderStrip();
  // nova rezervacija gosta (i ona zajamčena karticom, koja je odmah potvrđena) → zvono i traka na vrhu
  const snap=Object.fromEntries(u.days.map(d=>[d.date,d.nw||'']));
  if(S.upSnap){for(const d of u.days){if(d.nw&&d.nw>(S.upSnap[d.date]||'')){try{const day=await api('/admin/day?date='+d.date);const r=day.list.find(x=>x.source==='web'&&x.createdAt===d.nw);if(r&&['pending','confirmed'].includes(r.status))announce(r);}catch(e){}}}}
  S.upSnap=snap;}catch(e){}}
let nbT=null;
function announce(r){TT.chime('bell');buzz([200,100,200]);const nb=$('#nban');const [y,m,dd]=r.date.split('-');
  nb.innerHTML=`<span class="ic">🔔</span><div class="tx"><b>Nova rezervacija · ${esc(r.name)}</b><br>${DN[wd(r.date)]} ${+dd}.${+m}. · ${fmt(r.start)} · ${r.party} os. · stol ${esc(r.tableId)}${(r.preorder||[]).length?` · 🍾 ${money(preTotal(r))}`:''}${r.guar?` · 🔒 zajamčeno ${money0(r.guar.eur)}`:r.status==='pending'?' · čeka potvrdu':''}</div><button class="btn gold sm" data-showres="${r.id}" data-d="${r.date}">Prikaži</button>`;
  nb.classList.add('on');clearTimeout(nbT);nbT=setTimeout(()=>nb.classList.remove('on'),10000);

const openLive=()=>S.live.filter(x=>x.status==='new'||x.status==='ack');
async function loadLive(){
  try{const d=await api('/admin/live');S.live=d.list;S.liveDate=d.date;
    if(S.date===d.date)S.liveRes=S.list;else{try{S.liveRes=(await api('/admin/day?date='+d.date)).list}catch(e){S.liveRes=[]}}
    const ids=S.live.filter(x=>x.status==='new').map(x=>x.id);
    if(S.seenLive){const fresh=S.live.filter(x=>x.status==='new'&&!S.seenLive.includes(x.id));
      if(fresh.length){const x=fresh[fresh.length-1];const k=KIND[x.kind];TT.chime(x.kind==='song'?'ok':'bell');buzz([120,60,120]);
        const txt=x.kind==='order'?`${k[0]} Stol <b>${esc(x.table)}</b> naručuje · ${money(x.total)}`:x.kind==='song'?`🎵 Pjesma: <b>${esc(x.song.title)}</b>${x.table?` · stol ${esc(x.table)}`:''}`:`${k[0]} Stol <b>${esc(x.table)}</b> · ${k[1].toLowerCase()}${x.pay?` (${x.pay==='card'?'kartica':'gotovina'})`:''}`;
        toast(txt);}}
    S.seenLive=ids;renderNav();
    if(S.tab==='live')renderLive();if(S.tab==='songs')renderSongs();if(['list','plan'].includes(S.tab)){renderPlan();renderListPlan();}
  }catch(e){}
}
async function loadFb(){try{const d=await api('/admin/feedback');
  if(S.seenFb&&d.list.some(x=>!S.seenFb.includes(x.id))){TT.chime('ok');toast('✉️ Nova anonimna poruka upravi');}
  S.fb=d.list;S.fbUnread=d.unread;S.seenFb=d.list.map(x=>x.id);renderNav();if(S.tab==='msgs')renderMsgs();}catch(e){}}

function renderHeader(){if(!S.date)return;const [y,m,dd]=S.date.split('-');const td=TT.biz().date;
  $('#dlabel').textContent=`${DN[wd(S.date)]} ${+dd}.${+m}.`;
  $('#dsub').textContent=S.date===td?'Večeras':S.date===addDays(td,1)?'Sutra':(S.date<td?'Prošlo':'Za '+Math.round((Date.parse(S.date)-Date.parse(td))/864e5)+' dana');}
function renderStrip(){const td=TT.biz().date;const map=Object.fromEntries(S.upcoming.map(x=>[x.date,x]));let h='';
  for(let i=0;i<14;i++){const d=addDays(td,i),u=map[d]||{};const cl=S.cfg&&S.cfg.hours&&!S.cfg.hours[wd(d)]&&!u.total;h+=`<button data-date="${d}" aria-pressed="${d===S.date}"${cl?' class="closed"':''}>${DS[wd(d)]}<b>${+d.slice(8)}</b><span class="cnt">${u.total?u.guests+' os':cl?'zatv.':''}</span>${u.pending?`<span class="bdg">${u.pending}</span>`:''}</button>`}
  $('#strip').innerHTML=h;centerIn($('#strip'),$('#strip [aria-pressed=true]'));}

function contactLinks(r){if(!r.phone)return '';const wa=`https://wa.me/${r.phone.replace(/\D/g,'')}`;

function resCard(r){
  let acts='';
  if(r.status==='pending')acts=`<button class="btn ok" data-act="confirmed" data-id="${r.id}">✓ Potvrdi</button><button class="btn bad" data-act="declined" data-id="${r.id}">✕ Odbij</button>`;

   ${gpLine(r)}

   <div class="contact">${contactLinks(r)}</div></div>
   ${pre.length?`<div class="pre">🍾 ${pre.map(x=>`${x.qty}× ${esc(x.name)} ${esc(x.vol)}`).join(' · ')} · <b>${money(preTotal(r))}</b>${r.sparkler?' · ✨ prskalica':''}</div>`:''}
   ${(()=>{const t0=(S.cfg.tables||[]).find(x=>x.id===r.tableId),z0=t0&&(S.cfg.zones||[]).find(z=>z.id===t0.zone);if(!(z0&&z0.show&&ACTIVE.includes(r.status)))return '';const vx=TT.vipStaff(r,z0.show);return `<div class="vipx"><b>👑 VIP doček</b>${vx.it.map(([i,s])=>`<span>${i} ${esc(s)}</span>`).join('')}</div>`})()}
   ${r.deposit?`<div class="dep ${r.deposit.paid?'ok':'due'}"><span>💳 Kapara <b>${money0(r.deposit.eur)}</b> · ${r.deposit.paid?'plaćena — odbija se od računa':'čeka uplatu'}</span>${!r.deposit.paid&&ACTIVE.includes(r.status)?`<button class="btn sm" data-dep="${r.id}">Označi plaćeno</button>`:''}</div>`:''}

function renderList(){
  const q=S.q.toLowerCase(),qd=q.replace(/[\s\-\/]/g,'');const L=S.list.filter(r=>!q||(qd.length>=3&&/^\+?\d+$/.test(qd)&&String(r.phone||'').replace(/^\+385/,'0').includes(qd.replace(/^\+385/,'0')))||[r.name,r.phone,r.code].some(x=>String(x||'').toLowerCase().includes(q)));
  const act=S.list.filter(r=>ACTIVE.includes(r.status)),pendN=S.list.filter(r=>r.status==='pending').length,pre=act.reduce((a,r)=>a+preTotal(r),0);
  const cfN=S.list.filter(r=>r.status==='confirmed').length,arN0=S.list.filter(r=>r.status==='confirmed'&&r.arrive).length;

function stateAt(t,time){return S.list.find(r=>r.tableId===t.id&&ACTIVE.includes(r.status)&&time>=r.start&&time<r.end)}

function defaultPlanTime(){const sl=S.slots.length?S.slots:[1080];const now=TT.biz();return S.date===now.date?Math.max(sl[0],Math.min(now.min,sl[sl.length-1]+60)):sl[0]}
function planOpts(time){return {state:t=>{const r=stateAt(t,time);const a=liveAlert(t);return (r?r.status:'free')+(a?' alert':'')},alert:liveAlert,
  sub:t=>{const r=stateAt(t,time);return r?`${r.name.split(' ')[0].slice(0,10)} · ${r.party}`:`${t.min}–${t.max}`},onTap:tableSheet}}
function renderPlan(){

  $('#timebar').innerHTML=ext.map(m=>`<button class="chip sm" data-pt="${m}" aria-pressed="${m===S.planTime}">${fmt(m)}</button>`).join('');

const bdaySoon=(b,d)=>{if(!b||!d||b.slice(0,4)>=d.slice(0,4))return false;const x=Date.UTC(2000,+b.slice(5,7)-1,+b.slice(8,10)),y=Date.UTC(2000,+d.slice(5,7)-1,+d.slice(8,10)),dd=Math.abs(x-y)/864e5;return Math.min(dd,366-dd)<=7};

  if(gs==='held')return `<div class="gar held"><span>🔒 <b>${v}</b> blokirano na kartici<small>${cardTxt(G.card)} · ukida se kad hostesa skenira ulaznicu</small></span></div>`;
  if(gs==='late'){const n=TT.now(),P=d=>Date.parse(d+'T00:00:00Z')/864e5,lm=Math.max(0,Math.round((P(n.date)-P(r.date))*1440+n.min-r.start));return `<div class="gar late"><span>⏰ Nisu stigli${lm&&lm<600?` · kasne ${lm} min`:''} · <b>${v}</b> blokirano<small>Stol se drži ${S.cfg.holdMinutes||15} min. Ako ne dođu, naplatite jamstvo.</small></span><div class="gb"><button class="btn sm bad" data-gch="${r.id}">Nisu došli · naplati ${v}</button><button class="btn sm" data-gwv="${r.id}">Ne naplaćuj</button></div></div>`;}

function barsSVG(days,key,col){const W=640,H=170,pad=24,n=days.length,max=Math.max(1,...days.map(d=>d[key]));const bw=(W-pad*2)/n;
  return `<svg class="chart" viewBox="0 0 ${W} ${H+28}">${days.map((d,i)=>{const h=Math.round((d[key]/max)*(H-24)),x=pad+i*bw+3,y=H-h;const we=[5,6].includes(wd(d.date));
    return `<rect x="${x.toFixed(1)}" y="${y}" width="${(bw-6).toFixed(1)}" height="${h}" rx="5" fill="${col}" opacity="${we?1:.55}"/><text x="${(x+(bw-6)/2).toFixed(1)}" y="${y-6}" text-anchor="middle" font-size="12" fill="var(--muted)">${d[key]||''}</text><text x="${(x+(bw-6)/2).toFixed(1)}" y="${H+18}" text-anchor="middle" font-size="11.5" fill="var(--dim)">${DS[wd(d.date)].slice(0,2)} ${+d.date.slice(8)}.</text>`}).join('')}</svg>`}

async function setStatus(id,status,btn){
  if(status==='declined'&&btn&&!arm(btn,'Dodirnite ponovno'))return;
  {const r=S.list.find(x=>x.id===id);if(status==='noshow'&&r&&r.guar&&!['released','charged','waived','free'].includes(r.gs)){if(btn&&!arm(btn,`Potvrdi · naplati ${money0(r.guar.eur)}`))return;return guarAct(id,'charge',btn)}}
  if(status==='noshow'&&btn){const r=S.list.find(x=>x.id===id);if(!arm(btn,r&&r.noShowFee?`Potvrdi · ${money0(r.party*r.noShowFee)}`:r&&r.deposit&&r.deposit.paid?'Potvrdi · kapara ostaje':'Dodirnite ponovno'))return;}
  try{btn&&(btn.disabled=true);const x=await api('/admin/update',{id,status});afterUpdate(x)}catch(e){toast(errMsg(e));btn&&(btn.disabled=false)}
}

$('#todayBtn').onclick=()=>{const i=document.createElement('input');i.type='date';i.value=S.date;i.style.position='fixed';i.style.opacity=0;document.body.appendChild(i);i.onchange=()=>{if(i.value)setDate(i.value);i.remove()};i.onblur=()=>setTimeout(()=>i.remove(),300);try{i.showPicker()}catch(e){i.click()}};
$('#search').oninput=e=>{S.q=e.target.value;renderList()};
$('#printBtn').onclick=()=>{if(!window.TTPrint||!S.cfg)return;buzz(8);const lg=document.querySelector('.sb svg');TTPrint.open({cfg:S.cfg,list:S.list||[],date:S.date,logo:lg?lg.innerHTML:'',logoVB:lg?lg.getAttribute('viewBox'):''});};
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{if(S.tab==='list')renderListPlan();if(S.tab==='live')renderLive()},200)});

/* ---------- osvježavanje ---------- */
let rq=null;
function refreshAll(){clearTimeout(rq);rq=setTimeout(()=>{if(document.body.classList.contains('editing'))return;loadDay(true);loadUpcoming();loadLive();loadFb();if(S.tab==='menu'){loadMenu().then(()=>{if(!document.activeElement||!document.activeElement.closest('#tab-menu input'))renderMenu()})}},120)}
async function start(){$('#login').hidden=true;$('#app').hidden=false;$$('.demoTag').forEach(e=>e.hidden=!DEMO);
  const h=location.hash.slice(1).split('/');const tab=h[0]||(REZ?'list':'live');if(/^\d{4}-\d{2}-\d{2}$/.test(h[1]||''))S.date=h[1];if(h[2])S.flash=decodeURIComponent(h[2]);
  await loadDay();renderHeader();loadUpcoming();loadLive();loadFb();loadMenu();
  setTab(NAV().some(([k])=>k===tab)?tab:(REZ?'list':'live'));
  if(TT.mode==='live'){
    setInterval(()=>{if(document.visibilityState==='visible'&&!$('#sheet').classList.contains('on')){loadLive();if(S.tab!=='set'&&S.tab!=='menu'){loadDay(true);loadUpcoming()}}},6000);
    setInterval(()=>{if(document.visibilityState==='visible')loadFb()},30000);
  }
  TT.onChange(m=>{if(m.venue===V.venue||m.venue==='*')refreshAll()});
  addEventListener('hashchange',()=>{const h=location.hash.slice(1).split('/');if(h[2])S.flash=decodeURIComponent(h[2]);if(/^\d{4}-\d{2}-\d{2}$/.test(h[1]||'')&&h[1]!==S.date){S.tab=NAV().some(([k])=>k===h[0])?h[0]:S.tab;setDate(h[1]);}if(NAV().some(([k])=>k===h[0])&&h[0]!==S.tab)setTab(h[0]);else if(S.tab==='list')renderList();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshAll()});
}
if(TT.pin(V.venue)){TT.api('/admin/login',{admin:true}).then(start).catch(()=>logout())}else logout();
})();
</script>
</body>
