/* ================= detail / exploded ================= */
function strengthHTML(s){if(s==null)return `<span class="small">${t('askStaff')}</span>`;return `<div class="str" aria-label="${s}/5">${[1,2,3,4,5].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;}
function ingIcon(k,size){const g=MENU.ingredients[k]||MENU.ingredients.secret;const c=g.color;const lum=parseInt(c.slice(1,3),16)*.3+parseInt(c.slice(3,5),16)*.59+parseInt(c.slice(5,7),16)*.11;
 return `<span class="o" style="--c:${c};color:${lum>150?'#2a1a0c':'#fff5e6'}">${svg(II[g.icon]||II.mystery,size)}</span>`;}
const AMT={top:['dopuna','top up'],'2 tsp':['2 žličice','2 tsp'],'8 lvs':['8 listića','8 leaves'],'shot':['1 espresso','1 espresso']};
function amt(a){return AMT[a]?AMT[a][lang==='hr'?0:1]:a;}
function openDetail(it){
 const d=$('#detail'),R=it.recipe,I=MENU.ingredients,f=favs.has(it.id);
 let h=`<div class="grab"><span></span><button class="close" data-close aria-label="${t('close')}">${svg(UI.x,24)}</button></div><div class="pad">`;
 h+=`<div class="d-head">${R?photo(it,'d-ph'):''}<div>`+badges(it,true)+`<h2 class="d-name">${esc(nm(it))}</h2>${L(it.desc)?`<p class="d-desc">${esc(L(it.desc).trim())}</p>`:''}</div></div>`;
 if(R){
  h+=`<div class="stage" id="stage" aria-label="${t('tapExplode')}">${glassSVG(R.glass,R.layers,R.garnish,false).replace('<svg ','<svg class="glass" ')}<svg class="links"></svg>`+
   R.ings.map(([k,a],i)=>{const g=I[k]||I.secret;return `<div class="orb${i%2?' r':''}" data-i="${i}">${ingIcon(k,22)}<span class="t"><b>${esc(L(g))}</b>${a?`<i>${esc(amt(a))}</i>`:''}</span></div>`}).join('')+`<div class="tap">${t('tapExplode')}</div></div>`;
 }else if(it.pour){h+=pourBlock(it,'b');}
 else h+=`<div class="hero-ico">${thumbFor(it,false)}</div>`;
 h+=`<div class="box"><h4>${t('prices')}</h4><div class="plist">${it.prices.map(p=>`<div class="prow"><span>${esc(priceLabel(p,it)||L({hr:'Cijena',en:'Price'}))}</span><b>${money(shown(p,it).eur)}${shown(p,it).was?`<small class="was">${t('regular')} ${money(shown(p,it).was)}</small>`:shown(p,it).deal?`<small class="was">${t('dealAt')} ${money(shown(p,it).deal)}</small>`:''}</b></div>`).join('')}</div>
  ${it.cat.promo&&it.prices.some(p=>p.unit==='bottle')?promoBox(L(MENU.meta.promo),'margin:10px 0 0'):dealOf(it)?promoBox(`${t('dealHint')}${MENU.meta.promoWhen?` (${L(MENU.meta.promoWhen)})`:''}: ${dealOf(it).prices.map(p=>`${priceLabel(p,dealOf(it))} ${money(p.eur)}`).join(' · ')}`,'margin:10px 0 0'):''}</div>`;
 if(R){
  h+=`<div class="meta"><div class="box"><h4>${t('strength')}</h4>${it.alcohol===false||!it.cat.alcohol?`<span class="b na">${t('noAlc')}</span>`:strengthHTML(it.strength)}</div><div class="box"><h4>${t('glass')}</h4>${esc(t('glasses')[R.glass]||'')}</div>
   <div class="box full"><h4>${t('taste')}</h4><p style="margin:0 0 8px">${esc(L(R.taste))}</p><h4>${t('lovers')}</h4><p style="margin:0">${esc(L(R.lovers))}</p></div>
   ${R.profile?`<div class="box full"><h4>${t('profile')}</h4><div class="prof">${t('pf').map((n,i)=>`<div>${n}<s style="--w:0%" data-w="${Math.round(R.profile[i]/3*100)}%"></s></div>`).join('')}</div></div>`:''}
   <div class="box full"><h4>${t('ingredients')}</h4>${R.ings.map(([k,a])=>{const g=I[k]||I.secret;return `<div class="ing">${ingIcon(k,18)}<div><b>${esc(L(g))}</b>${a?`<em>${esc(amt(a))}</em>`:''}<p>${esc(L(g.why))}</p></div></div>`}).join('')}${it.check.includes('recipe')?`<p class="small" style="margin:8px 0 0">${t('approx')}</p>`:''}</div></div>`;
 }else{h+=`<div class="meta"><div class="box"><h4>${it.abv?(lang==='hr'?'Alkohol':'Alcohol'):t('strength')}</h4>${it.abv?`<b class="abv">${esc(String(it.abv).replace('.',lang==='hr'?',':'.'))}${lang==='hr'?'\u00a0%':'%'} vol.</b>`:it.alcohol?strengthHTML(it.strength):`<span class="b na">${t('noAlc')}</span>`}</div><div class="box"><h4>${lang==='hr'?'Kategorija':'Category'}</h4>${esc(L(it.cat.name))}</div></div>`;
}
 if(it.facts&&it.facts.length)h+=`<div class="box facts">${it.facts.map(f=>`<div class="fact"><span>${esc(L(f[0]))}</span><b>${esc(L(f[1]))}</b></div>`).join('')}</div>`;
 h+=`<button class="bigbtn ${f?'':'gold'}" data-favbig="${it.id}">${svg(f?UI.heartF:UI.heart,22)} ${f?t('inFav'):t('addFav')}</button></div>`;
 d.innerHTML=h;showSheet(d);buzz(10);if(window.TTX&&TTX.view)TTX.view(it,d);
 if(it.pour){d._pourIt=it;setTimeout(runPour,450);}
 if(R){const st=$('#stage');layoutOrbs(st);st.addEventListener('click',()=>{explode(st,!st.classList.contains('ex'));});
  setTimeout(()=>{if(openSheet===d)explode(st,true);$$('.prof s',d).forEach(s=>s.style.setProperty('--w',s.dataset.w));},reduced?0:420);}
}
function layoutOrbs(st){const w=st.clientWidth,h=st.clientHeight,orbs=$$('.orb',st),n=orbs.length,k=Math.ceil(n/2),ow=Math.min(118,w*.31);
 const pos=orbs.map((o,i)=>{const col=i%2,row=Math.floor(i/2),rows=col?Math.floor(n/2):k;const y=rows<=1?h*.42:h*(.14+row*(.68/(rows-1)));const x=col?w-ow/2-6:ow/2+6;o.style.width=ow+'px';return {x,y,col};});
 st._pos=pos;const lk=$('.links',st);lk.setAttribute('viewBox',`0 0 ${w} ${h}`);
 lk.innerHTML=pos.map(p=>{const ox=p.col?p.x+ow/2-21:p.x-ow/2+21;return `<line x1="${ox}" y1="${p.y}" x2="${w/2+(p.col?18:-18)}" y2="${h/2+(p.y-h/2)*.35}"/>`}).join('');}
function explode(st,on){st.classList.toggle('ex',on);const w=st.clientWidth,h=st.clientHeight;
 const lgs=$$('.glass .lg',st),n=lgs.length;lgs.forEach((g,i)=>{g.style.transform=on?`translateY(${(-(i-(n-1)/2)*18-8).toFixed(1)}px)`:'';});
 const gar=$('.glass .gar',st);if(gar)gar.style.transform=on?'translate(14px,-30px) rotate(18deg)':'';
 $$('.orb',st).forEach((o,i)=>{const p=st._pos[i];o.style.transitionDelay=on?(i*55)+'ms':'0ms';o.style.transform=on?`translate(calc(-50% + ${(p.x-w/2).toFixed(1)}px),calc(-50% + ${(p.y-h/2).toFixed(1)}px)) scale(1)`:'';});
 const tp=$('.tap',st);if(tp)tp.textContent=on?t('tapImplode'):t('tapExplode');buzz(on?[6,30,10]:8);}

/* ================= favourites ================= */
function toggleFav(id){if(favs.has(id)){favs.delete(id);toast(t('removed'));}else{favs.add(id);toast(t('added'));}store.set(K('favs'),[...favs]);buzz(12);
 $$(`[data-fav="${id}"]`).forEach(b=>{const on=favs.has(id);b.setAttribute('aria-pressed',on);b.innerHTML=svg(on?UI.heartF:UI.heart,26);});updateFavCount();}
function updateFavCount(){const n=favs.size||'';$$('.favcount').forEach(e=>e.textContent=n);}
function openFavs(){if(window.TTX&&TTX.favs&&TTX.favs())return;const d=$('#favs');const list=[...favs].map(id=>BYID[id]).filter(Boolean);
 d.innerHTML=`<div class="grab"><h3>♥ ${t('fav')}</h3><button class="close" data-close aria-label="${t('close')}">${svg(UI.x,24)}</button></div><div class="pad" id="favpad">`+
 (list.length?list.map(it=>`<div class="fitem"><div class="fx"><span class="n">${esc(nm(it))}${it.badge?` <small class="fb">${esc(L(it.badge))}</small>`:''}</span><div class="fps">${it.prices.map(p=>{const v=shown(p,it),l=priceLabel(p,it);return `<span class="fp">${l?`<i>${esc(l)}</i> `:''}<b>${money(v.eur)}</b></span>`;}).join('')}</div>${it.cat.promo?`<small class="fnote">${esc(t('dealHint'))}${MENU.meta.promoWhen?` · ${esc(L(MENU.meta.promoWhen))}`:''}</small>`:''}</div><button data-unfav="${it.id}" aria-label="×">${svg(UI.x,20)}</button></div>`).join('')+
  `<button class="bigbtn gold" id="showW">${t('showWaiter')}</button><button class="bigbtn" id="favClear">${t('clearAll')}</button>`:`<p class="empty" style="padding:24px 0">${t('favEmpty')}</p>`)+`</div>`;
 showSheet(d);}
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600);}

/* ================= events ================= */
document.addEventListener('click',e=>{const tg=e.target;
 const ps=tg.closest('[data-psize],[data-replay],.pourbox');if(ps){const d=$('#detail'),it=d._pourIt;if(it){const box=$('.pourbox',d);const sz=ps.dataset.psize||box.dataset.size;box.dataset.size=sz;box.innerHTML=pourScene(it,sz);$$('[data-psize]',d).forEach(b=>b.setAttribute('aria-pressed',b.dataset.psize===sz));runPour();}return;}
 const fb=tg.closest('[data-favbig]');if(fb){toggleFav(fb.dataset.favbig);const on=favs.has(fb.dataset.favbig);fb.className='bigbtn '+(on?'':'gold');fb.innerHTML=svg(on?UI.heartF:UI.heart,22)+' '+(on?t('inFav'):t('addFav'));return;}
 const uf=tg.closest('[data-unfav]');if(uf){toggleFav(uf.dataset.unfav);openFavs();return;}
 if(tg.closest('[data-close]')){hideSheet();return;}
 if(tg.closest('#showW')){const p=$('#favpad');p.classList.toggle('showmode');tg.closest('#showW').textContent=p.classList.contains('showmode')?t('normalView'):t('showWaiter');buzz(8);return;}
 if(tg.closest('#favClear')){favs.clear();store.set(K('favs'),[]);updateFavCount();openFavs();return;}
 const cd=tg.closest('.card');if(cd){openDetail(BYID[cd.dataset.id]);return;}
 const gt=tg.closest('[data-group]');if(gt){buzz(8);go({v:'cat',g:gt.dataset.group});return;}
 const sc=tg.closest('[data-sec]');if(sc){buzz(6);goSec(sc.dataset.sec);return;}
 if(tg.closest('#back')){buzz(6);goBack();return;}
 if(tg.closest('[data-home]')){go({v:'home'});return;}
 if(tg.closest('#catSearch')){go({v:'home'},{focusSearch:true});setTimeout(()=>{try{$('#q').focus({preventScroll:true})}catch(e){$('#q').focus()}},80);return;}
 if(tg.closest('[data-anon]')){buzz(8);openFeedback();return;}
 const lb=tg.closest('.lang button');if(lb){lang=lb.dataset.l;store.set(K('lang'),lang);buzz(6);renderAll();return;}
 if(tg.closest('.openFav')){buzz(8);openFavs();return;}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('card')){e.preventDefault();openDetail(BYID[e.target.dataset.id]);}});
const q=$('#q');let qt;
q.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(runSearch,80);});
q.addEventListener('keydown',e=>{if(e.key==='Enter')q.blur();});

$('.search .clear').addEventListener('click',()=>{q.value='';runSearch();q.focus();});

/* ================= anonymous feedback ================= */
function openFeedback(){const d=$('#fbsheet'),f=$('#fbform');
 $('#fbtopics').innerHTML=t('topics').map(([v,l],i)=>`<label class="tp"><input type="radio" name="tema" value="${v}"${i===0?' checked':''}><span>${esc(l)}</span></label>`).join('');
 $('#fbmsg').placeholder=t('fbMsgPh');$('#fbwhen').placeholder=t('fbWhenPh');$('#fbcontact').placeholder=t('fbContactPh');
 $('#fbstatus').textContent='';$('#fbstatus').className='fbstatus';f.hidden=false;$('#fbdone').hidden=true;
 const b=$('#fbsend');b.disabled=false;b.textContent=t('fbSend');showSheet(d);}
$('#fbform').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,st=$('#fbstatus'),b=$('#fbsend');
 if($('#fbmsg').value.trim().length<5){st.textContent=t('fbShort');st.className='fbstatus err';$('#fbmsg').focus();return;}
 b.disabled=true;b.textContent=t('fbSending');st.textContent='';
 const fd=new FormData(f);fd.set('jezik',lang);fd.set('vrijeme-slanja',new Date().toLocaleString('hr-HR'));
 const ep=MENU.meta.feedbackEndpoint;
 if(window.TTX&&TTX.feedback){try{await TTX.feedback(fd);f.reset();f.hidden=true;$('#fbdone').hidden=false;buzz([10,40,10]);}catch(err){st.textContent=t('fbErr');st.className='fbstatus err';b.disabled=false;b.textContent=t('fbSend');buzz(30);}return;}
 try{const r=ep?await fetch(ep,{method:'POST',headers:{Accept:'application/json'},body:fd})
   :await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(fd).toString()});
  if(!r.ok)throw new Error(r.status);
  f.reset();f.hidden=true;$('#fbdone').hidden=false;buzz([10,40,10]);
 }catch(err){st.textContent=t('fbErr');st.className='fbstatus err';b.disabled=false;b.textContent=t('fbSend');buzz(30);}
});

/* ================= QR route ================= */
function qrSVG(text){const m=qrMatrix(text),n=m.length,qz=4,s=n+qz*2;let d='';m.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+qz} ${y+qz}h1v1h-1z`;}));
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;}
function renderQR(){
 const url=MENU.meta.url||location.href.split('#')[0];const s=qrSVG(url);
 $('#qrview').innerHTML=`<div style="max-width:420px;margin:0 auto"><svg viewBox="0 0 220 160" style="width:120px;margin:0 auto;color:#111">${LOGO}</svg><h2>${esc(MENU.meta.name)}</h2><div>${t('qrTitle')}</div>
  <div class="qrbox">${s}</div><div style="font-weight:800;font-size:18px">${t('qrHint')}</div><div class="u">${esc(url)}</div>
  ${MENU.meta.url?'':`<p class="small" style="color:#a15c00">⚠️ MENU.meta.url ${lang==='hr'?'nije upisan — QR vodi na trenutnu adresu.':'is empty — QR points to the current address.'}</p>`}
  <div class="btns"><button onclick="print()">${t('qrPrint')}</button><a id="qrdl" download="${SLUG}-qr.svg">${t('qrSave')}</a><a class="sec" href="#">${t('qrBack')}</a></div></div>`;
 try{$('#qrdl').href=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));}catch(e){}
}

/* ================= intro: ulazak kroz vrata ================= */
(function intro(){const el=$('#intro');let seen=false;try{seen=sessionStorage.getItem(K('intro'))}catch(e){}
 if(seen||reduced||location.hash==='#qr'){el.remove();return;}
 try{sessionStorage.setItem(K('intro'),'1')}catch(e){}
 $('.hint',el).textContent=t('enter');
 const ev=eventToday();$('#introSub').textContent=ev?`${t('tonight')}: ${ev[lang]||ev.hr}`:t('sub');

 // publika

 rows.forEach(([y,n,c,sc],ri)=>{for(let i=0;i<n;i++){const x=(i+.5)*(400/n)+(Math.random()*10-5),s=sc*(0.85+Math.random()*.3),up=Math.random();
   const arms=up<.45?`<path d="M-9 -2 L-16 -34 M9 -2 L16 -34" stroke="${c}" stroke-width="${5*s}" stroke-linecap="round"/>`:up<.75?`<path d="M9 -2 L14 -36" stroke="${c}" stroke-width="${5*s}" stroke-linecap="round"/>${Math.random()<.5?`<rect x="11" y="-44" width="5" height="8" rx="1" fill="#e8f0ff" class="ph"/>`:''}`:'';
   g+=`<g class="p" style="animation-delay:-${(Math.random()*.48).toFixed(2)}s"><g transform="translate(${x.toFixed(1)} ${y}) scale(${s.toFixed(2)})">${arms}<path d="M-14 40 Q-15 4 -8 0 L8 0 Q15 4 14 40Z" fill="${c}"/><circle cy="-10" r="9" fill="${c}"/></g></g>`;}});
 cr.innerHTML=g;}
 // konfeti
 const cf=$('#confetti');let f='';if(cf)for(let i=0;i<34;i++){f+=`<i style="left:${(Math.random()*100).toFixed(1)}%;background:${['#f2c872','#fff','#ff3fa4','#8b5cff','#39e6ff'][i%5]};animation-delay:${(1.25+Math.random()*1.1).toFixed(2)}s;animation-duration:${(1.4+Math.random()*1.2).toFixed(2)}s;--rx:${Math.floor(Math.random()*720-360)}deg"></i>`}if(cf)cf.innerHTML=f;
 if(B.intro==='club')buzz([20,460,20,460,60,120,60]);
 const done=()=>{if(el.classList.contains('out'))return;el.classList.add('out');setTimeout(()=>el.remove(),600);};
 const tmr=setTimeout(done,B.introMs||3700);el.addEventListener('click',()=>{clearTimeout(tmr);buzz(8);done();});
})();

window.TTM={T,MENU,ITEMS,BYID,favs,K,store,esc,buzz,svg,UI,toast,showSheet,hideSheet,renderAll,updateFavCount,openDetail,priceLabel,nm,L,money:v=>money(v),shown:(p,it)=>shown(p,it),get lang(){return lang},t:k=>t(k),
 setPromo(p){PW=p&&!p.off?p:(p&&p.off?null:MENU.meta.promoWin||null);renderAll();},getPromo:()=>PW,promoLive:()=>promoLive(),openFavsOrig(){const x=window.TTX;window.TTX=null;try{openFavs()}finally{window.TTX=x}}};
if(window.TTX&&TTX.init)TTX.init(window.TTM);
VIEW=stateFromHash();try{history.scrollRestoration='manual';history.replaceState({view:VIEW},'')}catch(e){}

})();
