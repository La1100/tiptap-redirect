:root{color-scheme:dark;
  --bg:#12100e;--bg2:#1a1714;--card:#211d19;--card2:#2b2621;--line:rgba(185,138,255,.2);
  --gold:#b98aff;--gold2:#ddc4ff;--amber:#ff4fae;--text:#f6f0e5;--muted:#b8ad99;--dim:#8a8070;
  --warn:#f4bf52;--ok:#8fd19e;--radius:18px;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;min-height:100vh;
  background:
    radial-gradient(120% 60% at 50% -10%,rgba(255,79,174,.13),transparent 60%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 64px),
    var(--bg);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{display:block}

/* ---------- INTRO: ulazak kroz drvena vrata u show ---------- */
#intro{position:fixed;inset:0;z-index:100;overflow:hidden;container-type:size;background:#07050a;transition:opacity .55s ease,visibility .55s;--beat:.48s;cursor:pointer}
#intro.out{opacity:0;visibility:hidden}
#intro .club{position:absolute;inset:0;overflow:hidden;background:radial-gradient(70% 45% at 50% 38%,#5b1a6e 0%,#2a0d3a 40%,#0b0710 78%);transform:scale(1.35);animation:clubIn 2s 1.1s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes clubIn{to{transform:scale(1)}}
#intro .club::after{content:"";position:absolute;left:50%;top:62%;width:120vw;height:60vh;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,79,174,.45),transparent);animation:pulse var(--beat) ease-out infinite}
@keyframes pulse{0%{opacity:1}100%{opacity:.45}}
#intro .haze{position:absolute;inset:-20%;background:radial-gradient(40% 30% at 30% 40%,rgba(255,255,255,.07),transparent),radial-gradient(35% 25% at 70% 30%,rgba(139,92,255,.12),transparent);animation:haze 6s ease-in-out infinite alternate}

#intro .beams i{position:absolute;top:-8%;left:var(--x);width:44vmax;height:130vh;margin-left:-22vmax;transform-origin:50% 0;background:linear-gradient(to bottom,var(--c),transparent 80%);clip-path:polygon(47% 0,53% 0,100% 100%,0 100%);mix-blend-mode:screen;opacity:0;filter:blur(3px);transform:rotate(var(--a));animation:beamOn .4s 1s forwards,sweep 1.9s ease-in-out infinite alternate}
@keyframes beamOn{to{opacity:.55}}
@keyframes sweep{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
#intro .lasers{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;opacity:0;animation:beamOn .2s 1.35s forwards}

#intro .lz2 line{stroke:#ff3fa4;filter:drop-shadow(0 0 3px #ff3fa4)}
#intro .lz{transform-box:view-box;transform-origin:200px 430px;animation:laser 2.4s ease-in-out infinite alternate,flick2 .24s steps(2) infinite}
#intro .lz2{animation-direction:alternate-reverse,normal;animation-duration:1.7s,.3s}
@keyframes laser{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes flick2{50%{opacity:.55}}
#intro .booth{position:absolute;left:50%;top:50%;width:min(64vw,300px);transform:translate(-50%,-38%)}
#intro .booth svg{width:100%;display:block;overflow:visible}
#intro .deck{filter:drop-shadow(0 0 8px rgba(221,196,255,.7))}
#intro .dj{animation:bob var(--beat) ease-in-out infinite alternate}
#intro .arm{transform-box:fill-box;transform-origin:0% 100%;animation:wave calc(var(--beat)*2) ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-10deg)}to{transform:rotate(18deg)}}
@keyframes bob{to{transform:translateY(3px)}}
#intro .crowd{position:absolute;left:0;right:0;bottom:0;width:100%;height:40vh;height:40cqh}
#intro .crowd .p{animation:bob2 var(--beat) ease-in-out infinite alternate}
@keyframes bob2{to{transform:translateY(-6px)}}
#intro .crowd .ph{filter:drop-shadow(0 0 4px #cfe0ff)}
#intro .confetti i{position:absolute;top:-4vh;width:7px;height:11px;border-radius:1px;opacity:0;animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:.9;transform:translateY(110vh) rotate(var(--rx))}}
#intro .strobe{position:absolute;inset:0;background:#fff;opacity:0;animation:strobe .9s 1.2s linear forwards;pointer-events:none}
@keyframes strobe{0%{opacity:0}4%{opacity:.85}10%{opacity:0}36%{opacity:0}40%{opacity:.6}46%{opacity:0}72%{opacity:0}76%{opacity:.45}82%,100%{opacity:0}}
#intro .welcome{position:absolute;left:0;right:0;top:12vh;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;transform:scale(.85);animation:welcome .7s 2.15s cubic-bezier(.2,.8,.2,1) forwards;color:#e9d6ff}
#intro .welcome svg{width:min(40vw,170px);filter:drop-shadow(0 0 6px rgba(221,196,255,.9)) drop-shadow(0 0 24px rgba(255,79,174,.6))}
#intro .welcome b{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9.5vw,56px);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 0 12px #ff3fa4,0 0 32px rgba(255,63,164,.6);margin-top:6px;line-height:1}
#intro .welcome small{margin-top:8px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#ffd6ef;padding:0 16px}
@keyframes welcome{to{opacity:1;transform:scale(1)}}
/* pročelje */
#intro .facadewrap{position:absolute;left:50%;top:50%;width:max(100vw,50vh);height:max(200vw,100vh);width:max(100cqw,50cqh);height:max(200cqw,100cqh);transform:translate(-50%,-50%);transform-origin:50% 66%;animation:push 1.45s 1.2s cubic-bezier(.55,0,.35,1) forwards}
@keyframes push{0%{transform:translate(-50%,-50%) scale(1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-50%) scale(3.6);opacity:0}}
#intro .facade{position:absolute;inset:0;width:100%;height:100%}
#intro .neon{opacity:.15;animation:neonOn 1s .1s steps(1) forwards}
@keyframes neonOn{0%{opacity:.15}10%{opacity:1}18%{opacity:.3}24%{opacity:1}52%{opacity:.5}56%,100%{opacity:1}}
#intro .lampg{animation:pulse var(--beat) ease-out infinite}
#intro .doorway{position:absolute;left:17.5%;width:65%;top:31.25%;bottom:0;border-radius:50% 50% 0 0/23.64% 23.64% 0 0;overflow:hidden;perspective:900px}
#intro .spill{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 70%,rgba(221,196,255,.0),transparent);opacity:0}
#intro .door{position:absolute;top:0;bottom:0;width:50%;backface-visibility:hidden;
  background:
    linear-gradient(to bottom,transparent 21%,#17141d 21% 25.5%,transparent 25.5% 71%,#17141d 71% 75.5%,transparent 75.5%),
    linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.04) 40%,rgba(0,0,0,.25)),
    repeating-linear-gradient(90deg,#6b4526 0 18%,#5a3a1f 18% 19%,#2a190c 19% 20%,#744b2a 20% 38%,#2a190c 38% 39%,#62401f 39% 58%,#2a190c 58% 59%);
  box-shadow:inset 0 0 40px rgba(0,0,0,.65)}
#intro .door::before,#intro .door::after{content:"";position:absolute;left:4%;right:4%;height:4.5%;background:radial-gradient(circle,#b8a27a 0 1.2px,#3a342d 1.6px 2.6px,transparent 3px) 0 50%/16% 100% repeat-x}
#intro .door::before{top:21%}#intro .door::after{top:71%}
#intro .door.l{left:0;transform-origin:0 50%;animation:openL 1.05s .85s cubic-bezier(.5,0,.2,1) forwards}
#intro .door.r{right:0;transform-origin:100% 50%;animation:openR 1.05s .85s cubic-bezier(.5,0,.2,1) forwards;background-position:0 0,0 0,50% 0}
@keyframes openL{to{transform:rotateY(-105deg)}}
@keyframes openR{to{transform:rotateY(105deg)}}
#intro .ring{position:absolute;top:50%;width:26px;height:34px;border:4px solid #a874f0;border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,.8),inset 0 0 4px rgba(0,0,0,.6)}
#intro .door.l .ring{right:10%}#intro .door.r .ring{left:10%}
#intro .gap{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:linear-gradient(to bottom,rgba(255,63,164,.9),rgba(221,196,255,1));box-shadow:0 0 18px 6px rgba(255,79,174,.6),0 0 60px 16px rgba(255,63,164,.35);animation:pulse var(--beat) ease-out infinite,gapOut .3s 1.05s forwards}
@keyframes gapOut{to{opacity:0}}
#intro .hint{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,230,200,.7);animation:fadein .4s .3s both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* noćni klub štih u meniju */
.hero{position:relative}
.hero>*{position:relative;z-index:1}
.hero>.lights{position:absolute;z-index:0;inset:-60px -40px -10px;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.lights i{position:absolute;top:-10%;width:60%;height:170%;transform-origin:50% 0;clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);mix-blend-mode:screen;opacity:.16;filter:blur(6px);animation:sweep 7s ease-in-out infinite alternate}
.lights i:nth-child(1){left:-10%;background:linear-gradient(#ff3fa4,transparent 75%);--a:-25deg;--b:10deg}
.lights i:nth-child(2){left:25%;background:linear-gradient(#ddc4ff,transparent 75%);--a:15deg;--b:-15deg;animation-duration:9s}
.lights i:nth-child(3){left:55%;background:linear-gradient(#8b5cff,transparent 75%);--a:-10deg;--b:25deg;animation-duration:8s}
.tonight{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tonight:empty{display:none}
.live,.ev{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700}
.live{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.live b{width:8px;height:8px;border-radius:50%;background:#6b6258;flex:none}
.live.on{color:#c9f5d8}.live.on b{background:#46e08a;box-shadow:0 0 10px #46e08a;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.live.demo{color:var(--text);border-style:dashed;border-color:rgba(255,255,255,.35)}
.ev{color:#ffe0f2;background:linear-gradient(90deg,rgba(255,63,164,.22),rgba(139,92,255,.22));border:1px solid rgba(255,63,164,.45);box-shadow:0 0 18px rgba(255,63,164,.2)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;flex:none}
.eq i{width:3px;height:100%;background:#ff3fa4;border-radius:1px;transform-origin:bottom;animation:eq .48s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.2s;background:#c77dff}.eq i:nth-child(3){animation-delay:-.35s}.eq i:nth-child(4){animation-delay:-.1s;background:#ddc4ff}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}

/* ---------- LAYOUT ---------- */
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
.view{min-height:100vh}
.view.in-r{animation:inR .34s var(--ease)}
.view.in-l{animation:inL .34s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

/* ---------- HERO ---------- */
.hero{padding:max(14px,env(safe-area-inset-top)) 16px 4px;max-width:760px;margin:0 auto}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand>div{min-width:0}
.brand .logo{width:52px;flex:none;filter:drop-shadow(0 0 8px rgba(255,79,174,.35))}
.brand .sub{font-size:10.5px;letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;color:var(--muted)}
.brand h1{white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:29px;letter-spacing:.04em;line-height:1;margin:2px 0 0;text-transform:uppercase}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(0,0,0,.25)}
.lang button{min-width:40px;height:38px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted);transition:.2s}
.lang button[aria-pressed=true]{background:var(--gold);color:#1a1409}
.iconbtn{position:relative;width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);display:grid;place-items:center;color:var(--gold2);transition:transform .15s}
.iconbtn:active{transform:scale(.94)}
.count{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--amber);color:#1a1004;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 12px rgba(255,79,174,.6)}
.count:empty{display:none}

/* ---------- OCJENA + PORUKA UPRAVI ---------- */
.rate{position:relative;overflow:hidden;margin-top:14px;padding:20px 18px 4px;border-radius:24px;background:radial-gradient(90% 70% at 100% 0,rgba(221,196,255,.17),transparent 60%),linear-gradient(180deg,#221c2b,#17131d);border:1px solid rgba(185,138,255,.32);box-shadow:0 22px 44px -30px #000}
.rate::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:1px solid rgba(221,196,255,.14);pointer-events:none}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.rate h2{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.02;letter-spacing:.02em;text-transform:uppercase;margin:8px 0 10px;text-wrap:balance}
.stars{display:flex;gap:4px;color:var(--gold2);margin:0 0 10px;filter:drop-shadow(0 0 8px rgba(221,196,255,.45))}
.rate p{margin:0 0 16px;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:46ch}
.rate .bigbtn{margin:0;text-decoration:none}
.anon{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:14px 0;border-top:1px solid rgba(185,138,255,.18);text-align:left;color:var(--text)}
.anon .ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--gold2)}
.anon .tx{flex:1;min-width:0}
.anon .tx b{display:block;font-size:15.5px;line-height:1.3}
.anon .tx span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.anon>svg{color:var(--dim);flex:none}

/* ---------- CJENIK (izbornik) ---------- */
.hub{margin-top:30px;scroll-margin-top:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 12px}
.sec-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:36px;letter-spacing:.04em;text-transform:uppercase;line-height:1;background:linear-gradient(180deg,#f6ecff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-h span{font-size:13px;color:var(--dim)}
.search{display:block;position:relative}
.search input{width:100%;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:16px;padding:0 44px 0 46px;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search input::placeholder{color:var(--dim)}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(185,138,255,.15)}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gold);pointer-events:none}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:12px;color:var(--muted);display:none;place-items:center}
.search.has .clear{display:grid}
.promo-line:empty{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:158px;padding:14px;border-radius:20px;text-align:left;color:var(--text);background:radial-gradient(115% 85% at 88% 18%,var(--tc),transparent 62%),linear-gradient(180deg,#241e2e,#16121c);border:1px solid rgba(185,138,255,.2);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 28px -22px #000;transition:transform .2s var(--ease),border-color .2s}
.tile:active{transform:scale(.975)}
.tile:hover{border-color:rgba(185,138,255,.4)}
.imgs{position:absolute;top:12px;right:8px;left:30%;height:96px;display:flex;justify-content:flex-end;align-items:flex-end;pointer-events:none}
.imgs img{height:var(--h,80px);width:auto;max-width:50px;object-fit:contain;margin-left:-10px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.imgs img:nth-child(2){--h:94px;position:relative;z-index:2}
.imgs img:nth-child(3){--h:84px}
.tile .tx{position:relative;z-index:3}
.tile .tn{display:block;font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1;letter-spacing:.03em;text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.tile .tm{display:block;margin-top:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .tag{position:absolute;z-index:3;top:10px;left:10px;height:24px;padding:0 8px;border-radius:8px;display:inline-flex;align-items:center;font-size:11.5px;font-weight:800;color:#1a1004;background:linear-gradient(180deg,#e7d2ff,var(--amber));box-shadow:0 0 14px rgba(255,79,174,.45)}
.tile .kick{display:block;margin-bottom:6px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
.tile .tg{display:block;max-width:52%;margin-top:6px;font-size:13.5px;line-height:1.4;color:var(--muted)}
.tile .go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;height:34px;padding:0 14px;border-radius:999px;background:var(--gold);color:#1a1409;font-size:13px;font-weight:800;width:max-content}
.tile.feat{grid-column:1/-1;min-height:212px;padding:18px}
.tile.feat .imgs{height:166px;left:44%;top:14px;right:10px}
.tile.feat .imgs img{--h:124px;max-width:78px;margin-left:-14px}
.tile.feat .imgs img:nth-child(2){--h:156px}
.tile.feat .imgs img:nth-child(3){--h:138px}
.tile.feat .imgs img:nth-child(4){--h:116px}
.tile.feat .tn{font-size:38px}
#results{margin-top:14px}
.res-n{font-size:13px;color:var(--dim);margin:0 2px 4px}
.res-h{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:16px 2px 8px}

/* ---------- KARTICE PIĆA ---------- */
.list{display:grid;gap:8px}
@media (min-width:640px){.list{grid-template-columns:1fr 1fr}}
.card{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px 10px 8px;min-height:88px;border-radius:16px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid rgba(255,255,255,.045);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 22px -18px #000;cursor:pointer;transition:transform .18s var(--ease),border-color .2s}
.card:active{transform:scale(.985)}
.card:hover{border-color:rgba(185,138,255,.3)}
.card.sig{border-color:rgba(185,138,255,.38)}
.card .thumb{flex:none;width:58px;height:80px;display:grid;place-items:center}
.card .thumb img{max-width:58px;max-height:80px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(255,79,174,.08))}
.card .thumb svg{width:46px;height:62px}
.card .body{flex:1;min-width:0}
.card .row1{display:flex;align-items:baseline;gap:12px}
.card .name{flex:1;min-width:0;font-weight:700;font-size:16px;line-height:1.28}
.card .p1{flex:none;font-weight:800;font-size:16px;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .desc{font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.prs{display:grid;gap:1px;margin-top:6px}
.pr{display:flex;align-items:baseline;gap:8px;font-size:13.5px;color:var(--muted);line-height:1.55}
.pr span{white-space:nowrap}
.pr i{flex:1;min-width:10px;border-bottom:1px dotted rgba(185,138,255,.4);transform:translateY(-4px)}
.pr b{font-size:15px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.b{display:inline-flex;align-items:center;gap:4px;height:23px;padding:0 8px;border-radius:7px;font-size:11.5px;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.06);color:var(--muted)}
.b svg{width:13px;height:13px}
.b.sig{background:linear-gradient(90deg,rgba(221,196,255,.25),rgba(221,196,255,.08));color:var(--gold2)}
.b.na{background:rgba(143,209,158,.14);color:var(--ok)}
.b.xp{background:rgba(255,79,174,.14);color:#f0c2ff}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:26px;color:var(--text);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.promo{display:flex;gap:12px;align-items:center;margin:12px 0 0;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,rgba(255,79,174,.16),rgba(255,79,174,.04));border:1px solid rgba(255,79,174,.35);font-size:14px;font-weight:600;color:#efd9ff}
.promo b{font-family:var(--f-display);font-size:26px;color:var(--amber);text-shadow:0 0 12px rgba(255,79,174,.6);line-height:1;flex:none}
.promo .ptx{min-width:0}
.promo .pst{display:flex;align-items:center;gap:7px;margin-top:6px;font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.01em}
.promo .pst i{width:7px;height:7px;border-radius:50%;background:#6b6258;flex:none}
.promo.on{border-color:rgba(70,224,138,.45)}
.promo.on .pst{color:#c9f5d8}
.promo.on .pst i{background:#46e08a;box-shadow:0 0 10px #46e08a;animation:blink 1.6s infinite}
.was{font-size:12px;line-height:1.2;color:var(--muted);text-align:right;margin:-1px 0 3px;font-variant-numeric:tabular-nums}
.prow b .was{display:block;margin:2px 0 0;font-size:12.5px;font-weight:600}
.prow b{text-align:right}
.tile .tag.on{background:linear-gradient(180deg,#7ff0b0,#2fd17a);box-shadow:0 0 16px rgba(70,224,138,.55)}
.tile .tag.on::before{content:'';width:6px;height:6px;border-radius:50%;background:#0b2a17;margin-right:6px;animation:blink 1.2s infinite}
.tile .kick.ptag{display:inline-flex;align-items:center;width:max-content;height:26px;padding:0 10px;margin-bottom:10px;border-radius:9px;font-size:12px;letter-spacing:.03em;text-transform:none;color:#1a1004;background:linear-gradient(180deg,#e7d2ff,var(--amber));box-shadow:0 0 14px rgba(255,79,174,.45)}
.tile .ptag.on{background:linear-gradient(180deg,#7ff0b0,#2fd17a);box-shadow:0 0 16px rgba(70,224,138,.55)}
.tile .ptag.on::before{content:'';width:6px;height:6px;border-radius:50%;background:#0b2a17;margin-right:7px;animation:blink 1.2s infinite}

/* ---------- STRANICA KATEGORIJE ---------- */
.cbar{position:sticky;top:0;z-index:20;background:rgba(12,10,16,.9);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid rgba(185,138,255,.14)}
.cbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 12px 8px}
.back{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);display:grid;place-items:center;color:var(--gold2);transition:transform .15s}
.back:active{transform:scale(.94)}
.ct{flex:1;min-width:0;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.cbar.scrolled .ct{opacity:1;transform:none}
.ct small{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.ct b{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(17px,5.4vw,22px);letter-spacing:.03em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subnav{max-width:760px;margin:0 auto;padding:0 6px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth;padding:0 6px;mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10px,#000 calc(100% - 10px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--muted);border:1px solid rgba(185,138,255,.18);white-space:nowrap;transition:color .2s,background .25s,border-color .25s,box-shadow .25s}
.chip.on{color:#1a1409;background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:transparent;box-shadow:0 0 16px rgba(221,196,255,.35)}
.chead{position:relative;overflow:hidden;margin:14px 0 4px;padding:20px 18px 18px;min-height:168px;border-radius:24px;display:flex;flex-direction:column;justify-content:flex-end;background:radial-gradient(110% 90% at 88% 22%,var(--tc),transparent 62%),linear-gradient(180deg,#2a231d,#16121c);border:1px solid rgba(185,138,255,.22)}
.chead .imgs{left:46%;height:140px;top:12px;right:10px}
.chead .imgs img{--h:104px;max-width:70px;margin-left:-12px}
.chead .imgs img:nth-child(2){--h:132px}
.chead .imgs img:nth-child(3){--h:116px}
.chead .imgs img:nth-child(4){--h:98px}
.chead .tx{position:relative;z-index:3}
.chead h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.98;letter-spacing:.03em;text-transform:uppercase;text-shadow:0 2px 16px rgba(0,0,0,.8);max-width:62%;text-wrap:balance}
.chead p{margin:8px 0 0;max-width:56%;font-size:13.5px;line-height:1.4;color:var(--muted)}
section.cat{padding-top:20px}
.cat-h{position:relative;display:flex;align-items:baseline;justify-content:space-between;padding:4px 4px 12px}
.cat-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.05em;text-transform:uppercase;background:linear-gradient(180deg,#f6ecff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 22px rgba(255,79,174,.25)}
.cat-h span{font-size:13px;color:var(--dim)}
.cat-h::after{content:"";position:absolute;left:4px;right:4px;bottom:4px;height:1px;background:linear-gradient(90deg,transparent,var(--amber) 20%,#ff3fa4 60%,transparent);opacity:.5}
.catnav{display:grid;gap:10px;margin:28px 0 calc(24px + env(safe-area-inset-bottom))}
.nextg{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px 12px 12px;border-radius:18px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);text-align:left;color:var(--text)}
.nextg .nimg{flex:none;width:44px;height:56px;display:grid;place-items:center}
.nextg .nimg img{max-width:44px;max-height:56px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.nextg .nx{flex:1;min-width:0}
.nextg small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.nextg b{display:block;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.nextg>svg{color:var(--gold2)}
.tohome{justify-self:center;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}

/* ---------- REZERVACIJA + INFO ---------- */
.bookc{margin-top:30px;padding:18px;border-radius:22px;background:linear-gradient(135deg,rgba(221,196,255,.10),rgba(255,255,255,.02)),var(--card);border:1px solid var(--line)}
.bk-h{display:flex;gap:14px;align-items:flex-start}
.bk-ic{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(221,196,255,.12);color:var(--gold2)}
.bookc h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em;line-height:1.05}
.bookc p{margin:5px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.bookc .bigbtn{margin-top:16px;text-decoration:none}
.bookc .alt{margin-top:10px;text-align:center;font-size:13px;color:var(--muted)}
.bookc .alt a{color:var(--gold2);text-decoration:none;font-weight:700}
.info{margin-top:14px;display:grid;gap:12px}
@media (min-width:640px){.info{grid-template-columns:1fr 1fr}}
.ib{padding:16px 18px;border-radius:20px;background:var(--card);border:1px solid rgba(255,255,255,.05);min-width:0}
.ib h3{margin:0 0 8px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.hours{width:100%;border-collapse:collapse;font-size:14.5px}
.hours td{padding:5px 0;color:var(--muted)}
.hours td+td{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.hours tr.today td{color:var(--gold2);font-weight:800}
.ln{display:flex;align-items:center;gap:12px;min-height:50px;color:var(--text);text-decoration:none;font-size:15px;border-top:1px solid rgba(255,255,255,.05)}
.ln:first-of-type{border-top:0}
.ln svg{color:var(--gold2);flex:none}
.ln small{display:block;color:var(--muted);font-size:12.5px}
.soc-row{display:flex;gap:8px;margin-top:10px}
.soc-row a{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:14px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;font-size:14px}
.soc-row svg{color:var(--gold2);flex:none}
.foot{max-width:760px;margin:30px auto 0;padding:24px 16px calc(30px + env(safe-area-inset-bottom));border-top:1px solid var(--line);text-align:center;color:var(--dim);font-size:12.5px;line-height:1.6}
.foot svg{width:46px;margin:0 auto 10px;color:var(--gold);opacity:.85}
.foot p{margin:2px 0}
.foot .lg{color:var(--muted);margin-top:8px}

/* ---------- SHEETS ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,4,3,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.scrim.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:94vh;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#1a1622,#110e16);border-radius:26px 26px 0 0;border-top:1px solid var(--line);box-shadow:0 -20px 60px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .42s var(--ease);padding-bottom:calc(20px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px 18px;background:linear-gradient(180deg,#1a1622 70%,rgba(26,22,34,0))}
.grab::before{content:"";position:absolute;left:50%;top:8px;width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);transform:translateX(-50%)}
.grab h3{margin:12px 0 0;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.close{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--muted);background:rgba(255,255,255,.05);margin-top:8px}
.sheet .pad{padding:0 18px}

/* detail */
.d-name{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.02;letter-spacing:.02em;margin:4px 0 6px;text-transform:uppercase}
.d-desc{color:var(--muted);font-size:16px;margin:0 0 10px}
.stage{position:relative;height:360px;margin:6px -6px 8px;border-radius:22px;background:radial-gradient(55% 50% at 50% 55%,rgba(255,79,174,.16),transparent 70%);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer;overflow:hidden}
.stage .glass{position:absolute;left:50%;top:50%;width:150px;height:200px;transform:translate(-50%,-50%);overflow:visible}
.stage .glass .lg{transition:transform .6s var(--ease)}
.stage .glass .shell{transition:opacity .5s,transform .6s var(--ease);transform-origin:60px 90px}
.stage .glass .gar{transition:transform .6s var(--ease)}
.stage.ex .glass .shell{opacity:.35}
.stage .tap{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:13px;color:var(--gold2);letter-spacing:.08em;text-transform:uppercase;pointer-events:none;animation:breath 2s ease-in-out infinite}
@keyframes breath{50%{opacity:.45}}
.orb{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:8px;width:118px;opacity:0;transform:translate(-50%,-50%) scale(.3);transition:transform .65s var(--ease),opacity .4s;pointer-events:none}
.orb.r{flex-direction:row-reverse;text-align:right}
.orb .o{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.25),rgba(255,255,255,.03) 60%),var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 0 18px -2px var(--c)}
.orb .o svg{width:22px;height:22px}
.orb .t{min-width:0;font-size:12px;line-height:1.2}
.orb .t b{display:block;font-weight:700;color:var(--text)}
.orb .t i{font-style:normal;color:var(--gold2);font-weight:700}
.stage.ex .orb{opacity:1}
.links{position:absolute;inset:0;pointer-events:none}
.links line{stroke:rgba(221,196,255,.45);stroke-width:1;stroke-dasharray:3 4;opacity:0;transition:opacity .4s .35s}
.stage.ex .links line{opacity:1}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.box{background:var(--card);border-radius:16px;padding:12px 14px}
.box h4{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.box.full{grid-column:1/-1}
.str{display:flex;gap:4px}
.str i{width:18px;height:22px;border-radius:5px 5px 9px 9px;background:rgba(255,255,255,.08)}
.str i.on{background:linear-gradient(180deg,var(--gold2),var(--amber));box-shadow:0 0 8px rgba(255,79,174,.5)}
.prof{display:grid;gap:7px}
.prof div{display:grid;grid-template-columns:78px 1fr;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prof s{height:8px;border-radius:9px;background:rgba(255,255,255,.07);position:relative;overflow:hidden;text-decoration:none}
.prof s::after{content:"";position:absolute;inset:0;width:var(--w);border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--amber));transition:width .8s var(--ease)}
.ing{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}
.ing:first-child{border-top:0}
.ing .o{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:0 0 12px -2px var(--c)}
.ing .o svg{width:18px;height:18px}
.ing b{font-size:15px}.ing em{font-style:normal;color:var(--gold2);font-weight:700;margin-left:6px;font-size:14px}
.ing p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.plist{display:grid;gap:8px}
.prow{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 16px;border-radius:14px;background:var(--card);font-size:15px}
.prow b{font-size:20px;color:var(--gold2);font-variant-numeric:tabular-nums}
.bigbtn{width:100%;height:56px;border-radius:16px;margin-top:14px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.bigbtn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1409;border:0;box-shadow:0 8px 24px -10px rgba(221,196,255,.6)}
.hero-ico{height:220px;display:grid;place-items:center;background:radial-gradient(50% 50% at 50% 55%,rgba(255,79,174,.14),transparent 70%);margin:0 -6px 6px;border-radius:22px}
.hero-ico svg{width:120px;height:160px;animation:float 4s ease-in-out infinite}
.hero-ico img{height:150px;width:auto;max-width:220px;object-fit:contain;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 14px 18px rgba(0,0,0,.6)) drop-shadow(0 0 28px rgba(255,79,174,.18))}
.d-head{display:flex;gap:14px;align-items:flex-start}.d-head>div{min-width:0;flex:1}
.d-ph{flex:none;max-width:78px;max-height:110px;object-fit:contain;margin-top:6px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.6))}
@keyframes float{50%{transform:translateY(-6px)}}
.small{font-size:12px;color:var(--dim)}

/* favourites */
.fitem{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid rgba(255,255,255,.06)}
.fitem .fx{flex:1;min-width:0}
.fitem .n{display:block;font-weight:700;font-size:17px;line-height:1.25}
.fitem .n .fb{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.fitem .fps{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px}
.fitem .fp{white-space:nowrap;font-size:14.5px}
.fitem .fp i{font-style:normal;color:var(--muted);margin-right:5px}
.fitem .fp b{color:var(--gold2);font-weight:800;font-variant-numeric:tabular-nums}
.fitem .fnote{display:block;margin-top:3px;font-size:12.5px;color:var(--muted)}
.fitem button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--dim)}
.showmode .fitem .n{font-size:26px;line-height:1.15}
.showmode .fitem .fp{font-size:20px}
.showmode .fitem .fnote{font-size:15px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,160%);opacity:0;background:#2b2621;color:var(--text);padding:12px 18px;border-radius:14px;border:1px solid var(--line);font-weight:600;font-size:14px;transition:transform .35s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap}
.toast.on{transform:translate(-50%,0);opacity:1}

/* QR route */
#qrview{display:none;min-height:100vh;padding:24px 16px;background:#fff;color:#111;text-align:center;font-family:var(--f-body)}
body.qr #qrview{display:block}
body.qr #app{display:none}
#qrview h2{font-family:var(--f-display);font-size:34px;letter-spacing:.06em;margin:8px 0 4px;text-transform:uppercase}
#qrview .qrbox{display:inline-block;padding:18px;border:3px solid #111;border-radius:22px;margin:18px 0 10px;background:#fff}
#qrview .qrbox svg{width:min(78vw,340px);height:auto}
#qrview .u{font-size:14px;word-break:break-all;color:#333}
#qrview .btns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
#qrview .btns button,#qrview .btns a{height:48px;padding:0 18px;border-radius:12px;background:#111;color:#fff;font-weight:700;display:inline-flex;align-items:center;text-decoration:none}
#qrview .btns .sec{background:#eee;color:#111}
@media print{#qrview .btns,#qrview .small{display:none}body{background:#fff}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* actions / socials / feedback */
a.bigbtn{color:var(--text)}a.bigbtn.gold{color:#1a1409}
#fbform label.f{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:18px 0 8px}
#fbform textarea,#fbform input[type=text]{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:16px;padding:14px;outline:none}
#fbform textarea{min-height:130px;resize:vertical}
#fbform textarea:focus,#fbform input[type=text]:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(185,138,255,.15)}
.tps{display:flex;flex-wrap:wrap;gap:8px}
.tp input{position:absolute;opacity:0;pointer-events:none}
.tp span{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--muted);transition:.2s}
.tp input:checked+span{background:var(--gold);color:#1a1409;border-color:var(--gold)}
.tp input:focus-visible+span{outline:2px solid var(--gold2);outline-offset:2px}
.fbstatus{min-height:20px;margin-top:10px;font-size:14px}.fbstatus.err{color:#ff9a8a}
.fbintro{color:var(--muted);margin:0 0 4px}
.fbdone{text-align:center;padding:30px 6px 10px}.fbdone .ok{width:72px;height:72px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:rgba(143,209,158,.15);color:var(--ok);font-size:34px}
.fbdone b{display:block;font-size:20px;margin-bottom:6px}
.hp{position:absolute;left:-9999px}


/* ---------- točenje piva ---------- */
.pourbox{margin:0 -6px 4px;border-radius:22px;background:radial-gradient(60% 55% at 50% 60%,rgba(255,79,174,.12),transparent 70%);cursor:pointer;display:flex;justify-content:center}
.pour{width:100%;max-width:300px;height:auto;overflow:visible}
.pour .handle{transform-box:view-box;transform-origin:120px 30px;animation:hpull .35s .15s var(--ease) forwards,hback .45s 2.95s var(--ease) forwards}
@keyframes hpull{to{transform:rotate(-32deg)}}
@keyframes hback{from{transform:rotate(-32deg)}to{transform:rotate(0)}}
.pour .stream{transform-box:view-box;transform-origin:120px 74px;transform:scaleY(0);animation:sin .28s .42s ease-in forwards,sout .4s 3s ease-in forwards}
@keyframes sin{to{transform:scaleY(1)}}
@keyframes sout{from{transform:scaleY(1)}to{transform:translateY(var(--sl)) scaleY(0)}}
.pour .flow{animation:flow .35s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.pour .fill{transform:translateY(var(--y0));animation:rise 2.55s .6s cubic-bezier(.35,.55,.35,1) forwards}
@keyframes rise{to{transform:translateY(var(--y1))}}
.pour .foam{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.15);animation:foam 2.2s 1.2s ease-out forwards,settle 1.6s 3.4s ease-in-out forwards}
@keyframes foam{to{transform:scaleY(1.12)}}
@keyframes settle{from{transform:scaleY(1.12)}to{transform:scaleY(1)}}
.pour .bub{opacity:0;animation-name:bub;animation-timing-function:ease-in;animation-iteration-count:infinite}
@keyframes bub{0%{opacity:0;transform:translateY(0)}15%{opacity:.85}90%{opacity:.7}100%{opacity:0;transform:translateY(var(--d))}}
.pour .drops{opacity:1}.pour .drops ellipse{opacity:0;animation:drop .8s ease-out forwards}
@keyframes drop{to{opacity:.35}}
.pour .etch{color:#fff;opacity:.55;mix-blend-mode:screen}
.pour .glow{opacity:0;animation:fadein .8s 1.4s forwards}
.pourctl{display:flex;justify-content:center;align-items:center;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(0,0,0,.25)}
.seg button{min-width:64px;height:38px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--gold);color:#1a1409}
@media (prefers-reduced-motion:reduce){.pour .fill{transform:translateY(var(--y1))}.pour .stream{transform:scaleY(0)}.pour .foam{transform:none}.pour .drops ellipse{opacity:.35}.pour .glow{opacity:1}}
.pill{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.2s}
.pill[aria-pressed=true]{color:#1a1409;background:var(--gold);border-color:var(--gold)}

/* ---------- raspored pločica bez preklapanja ---------- */
.brand{flex:1}
.brand h1{font-size:clamp(23px,7.4vw,29px);overflow:hidden;text-overflow:ellipsis}
.tile{justify-content:space-between;min-height:0;padding:12px 14px 14px}
.tile .imgs{position:relative;inset:auto;height:88px;margin:0 -6px 12px 0;justify-content:flex-end}
.tile.feat{display:grid;grid-template-columns:minmax(0,1fr) 44%;align-items:center;gap:8px;min-height:0;padding:20px 16px 20px 20px}
.tile.feat .imgs{order:2;height:170px;margin:0;justify-content:center}
.tile.feat .tx{order:1}
.tile.feat .tn{font-size:clamp(32px,9.6vw,40px)}
.tile.feat .tg{max-width:none}
@media (min-width:640px){.tile.feat{grid-column:1/-1;grid-template-columns:minmax(0,1fr) 38%}}
.chead{display:grid;grid-template-columns:minmax(0,1fr) 42%;align-items:center;gap:8px;min-height:0;padding:20px 14px 20px 20px}
.chead .imgs{position:relative;inset:auto;order:2;height:150px;margin:0;justify-content:center}
.chead .tx{order:1}
.chead h1{max-width:none;font-size:clamp(32px,9.6vw,42px)}
.chead p{max-width:none}
.cbar{background:rgba(12,10,16,.97)}
/* fotke su male (izrezane s postojećeg menija) — ne povećavati previše da ostanu oštre */
.tile.feat .imgs{height:132px}
.tile.feat .imgs img{--h:100px;max-width:72px;margin-left:-16px}
.tile.feat .imgs img:nth-child(2){--h:122px}
.tile.feat .imgs img:nth-child(3){--h:106px}
.chead .imgs{height:128px}
.chead .imgs img{--h:94px;max-width:62px;margin-left:-12px}
.chead .imgs img:nth-child(2){--h:118px}
.chead .imgs img:nth-child(3){--h:106px}
.chead .imgs img:nth-child(4){--h:90px}
/* bez vodoravnog pomicanja stranice na mobitelu */
html,body{overflow-x:clip}
.hero>.lights{inset:-60px 0 -10px 0}
.tile.feat{grid-template-columns:minmax(0,1fr) 50%}
.tile.feat .imgs img{max-width:66px;margin-left:-20px}
.tile.feat .imgs img:first-child,.chead .imgs img:first-child,.tile .imgs img:first-child{margin-left:0}
.chead .imgs img{max-width:58px;margin-left:-14px}
.tile.feat .imgs,.chead .imgs{left:auto;top:auto;right:auto}
.chead .imgs img{max-width:54px}
/* ukrasni sadržaj se reže, ali se kontejner nikad ne pomiče vodoravno */
.rate,.tile,.chead{overflow:hidden;overflow:clip}

/* recenzija: zadnja pločica sama u redu ide preko cijele širine; oznake činjenica ne lome se */
@media (max-width:639px){.tile.wide{grid-column:1/-1}}
.fact span{white-space:nowrap}

/* živa akcija na početnoj (odbrojavanje u sekundi) */
.pline{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0 2px;padding:12px 14px;border-radius:16px;background:linear-gradient(90deg,rgba(255,79,174,.24),rgba(255,79,174,.06));border:1px solid rgba(255,79,174,.55);color:var(--text);text-align:left;box-shadow:0 0 24px -8px rgba(255,79,174,.6);animation:plg 2.4s ease-in-out infinite;cursor:pointer}
.pline b{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--amber);line-height:1;white-space:nowrap}
.pline span{flex:1;font-weight:800;font-size:15px;min-width:0}
.pline em{display:block;font-style:normal;font-weight:600;font-size:13px;color:var(--muted)}
.pline .cd{font-style:normal;font-variant-numeric:tabular-nums;font-weight:800;color:var(--text);font-size:15px}
@keyframes plg{50%{box-shadow:0 0 36px -6px rgba(255,79,174,.85)}}

.card .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brand .logo{color:var(--text)}
.abv{font-size:22px;font-family:var(--f-display);letter-spacing:.04em}
.box.facts{display:grid;gap:8px;margin-top:10px}
.fact{display:flex;justify-content:space-between;gap:14px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:7px}
.fact:last-child{border-bottom:0;padding-bottom:0}
.fact span{color:var(--muted)}.fact b{text-align:right;font-weight:700}
/* logotip kao natpis (Brooklyn, Kafanica): natpis umjesto imena u zaglavlju */
.brand.wm{flex-direction:column-reverse;align-items:flex-start;gap:3px}
.brand.wm .logo{width:auto;height:var(--wmh,44px);max-width:min(60vw,250px);color:var(--text);filter:drop-shadow(0 0 10px rgba(255,79,174,.28))}
.brand.wm h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* intro: samo klub (bez vrata) */
#intro.m-club .club{animation-delay:.1s}
#intro.m-club .beams i{animation-delay:.35s,0s}
#intro.m-club .lasers{animation-delay:.5s}
#intro.m-club .strobe{animation-delay:.45s}
#intro.m-club .welcome{animation-delay:1.05s}
/* intro: viseće lampe (Kafanica) */
#intro.m-lamps{background:radial-gradient(120% 75% at 50% 18%,#3a1517 0%,#1a0a0b 52%,#070303 100%)}
#intro.m-lamps .wall{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,220,180,.025) 0 1px,transparent 1px 38px),linear-gradient(180deg,transparent 60%,rgba(0,0,0,.55));animation:fadein 1.2s both}
#intro.m-lamps .lamp{position:absolute;top:0;left:var(--x);width:0;height:100%;transform-origin:50% 0;animation:sway var(--sw) ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
#intro.m-lamps .cord{position:absolute;left:-1px;top:0;width:2px;height:var(--len);background:linear-gradient(#120a08,#4a3328)}
#intro.m-lamps .shade{position:absolute;top:var(--len);left:-27px;width:54px;height:32px;background:linear-gradient(180deg,#c8283a 0%,#8e1424 70%,#5e0c17 100%);clip-path:polygon(32% 0,68% 0,100% 100%,0 100%);filter:brightness(.45);animation:shadeOn .9s var(--on) forwards}
#intro.m-lamps .shade::after{content:"";position:absolute;left:50%;bottom:-6px;width:16px;height:12px;margin-left:-8px;border-radius:50%;background:#fff1c9;opacity:0;animation:bulb .9s var(--on) forwards}
#intro.m-lamps .cone{position:absolute;top:calc(var(--len) + 28px);left:-110px;width:220px;height:62vh;background:radial-gradient(55% 60% at 50% 0%,rgba(255,200,130,.38),rgba(255,160,90,.10) 55%,transparent 75%);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);opacity:0;animation:coneOn .9s var(--on) forwards;mix-blend-mode:screen}
@keyframes shadeOn{0%{filter:brightness(.45)}30%{filter:brightness(1.25)}42%{filter:brightness(.6)}58%,100%{filter:brightness(1.15)}}
@keyframes bulb{0%{opacity:0}30%{opacity:1;box-shadow:0 0 22px 8px rgba(255,214,150,.9)}42%{opacity:.3;box-shadow:none}58%,100%{opacity:1;box-shadow:0 0 26px 10px rgba(255,214,150,.85)}}
@keyframes coneOn{0%{opacity:0}30%{opacity:.9}42%{opacity:.2}58%,100%{opacity:1}}
#intro.m-lamps .welcome{position:absolute;left:0;right:0;top:46vh;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;transform:translateY(12px);animation:welcome .9s 1.45s cubic-bezier(.2,.8,.2,1) forwards;color:#fff6ec;padding:0 16px}
#intro.m-lamps .welcome svg{width:min(66vw,280px);filter:drop-shadow(0 0 16px rgba(255,190,120,.5))}
#intro.m-lamps .welcome b{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8.5vw,50px);letter-spacing:.08em;text-transform:uppercase;margin-top:12px;line-height:1;text-shadow:0 0 18px rgba(255,170,90,.5)}
#intro.m-lamps .welcome small{margin-top:8px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#f2d08c}
/* intro: rijeka i most (Brooklyn) */
#intro.m-river{background:#07141a}
#intro.m-river .sky{position:absolute;inset:0;background:linear-gradient(180deg,#071c2a 0%,#0d3446 38%,#2f5c66 56%,#e8a565 66%,#f3c27f 69%,#0a2632 70%,#061820 100%);animation:dusk 3s ease-out both}
@keyframes dusk{from{filter:brightness(.55) saturate(.8)}to{filter:none}}
#intro.m-river .sun{position:absolute;left:50%;top:67%;width:46vmin;height:46vmin;margin:-23vmin 0 0 -23vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,150,.95),rgba(255,170,90,.45) 45%,transparent 72%);animation:sunup 2.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes sunup{from{transform:translateY(8vh) scale(.8);opacity:0}to{transform:none;opacity:1}}
#intro.m-river .bridge{position:absolute;left:0;right:0;top:auto;bottom:30%;width:100%;height:46%;color:#04121a}
#intro.m-river .bridge .lamp{fill:#ffd79a;filter:drop-shadow(0 0 3px #ffb35c);opacity:0;animation:lamp .5s forwards}
@keyframes lamp{to{opacity:1}}
#intro.m-river .water{position:absolute;left:0;right:0;bottom:0;height:30%;overflow:hidden;background:linear-gradient(180deg,rgba(243,194,127,.35),rgba(6,24,32,0) 60%)}
#intro.m-river .water i{position:absolute;left:-10%;right:-10%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,220,170,.75),transparent);animation:shimmer 2.4s ease-in-out infinite alternate}
#intro.m-river .water i:nth-child(1){top:10%;animation-delay:-.4s}#intro.m-river .water i:nth-child(2){top:24%;left:10%;right:20%;animation-delay:-1.1s}
#intro.m-river .water i:nth-child(3){top:40%;left:-20%;right:30%;animation-delay:-.7s}#intro.m-river .water i:nth-child(4){top:58%;left:30%;right:-20%;animation-delay:-1.6s}
@keyframes shimmer{from{transform:translateX(-6%);opacity:.35}to{transform:translateX(6%);opacity:.9}}
#intro.m-river .welcome{position:absolute;left:0;right:0;top:12vh;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;transform:translateY(10px);animation:welcome .8s .5s cubic-bezier(.2,.8,.2,1) forwards;color:#fff2dc}
#intro.m-river .welcome svg{width:min(44vw,190px);filter:drop-shadow(0 0 10px rgba(255,200,130,.55))}
#intro.m-river .welcome b{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9.5vw,56px);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 0 18px rgba(255,190,110,.55);margin-top:6px;line-height:1}
#intro.m-river .welcome small{margin-top:8px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#ffe6c4;padding:0 16px}

/* Minimal QR encoder (byte mode, ECC M, versions 1–15). Returns boolean matrix [y][x]. */
function qrMatrix(text){
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24];
  const BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10];
  const bytes=Array.from(new TextEncoder().encode(text));
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;};
  const dataCw=v=>Math.floor(raw(v)/8)-ECC[v]*BLK[v];
  let ver=1;
  for(;ver<=15;ver++){const cc=ver<10?8:16;if(4+cc+bytes.length*8<=dataCw(ver)*8)break;}
  if(ver>15)throw new Error('URL too long');
  const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1);};
  put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
  const cap=dataCw(ver)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
  for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b);}
  // GF(256) Reed–Solomon
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z&255;};
  const divisor=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1];}root=mul(root,2);}return r;};
  const rem=(dat,div)=>{const r=div.map(()=>0);for(const b of dat){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f));}return r;};
  const nb=BLK[ver],ec=ECC[ver],rawCw=Math.floor(raw(ver)/8),nShort=nb-rawCw%nb,shortLen=Math.floor(rawCw/nb);
  const div=divisor(ec),blocks=[];
  for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-ec+(i<nShort?0:1));k+=dat.length;const e=rem(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(e));}
  const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-ec||j>=nShort)cw.push(b[i]);});
  // Matrix
  const size=ver*4+17,M=[],F=[];for(let y=0;y<size;y++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false));}
  const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
  for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)set(x,y,d!==2&&d!==4);}};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  if(ver>1){const n=Math.floor(ver/7)+2,step=Math.ceil((ver*4+4)/(n*2-2))*2,pos=[6];for(let p=size-7;pos.length<n;p-=step)pos.splice(1,0,p);
    pos.forEach((a,i)=>pos.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===n-1)||(i===n-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}));}
  const drawFormat=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)===1;
    for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
    for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true);};
  drawFormat(0);

  const applyMask=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&MF[m](x,y))M[y][x]=!M[y][x];};
  const penalty=()=>{let p=0,dark=0;const line=get=>{let run=1;for(let k=1;k<size;k++){if(get(k)===get(k-1)){run++;if(run===5)p+=3;else if(run>5)p++;}else run=1;}
      const s=Array.from({length:size},(_,k)=>get(k)?1:0).join('');let idx=-1;while((idx=s.indexOf('1011101',idx+1))!==-1){const a=s.slice(Math.max(0,idx-4),idx),b=s.slice(idx+7,idx+11);if((idx<4||a==='0000')||(idx+11>size||b==='0000'))p+=40;}};
    for(let y=0;y<size;y++)line(x=>M[y][x]);for(let x=0;x<size;x++)line(y=>M[y][x]);
    for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3;}
    M.forEach(r=>r.forEach(c=>{if(c)dark++;}));const t=size*size;p+=Math.max(0,Math.ceil(Math.abs(dark*20-t*10)/t)-1)*10;return p;};
  let best=0,bestP=Infinity;for(let m=0;m<8;m++){applyMask(m);drawFormat(m);const p=penalty();if(p<bestP){bestP=p;best=m;}applyMask(m);}
  applyMask(best);drawFormat(best);
  return M;
}
if(typeof module!=='undefined')module.exports=qrMatrix;

function cleanPreorder(list) {

  return list.slice(0, 8).map(x => ({ id: str(x.id, 80), name: str(x.name, 80), vol: str(x.vol, 16), eur: num(x.eur, 0, 10000) ?? 0, qty: Math.floor(num(x.qty, 1, 10) ?? 1) }))

async function availability(store, date) {

  const now = zagrebNow();

  if (date === now.date) slots = slots.filter(m => m >= now.min + cfg.leadMinutes);
  const busy = list.filter(r => ACTIVE.has(r.status)).map(r => ({ t: r.tableId, s: r.start, e: r.end }));
  return { date, slots, busy, config: publicConfig(cfg), today: now.date };
}
async function createReservation(store, body, { admin = false } = {}) {
  const cfg = await getConfig(store);
  if (body.hp) return { error: 'spam', status: 400 };
  const date = str(body.date, 10);
  if (!isDate(date)) return { error: 'date', status: 400 };
  const now = zagrebNow();
  const party = Math.floor(Number(body.party));
  if (!(party >= 1 && party <= (admin ? 60 : cfg.maxParty))) return { error: 'party', status: 400 };
  const start = Math.floor(Number(body.start));
  const name = str(body.name, 80);
  const phoneRaw = str(body.phone, 30);
  const phone = cleanPhone(phoneRaw);
  const email = str(body.email, 120);
  if (!name || name.length < 2) return { error: 'name', status: 400 };
  if (!admin && !phone) return { error: 'phone', status: 400 };
  if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { error: 'email', status: 400 };
  if (!admin) {
    if (!body.consent) return { error: 'consent', status: 400 };
    const last = addDays(now.date, cfg.daysAhead);
    if (date < now.date || date > last) return { error: 'date', status: 400 };
    if (!slotsFor(cfg, date).includes(start)) return { error: 'time', status: 400 };
    if (date === now.date && start < now.min + cfg.leadMinutes) return { error: 'time', status: 400 };
  } else if (!(start >= 0 && start < 2880)) return { error: 'time', status: 400 };
  const preorder = cfg.features?.preorder ? cleanPreorder(body.preorder) : [];

  const res = await mutateDay(store, date, list => {
    let table = null;
    if (body.tableId && body.tableId !== 'any') {
      table = cfg.tables.find(t => t.id === body.tableId);
      if (!table) return { error: 'table', status: 400 };
      if (!admin && !fits(table, party)) return { error: 'fit', status: 409 };
      if (!tableFree(cfg, list, table.id, start)) return { error: 'taken', status: 409 };
    } else {
      table = bestTable(cfg, list, party, start);
      if (!table) return { error: 'full', status: 409 };
    }
    const at = isoNow();
    const r = {
      id: token(8), code: shortCode(), key: token(16),
      date, start, end: start + cfg.durationMinutes, party, tableId: table.id,
      name, phone: phone || phoneRaw, email, note: str(body.note, 400), occasion: str(body.occasion, 30),
      preorder, sparkler: !!(preorder.length && body.sparkler),
      lang: body.lang === 'en' ? 'en' : 'hr',
      status: admin ? (['pending', 'confirmed', 'seated', 'done', 'noshow'].includes(body.status) ? body.status : 'confirmed') : (cfg.autoConfirm ? 'confirmed' : 'pending'),
      source: admin ? str(body.source || 'staff', 20) : 'web',
      createdAt: body._at && admin ? str(body._at, 30) : at, updatedAt: at, history: []
    };
    list.push(r);
    return { ok: true, reservation: r, table };
  });
  if (res.ok) await setIndex(store, res.reservation.id, date);
  return res;
}
const guestView = r => ({ id: r.id, code: r.code, date: r.date, start: r.start, end: r.end, party: r.party, tableId: r.tableId, name: r.name, status: r.status, note: r.note, occasion: r.occasion, lang: r.lang, preorder: r.preorder || [], sparkler: !!r.sparkler });
async function getReservation(store, id, key, site = '') {

  return { ok: true, reservation: guestView(r), table: cfg.tables.find(t => t.id === r.tableId) || null, config: publicConfig(cfg), notice };

async function defaultDay(store) {

  for (let i = 0; i < 8; i++) {

    if (slotsFor(cfg, d).length) return d;
    const { list } = await readDay(store, d);

}

async function adminUpdate(store, body) {
  const cfg = await getConfig(store);
  const id = str(body.id, 40);
  const date = await findDate(store, id);
  if (!date) return { error: 'notfound', status: 404 };
  const STAT = ['pending', 'confirmed', 'declined', 'cancelled', 'seated', 'done', 'noshow'];
  let moved = null;
  const res = await mutateDay(store, date, list => {
    const r = list.find(x => x.id === id);
    if (!r) return { error: 'notfound', status: 404 };
    const before = r.status;
    if (body.status) { if (!STAT.includes(body.status)) return { error: 'status', status: 400 }; r.status = body.status; }
    if (body.tableId && body.tableId !== r.tableId) {
      if (!cfg.tables.find(t => t.id === body.tableId)) return { error: 'table', status: 400 };
      if (ACTIVE.has(r.status) && !tableFree(cfg, list, body.tableId, r.start, r.id)) return { error: 'taken', status: 409 };
      r.tableId = body.tableId;
    }
    if (body.start != null && Number(body.start) !== r.start) {
      const s = Math.floor(Number(body.start)); if (!(s >= 0 && s < 2880)) return { error: 'time', status: 400 };
      if (ACTIVE.has(r.status) && !tableFree(cfg, list, r.tableId, s, r.id)) return { error: 'taken', status: 409 };
      r.start = s; r.end = s + cfg.durationMinutes;
    }
    if (body.party != null) { const p = Math.floor(Number(body.party)); if (p >= 1 && p <= 60) r.party = p; }
    if (body.staffNote != null) r.staffNote = str(body.staffNote, 400);
    if (body.date && body.date !== date) moved = str(body.date, 10);
    r.updatedAt = isoNow();
    r.history.push({ at: r.updatedAt, by: 'staff', from: before, to: r.status });
    return { ok: true, reservation: r, changedStatus: before !== r.status };
  });
  if (res.ok && moved && isDate(moved)) {
    const r = res.reservation;
    const add = await mutateDay(store, moved, list => {
      if (ACTIVE.has(r.status) && !tableFree(cfg, list, r.tableId, r.start, r.id)) return { error: 'taken', status: 409 };
      list.push({ ...r, date: moved }); return { ok: true };
    });
    if (add.error) return add;
    await mutateDay(store, date, list => { const i = list.findIndex(x => x.id === r.id); if (i >= 0) list.splice(i, 1); return { ok: true }; });
    await setIndex(store, r.id, moved);
    res.reservation = { ...r, date: moved };
  }
  return res;
}
async function adminSaveConfig(store, cfgIn) {

  const keys = ['venue', 'phone', 'plan', 'zones', 'tables', 'hours', 'slotMinutes', 'durationMinutes', 'leadMinutes', 'daysAhead', 'maxParty', 'holdMinutes', 'closedDates', 'autoConfirm', 'rules', 'features'];
  for (const k of keys) if (cfgIn[k] !== undefined) next[k] = cfgIn[k];

const LIVE_KINDS = ['call', 'bill', 'order', 'song'];
const liveKey = d => `live/${d}`;
const OPEN = new Set(['new', 'ack']);
async function liveCreate(store, body) {
  const cfg = await getConfig(store);
  const kind = str(body.kind, 10);
  if (!LIVE_KINDS.includes(kind)) return { error: 'kind', status: 400 };
  if (kind === 'song' && !cfg.features?.songs) return { error: 'kind', status: 400 };
  if (!cfg.features?.tableMode) return { error: 'off', status: 403 };
  const table = str(body.table, 8).replace(/[^\w-]/g, '');
  if (!table && kind !== 'song') return { error: 'table', status: 400 };
  const b = bizNow();
  const item = { id: token(6), k: token(10), kind, table, status: 'new', createdAt: isoNow(), lang: body.lang === 'en' ? 'en' : 'hr' };
  if (kind === 'bill') item.pay = ['card', 'cash'].includes(body.pay) ? body.pay : '';
  if (kind === 'order') {
    const items = Array.isArray(body.items) ? body.items.slice(0, 25).map(x => ({ id: str(x.id, 80), n: str(x.n, 80), v: str(x.v, 24), q: Math.floor(num(x.q, 1, 20) ?? 1), e: num(x.e, 0, 10000) ?? 0 })).filter(x => x.n) : [];
    if (!items.length) return { error: 'items', status: 400 };
    item.items = items; item.total = Math.round(items.reduce((a, x) => a + x.q * x.e, 0) * 100) / 100;
  }
  if (kind === 'song') {
    item.song = { title: str(body.title, 80), artist: str(body.artist, 60), ded: str(body.ded, 120) };
    if (item.song.title.length < 2) return { error: 'title', status: 400 };
  }
  item.note = str(body.note, 200);
  return mutate(store, liveKey(b.date), [], list => {
    const open = list.filter(x => OPEN.has(x.status) && x.table === table);
    if ((kind === 'call' || kind === 'bill') && table) {
      const dup = open.find(x => x.kind === kind && Date.now() - Date.parse(x.createdAt) < 20 * 60e3);
      if (dup) return { ok: true, noop: true, dup: true, id: dup.id, k: dup.k, item: dup };
    }
    if (open.length >= 12) return { error: 'limit', status: 429 };
    if (kind === 'song' && list.filter(x => x.kind === 'song' && x.status === 'new' && x.table === table).length >= 3) return { error: 'limit', status: 429 };
    list.push(item);
    if (list.length > 600) list.splice(0, list.length - 600);
    return { ok: true, id: item.id, k: item.k, item };
  });
}

   STATISTIKA (otvaranja menija, pregledi pića, klikovi na recenziju…)
   Podijeljeno u 8 komada da se istovremeni upisi ne sudaraju.
   ===================================================================== */
const SHARDS = 8;
const stKey = (d, s) => `st/${d}/${s}`;
const EMPTY_ST = { open: 0, review: 0, book: 0, table: 0, view: {}, names: {} };
async function statsHit(store, body) {
  const ev = Array.isArray(body.ev) ? body.ev.slice(0, 40) : [];
  if (!ev.length) return { ok: true };
  const date = isDate(body.date) && body.date >= addDays(zagrebNow().date, -30) ? body.date : bizNow().date;
  const s = Math.floor(Math.random() * SHARDS);
  return mutate(store, stKey(date, s), EMPTY_ST, doc => {
    for (const e of ev) {
      const t = str(e.t, 10), n = Math.max(1, Math.min(500, Math.floor(+e.n || 1)));
      if (t === 'view') { const id = str(e.id, 80); if (!id) continue; doc.view[id] = (doc.view[id] || 0) + n; if (e.name) doc.names[id] = str(e.name, 80); }
      else if (['open', 'review', 'book', 'table'].includes(t)) doc[t] = (doc[t] || 0) + n;
    }
    return { ok: true };
  });
}
async function statsDay(store, date) {
  const out = structuredClone(EMPTY_ST);
  for (let s = 0; s < SHARDS; s++) {
    const r = await store.getJSON(stKey(date, s)); if (!r?.data) continue; const d = r.data;
    for (const k of ['open', 'review', 'book', 'table']) out[k] += d[k] || 0;
    for (const [id, n] of Object.entries(d.view || {})) out.view[id] = (out.view[id] || 0) + n;
    Object.assign(out.names, d.names || {});
  }
  return out;
}
async function adminStats(store, days = 14) {
  const b = bizNow(); const series = []; const tot = structuredClone(EMPTY_ST);
  for (let i = days - 1; i >= 0; i--) {
    const d = addDays(b.date, -i); const s = await statsDay(store, d);
    series.push({ date: d, open: s.open, review: s.review, book: s.book, table: s.table });
    for (const k of ['open', 'review', 'book', 'table']) tot[k] += s[k];
    for (const [id, n] of Object.entries(s.view)) tot.view[id] = (tot.view[id] || 0) + n;
    Object.assign(tot.names, s.names);
  }
  const top = Object.entries(tot.view).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([id, n]) => ({ id, n, name: tot.names[id] || id }));
  return { ok: true, days: series, total: { open: tot.open, review: tot.review, book: tot.book, table: tot.table }, top };
}

  function injectCSS() { const s = document.createElement('style'); s.textContent = CSS + (q.get('pres') ? '\n#tonight .live.demo{display:none}' : ''); document.head.appendChild(s); }

          const bottle = items.some(x => x.unit === 'bottle' && /^(0,7|0,75|1|1,5)/.test(x.vol || ''));

  /* ---------- prskalica (boca) ---------- */
  function sparkle() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let c = document.getElementById('ttfx'); if (!c) { c = document.createElement('canvas'); c.id = 'ttfx'; document.body.appendChild(c); }
    const dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight; c.width = W * dpr; c.height = H * dpr; c.style.display = 'block';
    const x = c.getContext('2d'); x.scale(dpr, dpr); const P = []; const t0 = performance.now(); const cols = ['#fff6d5', '#ffd27a', '#ffb347', '#ffffff'];

      const el = now - t0; x.clearRect(0, 0, W, H);
      if (el < 2400) { const sx = W / 2 + Math.sin(el / 240) * W * .2, sy = H * .32 + Math.cos(el / 380) * 24; for (let i = 0; i < 14; i++) { const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5; P.push({ x: sx, y: sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, l: 0, ml: 22 + Math.random() * 28, c: cols[i % 4], r: 1.3 + Math.random() * 1.5 }); } x.fillStyle = 'rgba(255,240,200,.95)'; x.beginPath(); x.arc(sx, sy, 5 + Math.random() * 3, 0, 7); x.fill(); }
      for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; p.l++; p.x += p.vx; p.y += p.vy; p.vy += .12; p.vx *= .985; if (p.l > p.ml) { P.splice(i, 1); continue; } x.globalAlpha = 1 - p.l / p.ml; x.fillStyle = p.c; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill(); }
      x.globalAlpha = 1; if (P.length || el < 2400) requestAnimationFrame(step); else c.style.display = 'none';
    })(t0);
    TT.buzz([10, 30, 10, 30, 10, 30, 60]);
  }
  TTX.sparkle = sparkle;

  /* ---------- kuke iz cjenika ---------- */
  TTX.favs = () => { if (!TABLE) return false; orderSheet(); return true; };
  TTX.view = (it, d) => {
    hit({ t: 'view', id: it.id, name: it.name });
    if (it._so) { const p = d.querySelector('.pad'); if (p && !p.querySelector('.tt-sonote')) { const n = document.createElement('div'); n.className = 'tt-sonote'; n.textContent = '⛔ ' + tx('soDetail'); p.insertBefore(n, p.firstChild); } }
  };

    await TT.api('/feedback', { body: { topic: fd.get('tema'), msg: fd.get('poruka'), when: fd.get('kada'), contact: fd.get('kontakt'), table: TABLE || '', lang: M.lang, hp: fd.get('bot-field') || '' } });
  };
  TTX.init = m => {
    M = m; injectCSS();
    const meta = M.MENU.meta;
    if (V.booking !== false) { meta.reservationUrl = TT.keepClock('rezervacije/'); meta.booking = true; }

    hit({ t: 'open' }); if (TABLE && q.get('stol')) hit({ t: 'table' });
    setTimeout(() => {
      bar(); loadOv(true);
      new MutationObserver(() => { markSold(); paintBar(); }).observe(document.getElementById('app') || document.body, { childList: true, subtree: true });

    if (TT.mode === 'live') setInterval(() => { if (document.visibilityState === 'visible') loadOv(false); }, 60000);
    TT.watchGuest();
  };
})();

let VIEW={v:'home'},homeY=0,skipPop=false,depth=0;
const keyOf=s=>s.v==='cat'?'cat:'+s.g:s.v;
function stateFromHash(){const h=decodeURIComponent(location.hash.slice(1));if(h==='qr')return {v:'qr'};if(GBY[h])return {v:'cat',g:h};return {v:'home'};}
function go(st,opt={}){if(VIEW.v==='home')homeY=scrollY;const prev=keyOf(VIEW);VIEW=st;
 try{history.pushState({view:st},'',st.v==='cat'?'#'+st.g:location.pathname+location.search);depth++;}catch(e){}
 applyView(prev!==keyOf(st),opt);}
function goBack(){if(depth>0){try{history.back();return}catch(e){}}go({v:'home'});}
function applyView(changed,opt={}){
 const qr=VIEW.v==='qr';document.body.classList.toggle('qr',qr);if(qr){renderQR();return}
 const home=VIEW.v==='home',vh=$('#vHome'),vc=$('#vCat');vh.hidden=!home;vc.hidden=home;
 const anim=(el,c)=>{el.classList.remove('in-r','in-l');if(opt.first||reduced)return;void el.offsetWidth;el.classList.add(c);};
 if(home){if(changed){anim(vh,'in-l');jump(opt.focusSearch?Math.max(0,$('#hub').getBoundingClientRect().top+scrollY-8):homeY);}}
 else{renderCat(GBY[VIEW.g]);anim(vc,'in-r');jump(0);$('.cbar').classList.remove('scrolled');requestAnimationFrame(()=>{spy();onScroll();});}
}

/* ================= podkartice (scrollspy) ================= */
let lockTo=null,lockT=null,spyQ=false,active=null;
const barH=()=>{const b=$('.cbar');return b?b.offsetHeight:0};
function spy(){if(VIEW.v!=='cat'||lockTo)return;const y=barH()+24;let cur=null;const secs=$$('#catBody section.cat');
 for(const s of secs){if(!cur)cur=s.dataset.cat;if(s.getBoundingClientRect().top<=y)cur=s.dataset.cat;else break;}
 if(secs.length&&innerHeight+scrollY>=document.documentElement.scrollHeight-4)cur=secs[secs.length-1].dataset.cat; // dno stranice = zadnje poglavlje
 if(cur)setActive(cur);}
function onScroll(){if(VIEW.v!=='cat')return;const hd=$('#catBody .chead');$('.cbar').classList.toggle('scrolled',!!hd&&hd.getBoundingClientRect().bottom<barH()+6);
 if(lockTo){clearTimeout(lockT);lockT=setTimeout(()=>{lockTo=null;spy();},160);return;}
 if(!spyQ){spyQ=true;requestAnimationFrame(()=>{spyQ=false;spy();});}}
addEventListener('scroll',onScroll,{passive:true});
function goSec(id,smooth=true){const s=$('#s-'+id);if(!s)return;lockTo=id;setActive(id);
 const top=Math.max(0,s.getBoundingClientRect().top+scrollY-barH()+2);
 if(Math.abs(top-scrollY)<2){lockTo=null;return;}
 clearTimeout(lockT);lockT=setTimeout(()=>{lockTo=null;spy();},1200);
 if(smooth&&!reduced)scrollTo({top,behavior:'smooth'});else jump(top);}
function setActive(id){if(active===id)return;active=id;$$('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.sec===id));
 const ch=$(`#chips .chip[data-sec="${id}"]`),row=$('#chips');if(ch)row.scrollTo({left:ch.offsetLeft-row.clientWidth/2+ch.clientWidth/2,behavior:reduced?'auto':'smooth'});}

const scrim=$('#scrim');let openSheet=null;
function showSheet(el){if(openSheet&&openSheet!==el)hideSheet(true);openSheet=el;el.hidden=false;requestAnimationFrame(()=>{el.classList.add('on');scrim.classList.add('on');});document.body.classList.add('lock');el.scrollTop=0;
 try{history.pushState({sheet:el.id},'')}catch(e){}}
function hideSheet(silent){const el=openSheet;if(!el)return;el.classList.remove('on');el.style.transform='';scrim.classList.remove('on');document.body.classList.remove('lock');openSheet=null;setTimeout(()=>{if(!el.classList.contains('on'))el.hidden=true;},450);
 if(!silent&&history.state&&history.state.sheet){skipPop=true;try{history.back()}catch(e){skipPop=false}}}
addEventListener('popstate',e=>{if(skipPop){skipPop=false;return}
 if(openSheet){hideSheet(true);return}
 const st=(e.state&&e.state.view)||stateFromHash();if(VIEW.v==='home')homeY=scrollY;const prev=keyOf(VIEW);VIEW=st;depth=Math.max(0,depth-1);applyView(prev!==keyOf(st));});
addEventListener('hashchange',()=>{const st=stateFromHash();if(keyOf(st)===keyOf(VIEW))return;if(VIEW.v==='home')homeY=scrollY;VIEW=st;applyView(true);});

addEventListener('keydown',e=>{if(e.key==='Escape'&&openSheet)hideSheet();});

/* drag to close / implode */
$$('.sheet').forEach(sh=>{let y0=null,dy=0;
 sh.addEventListener('touchstart',e=>{if(sh.scrollTop<=0){y0=e.touches[0].clientY;dy=0;}else y0=null;},{passive:true});

 const logo=`<g class="etch" transform="translate(${cx-22} ${G.t+h*.5-16}) scale(.2)">${LOGO}</g>`;
 return `<svg class="pour" viewBox="0 -54 240 360" role="img" aria-label="${lang==='hr'?'Točenje piva':'Pouring a beer'}" style="--y0:${start}px;--y1:${surf.toFixed(1)}px;--sl:${(G.b-78)}px">

  </defs>

function pourBlock(it,size){
 return `<div class="pourbox" data-size="${size}">${pourScene(it,size)}</div>
 <div class="pourctl"><div class="seg">${[['s',lang==='hr'?'0,25 l':'0.25 l'],['b',lang==='hr'?'0,5 l':'0.5 l']].map(([k,l])=>`<button data-psize="${k}" aria-pressed="${k===size}">${l}</button>`).join('')}</div>
