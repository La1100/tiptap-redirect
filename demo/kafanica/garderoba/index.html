/* TipTap suite — zajednički stil (rezervacije, admin, grupa). Boje lokala dolaze iz :root varijabli. */
:root{
  color-scheme:dark;
  --bg:#12100e;--card:#211d19;--card2:#2b2621;
  --gold:#d4ae5a;--gold2:#f2c872;--amber:#ff9f2e;--text:#f6f0e5;--muted:#b8ad99;--dim:#8a8070;
  --gold-rgb:212,174,90;--gold2-rgb:242,200,114;--amber-rgb:255,159,46;--bg-rgb:18,16,14;
  --line:rgba(var(--gold-rgb),.22);
  --ok:#8fd19e;--warn:#f4bf52;--bad:#ff8a7a;--blue:#8ab8ff;--ink:#1a1409;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 50% at 50% -10%,rgba(var(--amber-rgb),.12),transparent 60%),repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 64px),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--gold2)}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:10px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(14px,env(safe-area-inset-top)) 0 8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);min-width:0}
.brand svg{width:52px;height:38px;flex:none;color:var(--gold2);filter:drop-shadow(0 0 8px rgba(var(--amber-rgb),.35))}
.brand.wm svg{width:auto;height:30px;max-width:150px}

.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid rgba(255,255,255,.05);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 24px -18px #000}

input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=password],input[type=time],input[type=search],select,textarea{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font-size:16px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}

input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(var(--gold-rgb),.15)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}

.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.xs{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.small{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.st-pending,.st-new{background:rgba(255,159,46,.16);color:#ffc47a}

.st-seated,.st-ack{background:rgba(138,184,255,.16);color:var(--blue)}
.st-declined,.st-cancelled,.st-noshow,.st-skip{background:rgba(255,138,122,.14);color:var(--bad)}
.st-done.grey{background:rgba(255,255,255,.08);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:150;pointer-events:none;transform:translate(-50%,160%);opacity:0;background:var(--card2);color:var(--text);padding:12px 18px;border-radius:14px;border:1px solid var(--line);font-weight:600;font-size:14px;transition:.35s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold2);animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.demo-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--gold2);border-radius:999px;padding:3px 9px}

/* ---------- tlocrt ---------- */
.planbox{position:relative;margin:0 -16px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding:0 16px 6px;scrollbar-width:thin}

.plan .pl-t.busy .pl-top{fill:#2a2522}.plan .pl-t.busy .pl-ring{stroke:#5a3030;stroke-dasharray:6 6}
.plan .pl-t.nores .pl-top{fill:#232120}.plan .pl-t.nores .pl-ring{stroke:#77706a;stroke-dasharray:3 5}.plan .pl-t.nores .pl-label{fill:#9d958b}
.plan .pl-t.busy .pl-label,.plan .pl-t.nofit .pl-label{fill:#7b7268}
.plan .pl-t.busy .pl-chair{opacity:.5}
.plan .pl-t.nofit{opacity:.42}
.plan .pl-t.pending .pl-top{fill:#5a3d16}.plan .pl-t.pending .pl-ring{stroke:var(--amber)}
.plan .pl-t.confirmed .pl-top{fill:#24452d}.plan .pl-t.confirmed .pl-ring{stroke:var(--ok)}
.plan .pl-t.seated .pl-top{fill:#223452}.plan .pl-t.seated .pl-ring{stroke:var(--blue)}
.plan .pl-t.seated .pl-chair{fill:#2b3b57}
.plan .pl-t.alert .pl-alert{opacity:1;animation:alertp 1.1s ease-in-out infinite}
.plan .pl-t.alert .pl-ring{stroke:#ff6a5e;stroke-width:5}
.plan .pl-badge{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes alertp{50%{opacity:.35}}
@keyframes bob{50%{transform:scale(1.15)}}
.plan .pl-t:focus-visible .pl-ring{stroke:#fff;stroke-width:5}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:10px 0 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:2px solid}
.lg-free{border-color:var(--gold2);background:var(--pl-free-top,#4a3a28)}.lg-busy{border-color:#5a3030;background:#2a2522;border-style:dashed!important}.lg-sel{border-color:#fff;background:var(--gold)}.lg-nofit{border-color:#6b5e50;background:#3b3129;opacity:.5}
.lg-pending{border-color:var(--amber);background:#5a3d16}.lg-confirmed{border-color:var(--ok);background:#24452d}.lg-seated{border-color:var(--blue);background:#223452}.lg-alert{border-color:#ff6a5e;background:#ff5a4e}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.armed{outline:2px solid var(--bad)!important;outline-offset:2px}

/* ---- tlocrt: kategorije stolova (Bure Bar: Classic / Silver / VIP), okretanje na mobitelu, zum ---- */
.planbox svg.rot{min-width:0}
.plan.rot .pl-label{font-size:34px;stroke-width:6px}

.plan.rot.zoomed .pl-label{font-size:24px}
.plan.rot .pl-wlabel{font-size:30px;letter-spacing:.24em}
.plan .pl-t.cat-silver.free:not(.sel) .pl-ring{stroke:#dfe6ee}
.plan .pl-t.cat-silver.free:not(.sel) .pl-top{fill:#3b4048}
.plan .pl-t.cat-silver.free:not(.sel) .pl-chair{stroke:rgba(223,230,238,.55)}
.plan .pl-t.cat-silver .pl-halo{fill:rgba(200,215,235,.35)}
.plan .pl-t.cat-vip.free:not(.sel) .pl-ring{stroke:#ffd978;stroke-width:4}

.plan .pl-t.cat-vip.free:not(.sel) .pl-halo{opacity:.85;animation:halo 2.4s ease-in-out infinite}
.plan .pl-t{transition:opacity .35s}
.plan[data-cat=classic] .pl-t:not(.cat-classic),.plan[data-cat=silver] .pl-t:not(.cat-silver),.plan[data-cat=vip] .pl-t:not(.cat-vip){opacity:.16}
.planbox .pz{position:absolute;top:10px;right:26px;z-index:3;display:none;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:800}

/* etaže tlocrta (prizemlje / kat) */
.flbar{display:flex;gap:6px;margin:0 0 8px}
.flbar button{flex:1;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.flbar button[aria-pressed=true]{background:rgba(var(--gold2-rgb),.16);border-color:rgba(var(--gold2-rgb),.55);color:var(--text)}

:root{--bg:#120b0c;--card:#221518;--card2:#2d1c20;--gold:#d9ad5b;--gold2:#f2d08c;--amber:#d8344f;--text:#f8f0ea;--muted:#c2ada4;--dim:#93807a;--ink:#1a0f05;--gold-rgb:217,173,91;--gold2-rgb:242,208,140;--amber-rgb:216,52,79;--bg-rgb:18,11,12;--pl-floor:#1a1012;--pl-grid:#21151a;--pl-edge:#3a2228;--pl-wood:#3a1f17;--pl-wood2:#4a2a1e;--pl-trim:#d9ad5b;--pl-table:#3a2420;--pl-chair:#2a1a1a;--pl-chair-edge:#4e3434;--pl-sofa:#7a1c2a;--pl-sofa2:#b03445;--pl-glow:#ffb070;--pl-label:#e2c48e;--pl-area:rgba(217,173,91,.04);--pl-area-edge:rgba(217,173,91,.4);--pl-stage:#4a1d22;--pl-free-top:#4a2e22;--pl-dance:#d8344f;--pl-dance2:#f2d08c;--pl-dj:#2b1a1d}
.gw{max-width:480px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px 40px}
.gh{display:flex;align-items:center;gap:12px}

.tk{margin-top:18px;border-radius:26px;overflow:hidden;background:linear-gradient(170deg,rgba(var(--gold2-rgb),.2),var(--card) 45%,var(--card2));border:1px solid rgba(var(--gold2-rgb),.45);box-shadow:0 20px 60px rgba(0,0,0,.45);position:relative}
.tk::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%);transform:translateX(-100%);animation:sh 4.5s ease-in-out 1s infinite;pointer-events:none}

.tk .tp2{padding:18px 20px 6px;text-align:center}

.tk .its span{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.07);font-weight:700;font-size:15px}

.tk .cut::before{left:-12px}.tk .cut::after{right:-12px}
.tk .bt{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;padding:16px 18px 18px}
.tk .qr{background:#fff;border-radius:14px;padding:6px}.tk .qr svg{display:block;width:100%;height:auto}

/** Narudžba boca uz rezervaciju: [{id, name, vol, eur, qty}] (cijene iz cjenika; potvrđuje osoblje). */
function cleanPreorder(list) {
  if (!Array.isArray(list)) return [];
  return list.slice(0, 8).map(x => ({ id: str(x.id, 80), name: str(x.name, 80), vol: str(x.vol, 16), eur: num(x.eur, 0, 10000) ?? 0, qty: Math.floor(num(x.qty, 1, 10) ?? 1) }))
    .filter(x => x.name);

const preorderTotal = r => (r.preorder || []).reduce((a, x) => a + x.eur * x.qty, 0);

function guestSnap(g) {

  const bday = (g.occ || []).filter(o => o.t === 'rodjendan').map(o => o.d).sort().pop() || '';

}
const visitBump = r => g => {

  if (!g.first || r.date < g.first) g.first = r.date;
  if (!g.last || r.date > g.last) g.last = r.date;
  g.bottles = g.bottles || {}; for (const x of r.preorder || []) g.bottles[x.name] = (g.bottles[x.name] || 0) + (x.qty || 1);
  g.spend = (g.spend || 0) + preorderTotal(r);
  g.hist = [{ d: r.date, t: r.tableId, p: r.party, b: (r.preorder || []).map(x => x.name).join(', ') }, ...(g.hist || []).filter(h => h.d !== r.date)].slice(0, 8);

/** VIP doček (zona s "show"): gost bira prskalice, najavu DJ-a i rakiju za rundu dobrodošlice. */
function vipOf(cfg, tableId) { const t = (cfg.tables || []).find(x => x.id === tableId); const z = t && (cfg.zones || []).find(x => x.id === t.zone); return z && z.show ? z.show : null; }

  const { list } = await readDay(store, date);

  const date = str(body.date, 10);

  const now = zagrebNow();
  const party = Math.floor(Number(body.party));

  const start = Math.floor(Number(body.start));

  if (!name || name.length < 2) return { error: 'name', status: 400 };

  } else if (!(start >= 0 && start < 2880)) return { error: 'time', status: 400 };
  const preorder = cfg.features?.preorder ? cleanPreorder(body.preorder) : [];
  // kodovi susjednih dana (hostesa traži kod danas, sutra i jučer) — da se kod ne ponovi
  const near = new Set();
  for (const d of [addDays(date, -1), addDays(date, 1)]) for (const x of (await readDay(store, d)).list) if (x.code) near.add(String(x.code));
  const gp = phone ? await guestGet(store, phone) : null;   // poznati gost: kako ga osoblje vidi u trenutku rezervacije

  const res = await mutateDay(store, date, list => {
    let table = null;
    if (body.tableId && body.tableId !== 'any') {
      table = cfg.tables.find(t => t.id === body.tableId);
      if (!table) return { error: 'table', status: 400 };
      if (!admin && table.noRes) return { error: 'nores', status: 409 };   // npr. pušiona — samo bez rezervacije
      if (!admin && !fits(table, party)) return { error: 'fit', status: 409 };
      if (!tableFree(cfg, list, table.id, start)) return { error: 'taken', status: 409 };
    } else {

      if (!table) return { error: 'full', status: 409 };
    }

    const cat = catOf(cfg, table.id), dep = depositOf(cfg, table.id), depPaid = !!(admin && body._deposit === 'paid'), vip = cleanVip(vipOf(cfg, table.id), body.vip);
    const pre = cfg.features?.preorderOnly && !(cfg.features.preorderZones || []).includes(table.zone) ? [] : preorder;   // npr. Bure: boca samo uz VIP stol
    const st0 = admin ? (['pending', 'confirmed', 'seated', 'done', 'noshow'].includes(body.status) ? body.status : 'confirmed') : (cfg.autoConfirm ? 'confirmed' : 'pending');
    const r = {
      id: token(8), code: shortCode(new Set([...near, ...list.map(x => String(x.code || ''))])), key: token(16),
      date, start, end: start + cfg.durationMinutes, party, tableId: table.id,
      name, phone: phone || phoneRaw, email, note: str(body.note, 400), occasion: str(body.occasion, 30),
      preorder: pre, sparkler: !!(pre.length && body.sparkler),
      ...(cat && (cat.minSpend || cat.noShow) ? { cat: cat.id, minSpend: cat.minSpend, noShowFee: cat.noShow } : {}),
      lang: body.lang === 'en' ? 'en' : 'hr',
      status: st0,

      ...(dep ? { deposit: { eur: dep, paid: depPaid, ...(depPaid ? { paidAt: at, by: 'staff' } : {}) } } : {}),

      ...(admin && body._arrive ? { arrive: str(body._arrive, 30) } : {}),

      source: admin ? str(body.source || 'staff', 20) : 'web',

const guestView = r => ({ id: r.id, code: r.code, date: r.date, start: r.start, end: r.end, party: r.party, tableId: r.tableId, name: r.name, status: r.status, note: r.note, occasion: r.occasion, lang: r.lang, preorder: r.preorder || [], sparkler: !!r.sparkler, cat: r.cat || null, minSpend: r.minSpend || 0, noShowFee: r.noShowFee || 0, arrive: !!r.arrive, reminded: !!r.remindedAt, deposit: r.deposit ? { eur: r.deposit.eur, paid: !!r.deposit.paid } : null, back: !!(r.guest && r.guest.visits > 0), vip: r.vip || null });

async function cancelByGuest(store, id, key) {
  const date = await findDate(store, str(id, 40));
  if (!date) return { error: 'notfound', status: 404 };
  const cfg = await getConfig(store);
  return mutateDay(store, date, list => {
    const r = list.find(x => x.id === id);
    if (!r || !safeEqual(r.key, key || '')) return { error: 'notfound', status: 404 };
    if (!['pending', 'confirmed'].includes(r.status)) return { error: 'state', status: 409 };
    if (r.status === 'confirmed' && pastDeadline(cfg, r.date)) return { error: 'late', status: 409 };
    r.status = 'cancelled'; r.updatedAt = isoNow(); r.history.push({ at: r.updatedAt, by: 'guest', to: 'cancelled' });

  }).then(async res => { if (res.ok) await guestBump(store, res.reservation, g => { g.cancels = (g.cancels || 0) + 1; }); return res; });
}

/* ---------- ulaz (hostesa): pretraga i uvođenje gostiju ---------- */
/** Koliko minuta je prošlo od dogovorenog dolaska (negativno = rano). */
function lateBy(r, now = zagrebNow()) {
  const P = d => { const [y, m, dd] = d.split('-').map(Number); return Date.UTC(y, m - 1, dd); };
  return Math.round((P(now.date) - P(r.date)) / 864e5) * 1440 + now.min - r.start;
}
async function findRes(store, id) {
  id = str(id, 40); const date = await findDate(store, id);
  if (!date) return { error: 'notfound', status: 404 };
  const { list } = await readDay(store, date);
  const r = list.find(x => x.id === id);
  return r ? { ok: true, reservation: r } : { error: 'notfound', status: 404 };
}
async function findCode(store, code) {
  const c = str(code, 16).toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length < 4) return { error: 'code', status: 400 };
  const b = bizNow();
  for (const d of [b.date, addDays(b.date, 1), addDays(b.date, -1)]) {
    const { list } = await readDay(store, d);
    const r = list.find(x => String(x.code || '').toUpperCase() === c);
    if (r) return { ok: true, reservation: r };
  }
  return { error: 'notfound', status: 404 };
}
async function checkIn(store, body, by = 'hostesa') {
  const cfg = await getConfig(store);
  const id = str(body.id, 40); const date = await findDate(store, id);
  if (!date) return { error: 'notfound', status: 404 };
  return mutateDay(store, date, list => {
    const r = list.find(x => x.id === id);
    if (!r) return { error: 'notfound', status: 404 };
    if (!['confirmed', 'pending', 'noshow'].includes(r.status)) return { error: 'state', status: 409 };
    if (body.tableId && body.tableId !== r.tableId) {
      if (!cfg.tables.find(t => t.id === body.tableId)) return { error: 'table', status: 400 };
      if (!tableFree(cfg, list, body.tableId, r.start, r.id)) return { error: 'taken', status: 409 };
      r.tableId = str(body.tableId, 12);
      const c = catOf(cfg, r.tableId);
      if (c && (c.minSpend || c.noShow)) Object.assign(r, { cat: c.id, minSpend: c.minSpend, noShowFee: c.noShow }); else { delete r.cat; delete r.minSpend; delete r.noShowFee; }
    }
    if (body.party != null) { const p = Math.floor(Number(body.party)); if (p >= 1 && p <= 60) r.party = p; }
    const before = r.status;
    r.status = 'seated'; r.arrivedAt = isoNow(); r.lateMin = lateBy(r); r.checkedBy = str(by, 20); r.updatedAt = r.arrivedAt;
    r.history.push({ at: r.arrivedAt, by: r.checkedBy, from: before, to: 'seated' });
    const gv = !r.gv, undoNs = gv && !!r.gn; r.gv = 1; if (undoNs) r.gn = 0;
    return { ok: true, reservation: r, gv, undoNs };
  }).then(async res => {
    if (res.ok && res.gv) await guestBump(store, res.reservation, g => { visitBump(res.reservation)(g); if (res.undoNs) g.noShows = Math.max(0, (g.noShows || 0) - 1); });
    return res;
  });
}

  const n = coatNow();

    const used = new Set(list.filter(x => x.status === 'in').map(x => x.no));
    let no = Math.floor(+body.no) || 0;
    if (no) { if (no < 1 || no > COAT_MAX) return { error: 'no', status: 400 }; if (used.has(no)) return { error: 'taken', status: 409 }; }
    else { for (let i = 1; i <= COAT_MAX; i++) if (!used.has(i)) { no = i; break; } if (!no) return { error: 'full', status: 409 }; }
    const it = { id: token(8), k: token(12), no, items, desc: str(body.desc, 80), name: str(body.name, 40), table: str(body.table, 12), ph: !!photo, status: 'in', at: isoNow(), atMin: Number.isFinite(+body._min) ? Math.round(+body._min) : n.min, by: str(by, 20) };

}

/** Koji dan admin otvara: tekuća večer, a ako je lokal danas zatvoren i nema rezervacija — prvi sljedeći radni dan. */
async function defaultDay(store) {
  const cfg = await getConfig(store); const b = bizNow();
  for (let i = 0; i < 8; i++) {
    const d = addDays(b.date, i);
    if (slotsFor(cfg, d).length) return d;
    const { list } = await readDay(store, d);
    if (list.some(r => ACTIVE.has(r.status))) return d;
  }
  return b.date;
}
async function adminDay(store, date) {
  const cfg = await getConfig(store);
  const { list } = await readDay(store, date);
  return { ok: true, date, list: list.sort((a, b) => a.start - b.start), config: cfg, slots: slotsFor(cfg, date), now: zagrebNow(), biz: bizNow() };
}
async function adminUpdate(store, body) {
  const cfg = await getConfig(store);
  const id = str(body.id, 40);
  const date = await findDate(store, id);
  if (!date) return { error: 'notfound', status: 404 };
  const STAT = ['pending', 'confirmed', 'declined', 'cancelled', 'seated', 'done', 'noshow'];
  let moved = null;
  const res = await mutateDay(store, date, list => {
    const r = list.find(x => x.id === id);
    if (!r) return { error: 'notfound', status: 404 };
    const before = r.status;
    if (body.status) { if (!STAT.includes(body.status)) return { error: 'status', status: 400 }; r.status = body.status; }
    if (body.tableId && body.tableId !== r.tableId) {
      if (!cfg.tables.find(t => t.id === body.tableId)) return { error: 'table', status: 400 };
      if (ACTIVE.has(r.status) && !tableFree(cfg, list, body.tableId, r.start, r.id)) return { error: 'taken', status: 409 };
      r.tableId = body.tableId;
      const c = catOf(cfg, r.tableId);
      if (c && (c.minSpend || c.noShow)) Object.assign(r, { cat: c.id, minSpend: c.minSpend, noShowFee: c.noShow }); else { delete r.cat; delete r.minSpend; delete r.noShowFee; }
    }
    if (body.start != null && Number(body.start) !== r.start) {
      const s = Math.floor(Number(body.start)); if (!(s >= 0 && s < 2880)) return { error: 'time', status: 400 };
      if (ACTIVE.has(r.status) && !tableFree(cfg, list, r.tableId, s, r.id)) return { error: 'taken', status: 409 };
      r.start = s; r.end = s + cfg.durationMinutes;
    }
    if (body.party != null) { const p = Math.floor(Number(body.party)); if (p >= 1 && p <= 60) r.party = p; }
    if (body.staffNote != null) r.staffNote = str(body.staffNote, 400);
    if (body.date && body.date !== date) moved = str(body.date, 10);
    r.updatedAt = isoNow();
    r.history.push({ at: r.updatedAt, by: 'staff', from: before, to: r.status });
    let gv = false, gn = false, undoNs = false;
    if (before !== r.status) {
      if ((r.status === 'seated' || r.status === 'done') && !r.gv) { r.gv = 1; gv = true; if (r.gn) { r.gn = 0; undoNs = true; } }
      else if (r.status === 'noshow' && !r.gn && !r.gv) { r.gn = 1; gn = true; }
    }
    return { ok: true, reservation: r, changedStatus: before !== r.status, gv, gn, undoNs };
  });
  if (res.ok && (res.gv || res.gn)) await guestBump(store, res.reservation, g => { if (res.gv) visitBump(res.reservation)(g); if (res.undoNs) g.noShows = Math.max(0, (g.noShows || 0) - 1); if (res.gn) g.noShows = (g.noShows || 0) + 1; });
  if (res.ok && moved && isDate(moved)) {
    const r = res.reservation;
    const add = await mutateDay(store, moved, list => {
      if (ACTIVE.has(r.status) && !tableFree(cfg, list, r.tableId, r.start, r.id)) return { error: 'taken', status: 409 };
      list.push({ ...r, date: moved }); return { ok: true };
    });
    if (add.error) return add;
    await mutateDay(store, date, list => { const i = list.findIndex(x => x.id === r.id); if (i >= 0) list.splice(i, 1); return { ok: true }; });
    await setIndex(store, r.id, moved);
    res.reservation = { ...r, date: moved };
  }
  return res;
}
async function adminSaveConfig(store, cfgIn) {
  const cur = await getConfig(store);

  const keys = ['venue', 'phone', 'plan', 'zones', 'tables', 'hours', 'slotMinutes', 'durationMinutes', 'leadMinutes', 'daysAhead', 'maxParty', 'holdMinutes', 'closedDates', 'autoConfirm', 'rules', 'features', 'policy'];

const LIVE_KINDS = ['call', 'bill', 'order', 'song'];
const liveKey = d => `live/${d}`;
const OPEN = new Set(['new', 'ack']);
async function liveCreate(store, body) {
  const cfg = await getConfig(store);
  const kind = str(body.kind, 10);
  if (!LIVE_KINDS.includes(kind)) return { error: 'kind', status: 400 };
  if (kind === 'song' && !cfg.features?.songs) return { error: 'kind', status: 400 };
  if (kind === 'order' && cfg.features?.orders === false) return { error: 'kind', status: 400 };
  if (kind === 'bill' && cfg.features?.bill === false) return { error: 'kind', status: 400 };
  if (!cfg.features?.tableMode) return { error: 'off', status: 403 };
  const table = str(body.table, 8).replace(/[^\w-]/g, '');
  if (!table && kind !== 'song') return { error: 'table', status: 400 };
  const b = bizNow();
  const item = { id: token(6), k: token(10), kind, table, status: 'new', createdAt: isoNow(), lang: body.lang === 'en' ? 'en' : 'hr' };
  if (kind === 'bill') item.pay = ['card', 'cash'].includes(body.pay) ? body.pay : '';
  if (kind === 'order') {
    const items = Array.isArray(body.items) ? body.items.slice(0, 25).map(x => ({ id: str(x.id, 80), n: str(x.n, 80), v: str(x.v, 24), q: Math.floor(num(x.q, 1, 20) ?? 1), e: num(x.e, 0, 10000) ?? 0 })).filter(x => x.n) : [];
    if (!items.length) return { error: 'items', status: 400 };
    item.items = items; item.total = Math.round(items.reduce((a, x) => a + x.q * x.e, 0) * 100) / 100;
  }
  if (kind === 'song') {
    item.song = { title: str(body.title, 80), artist: str(body.artist, 60), ded: str(body.ded, 120) };
    if (item.song.title.length < 2) return { error: 'title', status: 400 };
  }
  item.note = str(body.note, 200);
  return mutate(store, liveKey(b.date), [], list => {
    const open = list.filter(x => OPEN.has(x.status) && x.table === table);
    if ((kind === 'call' || kind === 'bill') && table) {
      const dup = open.find(x => x.kind === kind && Date.now() - Date.parse(x.createdAt) < 20 * 60e3);
      if (dup) {
        // isti stol već čeka konobara: novi razlog (npr. "Kombo: Silver Goose") dopiše se postojećem pozivu
        if (item.note && !(dup.note || '').includes(item.note)) { dup.note = str((dup.note ? dup.note + ' · ' : '') + item.note, 200); dup.updatedAt = isoNow(); return { ok: true, dup: true, id: dup.id, k: dup.k, item: dup }; }
        return { ok: true, noop: true, dup: true, id: dup.id, k: dup.k, item: dup };
      }
    }
    if (open.length >= 12) return { error: 'limit', status: 429 };
    if (kind === 'song' && list.filter(x => x.kind === 'song' && x.status === 'new' && x.table === table).length >= 3) return { error: 'limit', status: 429 };
    list.push(item);
    if (list.length > 600) list.splice(0, list.length - 600);
    return { ok: true, id: item.id, k: item.k, item };
  });
}

   STATISTIKA (otvaranja menija, pregledi pića, klikovi na recenziju…)
   Podijeljeno u 8 komada da se istovremeni upisi ne sudaraju.
   ===================================================================== */
const SHARDS = 8;
const stKey = (d, s) => `st/${d}/${s}`;
const EMPTY_ST = { open: 0, review: 0, book: 0, table: 0, view: {}, names: {} };
async function statsHit(store, body) {
  const ev = Array.isArray(body.ev) ? body.ev.slice(0, 40) : [];
  if (!ev.length) return { ok: true };
  const date = isDate(body.date) && body.date >= addDays(zagrebNow().date, -30) ? body.date : bizNow().date;
  const s = Math.floor(Math.random() * SHARDS);
  return mutate(store, stKey(date, s), EMPTY_ST, doc => {
    for (const e of ev) {
      const t = str(e.t, 10), n = Math.max(1, Math.min(500, Math.floor(+e.n || 1)));
      if (t === 'view') { const id = str(e.id, 80); if (!id) continue; doc.view[id] = (doc.view[id] || 0) + n; if (e.name) doc.names[id] = str(e.name, 80); }
      else if (['open', 'review', 'book', 'table'].includes(t)) doc[t] = (doc[t] || 0) + n;
    }
    return { ok: true };
  });
}
async function statsDay(store, date) {
  const out = structuredClone(EMPTY_ST);
  for (let s = 0; s < SHARDS; s++) {
    const r = await store.getJSON(stKey(date, s)); if (!r?.data) continue; const d = r.data;
    for (const k of ['open', 'review', 'book', 'table']) out[k] += d[k] || 0;
    for (const [id, n] of Object.entries(d.view || {})) out.view[id] = (out.view[id] || 0) + n;
    Object.assign(out.names, d.names || {});
  }
  return out;
}
async function adminStats(store, days = 14) {
  const b = bizNow(); const series = []; const tot = structuredClone(EMPTY_ST);
  for (let i = days - 1; i >= 0; i--) {
    const d = addDays(b.date, -i); const s = await statsDay(store, d);
    series.push({ date: d, open: s.open, review: s.review, book: s.book, table: s.table });
    for (const k of ['open', 'review', 'book', 'table']) tot[k] += s[k];
    for (const [id, n] of Object.entries(s.view)) tot.view[id] = (tot.view[id] || 0) + n;
    Object.assign(tot.names, s.names);
  }
  const top = Object.entries(tot.view).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([id, n]) => ({ id, n, name: tot.names[id] || id }));
  return { ok: true, days: series, total: { open: tot.open, review: tot.review, book: tot.book, table: tot.table }, top };
}

    if (((cfg.features || {}).hostess || []).includes('coat')) {
      /* opis uvijek odgovara prvoj stvari (jakna ↔ "crna kožna jakna", torba ↔ "crvena torbica"…) */
      const DESC = {
        jakna: ['crna kožna jakna', 'bež kaput', 'traper jakna', 'crni puhovac', 'zelena parka', 'siva jakna s krznom', 'tamnoplavi kaput', 'bijela jakna', 'smeđa kožna jakna', 'crni kaput', 'bordo kaput', '', '', ''],
        torba: ['crvena torbica', 'crna torba s lancem', 'bež torba', ''],
        ruksak: ['crni ruksak', 'sivi ruksak', '']
      };
      const ADD = { torba: 'torba', kapa: 'šal', kisobran: 'kišobran' };
      const NAMES = ['Ana', 'Luka', 'Ivana', 'Marko', 'Petra', 'Dora', '', '', '', '', '', ''];
      const from = demoMin - (v === 'qclub' ? 65 : 100), N = v === 'qclub' ? 46 : 28, list = [];
      const ats = Array.from({ length: N }, (_, i) => Math.round(from + (demoMin - 8 - from) * (i / N) + R() * 3)).sort((a, b) => a - b);   // brojevi idu redom kako su gosti dolazili
      for (let i = 0; i < N; i++) {
        const r = R(); const items = [{ t: r < .8 ? 'jakna' : r < .9 ? 'torba' : 'ruksak', n: R() < .18 ? 2 : 1 }];
        if (R() < .25) { const t2 = pick(R, ['torba', 'kapa', 'kisobran']); if (t2 !== items[0].t) items.push({ t: t2, n: 1 }); }
        let desc = items[0].n === 1 ? pick(R, DESC[items[0].t] || ['']) : '';
        if (desc && items[1] && R() < .6) desc += ' + ' + ADD[items[1].t];
        const at = ats[i], out = i < 7 && R() < .7;
        list.push(Object.assign({ id: C.token(8), k: C.token(12), no: i + 1, items, desc, name: pick(R, NAMES), table: '', ph: false, status: out ? 'out' : 'in', at: iso(0), atMin: at, by: 'hostesa' }, out ? { outMin: Math.min(demoMin - 3, at + 35 + Math.round(R() * 25)) } : {}));
      }
      await S.setJSON(`coat/${demoDate}`, list, null);
    }

    /* --- anonimne poruke --- */
    const fbByMonth = {};
    for (const [topic, msg, daysAgo, read] of (FB[v] || [])) {
      const at = new Date(Date.now() - daysAgo * 864e5 - R() * 5 * 3600e3); const ym = at.toISOString().slice(0, 7);
      (fbByMonth[ym] = fbByMonth[ym] || []).push({ id: C.token(6), topic, msg, when: '', contact: '', table: R() < .5 ? pick(R, pool) : '', lang: 'hr', createdAt: at.toISOString(), read, done: read && R() < .6 });
    }
    for (const [ym, list] of Object.entries(fbByMonth)) await S.setJSON(`fb/${ym}`, list, null);

    /* --- statistika: 15 dana unazad (od stvarnog i od demo datuma) --- */
    const base = { qclub: [10, 10, 10, 10, 210, 300, 330], kafanica: [8, 6, 6, 8, 20, 190, 230], bure: [10, 60, 60, 70, 95, 160, 170], brooklyn: [120, 95, 100, 98, 105, 140, 160] }[v] || [50, 50, 50, 50, 50, 80, 80];
    const sd = new Set(); for (let i = 0; i <= 15; i++) { sd.add(TT.addDays(real.date, -i)); sd.add(TT.addDays(demoDate, -i)); }
    for (const date of sd) {
      const w = TT.wd(date); let open = Math.round(base[w] * (.75 + R() * .5));
      if (date === demoDate) open = Math.round(open * .6);
      const view = {}, names = {};
      top.forEach((x, i) => { const n = Math.round(open * (1.1 / (i + 1.6)) * (.7 + R() * .6)); if (n > 0) { view[x.id] = n; names[x.id] = x.name; } });
      await S.setJSON(`st/${date}/0`, { open, review: Math.round(open * (.03 + R() * .03)), book: cfg.features && cfg.features.reservations === false ? 0 : Math.round(open * (.02 + R() * .04)), table: Math.round(open * (.15 + R() * .1)), view, names }, null);
    }
  }

  /** Lokalni podaci "gosta" na ovom uređaju (moja lista, upamćeno ime…) — brišu se uz demo podatke. */
  TT.clearGuestLocal = (pins) => {
    try {
      const ks = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && (k.startsWith('ttd1:') || k.startsWith('tt_my') || (pins && k.startsWith('tt_pin_')) || k === 'tt_guest' || k === 'tt_coat' || /^(qclub|kafanica|brooklyn|bure)_favs$/.test(k))) ks.push(k); }
      ks.forEach(k => localStorage.removeItem(k));
    } catch (e) { }
  };
  TT.seed = async function (store, C, force) {
    let meta = null; try { meta = JSON.parse(localStorage.getItem('ttd1:seed') || 'null'); } catch (e) { }
    let last = 0; try { last = +localStorage.getItem('ttd1:last') || 0; } catch (e) { }
    const stale = meta && Date.now() - Math.max(meta.at, last) > 2 * 3600e3;
    if (meta && meta.v === VERSION && !force && !stale) return;
    TT.clearGuestLocal();
    const items = window.TT_DEMO_ITEMS || {};
    const keep = TT.clock; // sjeme koristi stvarni sat
    C.setClock(null);
    try {
      let s = 7, vi = 0;
      for (const v of C.VENUE_IDS) await seedVenue(store, C, v, rng(s += 101), items[v], vi++);
    } finally { if (keep) C.setClock(() => TT.now()); }
    try { localStorage.setItem('ttd1:seed', JSON.stringify({ v: VERSION, at: Date.now() })); } catch (e) { }
  };
  // bilježi zadnju izmjenu (za automatsko osvježavanje demo podataka nakon pauze)
  TT.onChange(m => { if (m.self) try { localStorage.setItem('ttd1:last', String(Date.now())); } catch (e) { } });
})();
/* Minimal QR encoder (byte mode, ECC M, versions 1–15). Returns boolean matrix [y][x]. */
function qrMatrix(text){
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24];
  const BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10];
  const bytes=Array.from(new TextEncoder().encode(text));
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;};
  const dataCw=v=>Math.floor(raw(v)/8)-ECC[v]*BLK[v];
  let ver=1;
  for(;ver<=15;ver++){const cc=ver<10?8:16;if(4+cc+bytes.length*8<=dataCw(ver)*8)break;}
  if(ver>15)throw new Error('URL too long');
  const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1);};
  put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
  const cap=dataCw(ver)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
  for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b);}
  // GF(256) Reed–Solomon
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z&255;};
  const divisor=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1];}root=mul(root,2);}return r;};
  const rem=(dat,div)=>{const r=div.map(()=>0);for(const b of dat){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f));}return r;};
  const nb=BLK[ver],ec=ECC[ver],rawCw=Math.floor(raw(ver)/8),nShort=nb-rawCw%nb,shortLen=Math.floor(rawCw/nb);
  const div=divisor(ec),blocks=[];
  for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-ec+(i<nShort?0:1));k+=dat.length;const e=rem(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(e));}
  const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-ec||j>=nShort)cw.push(b[i]);});
  // Matrix
  const size=ver*4+17,M=[],F=[];for(let y=0;y<size;y++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false));}
  const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
  for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
  const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),x=cx+dx,y=cy+dy;if(x>=0&&x<size&&y>=0&&y<size)set(x,y,d!==2&&d!==4);}};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  if(ver>1){const n=Math.floor(ver/7)+2,step=Math.ceil((ver*4+4)/(n*2-2))*2,pos=[6];for(let p=size-7;pos.length<n;p-=step)pos.splice(1,0,p);
    pos.forEach((a,i)=>pos.forEach((b,j)=>{if((i===0&&j===0)||(i===0&&j===n-1)||(i===n-1&&j===0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}));}
  const drawFormat=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412,g=i=>((b>>>i)&1)===1;
    for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
    for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true);};
  drawFormat(0);
  if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(ver<<12)|r;for(let i=0;i<18;i++){const d=((b>>>i)&1)===1,a=size-11+i%3,c=Math.floor(i/3);set(a,c,d);set(c,a,d);}}
  let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-v:v;if(!F[y][x]&&i<cw.length*8){M[y][x]=((cw[i>>>3]>>>(7-(i&7)))&1)===1;i++;}}}
  const MF=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
  const applyMask=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&MF[m](x,y))M[y][x]=!M[y][x];};
  const penalty=()=>{let p=0,dark=0;const line=get=>{let run=1;for(let k=1;k<size;k++){if(get(k)===get(k-1)){run++;if(run===5)p+=3;else if(run>5)p++;}else run=1;}
      const s=Array.from({length:size},(_,k)=>get(k)?1:0).join('');let idx=-1;while((idx=s.indexOf('1011101',idx+1))!==-1){const a=s.slice(Math.max(0,idx-4),idx),b=s.slice(idx+7,idx+11);if((idx<4||a==='0000')||(idx+11>size||b==='0000'))p+=40;}};
    for(let y=0;y<size;y++)line(x=>M[y][x]);for(let x=0;x<size;x++)line(y=>M[y][x]);
    for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3;}
    M.forEach(r=>r.forEach(c=>{if(c)dark++;}));const t=size*size;p+=Math.max(0,Math.ceil(Math.abs(dark*20-t*10)/t)-1)*10;return p;};
  let best=0,bestP=Infinity;for(let m=0;m<8;m++){applyMask(m);drawFormat(m);const p=penalty();if(p<bestP){bestP=p;best=m;}applyMask(m);}
  applyMask(best);drawFormat(best);
  return M;
}
if(typeof module!=='undefined')module.exports=qrMatrix;

<script>
(function(){'use strict';
const $=(s,r=document)=>r.querySelector(s),esc=TT.esc,fmt=TT.fmt,V=TT_CFG;
const q=new URLSearchParams(location.search),G=q.get('g'),K=q.get('k');
let lang=(()=>{try{return localStorage.getItem('tt_lang')||((navigator.language||'hr').toLowerCase().startsWith('hr')?'hr':'en')}catch(e){return 'hr'}})();
const T={hr:{sub:'Garderoba',num:'Vaš broj na garderobi',show:'Kad odlazite, pokažite ovaj ekran na garderobi.',show2:'Hostesa skenira kod ili upiše broj — i odmah vidi što ste ostavili.',since:t=>`Na garderobi od ${t}`,out:t=>`Stvari su preuzete u ${t}. Hvala i vidimo se opet!`,outT:'Preuzeto',saved:'Broj je spremljen na ovom mobitelu — ne treba vam papirić.',mine:'Vaši brojevi večeras',none:'Ovdje se pojavljuje vaš broj s garderobe.',none2:'Kad predate jaknu, skenirajte QR kod na mobitelu hostese.',nf:'Broj nije pronađen. Provjerite s hostesom na garderobi.',tap:'Dodirnite kod za veći prikaz',big:'Pokažite hostesi na garderobi'},
         en:{sub:'Cloakroom',num:'Your cloakroom number',show:'When you leave, show this screen at the cloakroom.',show2:'The host scans the code or types the number — and sees exactly what you left.',since:t=>`In the cloakroom since ${t}`,out:t=>`Collected at ${t}. Thank you and see you again!`,outT:'Collected',saved:'Your number is saved on this phone — no paper ticket needed.',mine:'Your numbers tonight',none:'Your cloakroom number appears here.',none2:'When you hand in your coat, scan the QR code on the host’s phone.',nf:'Number not found. Please check with the cloakroom host.',tap:'Tap the code to enlarge',big:'Show this to the cloakroom host'}};
const t=k=>(T[lang]||T.hr)[k];
const KN={jakna:['Jakna / kaput','Jacket / coat','🧥'],kaput:['Kaput','Coat','🧥'],torba:['Torba','Bag','👜'],ruksak:['Ruksak','Backpack','🎒'],vrecica:['Vrećica','Shopping bag','🛍️'],kisobran:['Kišobran','Umbrella','☂️'],kapa:['Kapa / šal','Hat / scarf','🧣'],kaciga:['Kaciga','Helmet','⛑️'],ostalo:['Ostalo','Other','📦']};
const kn=k=>KN[k]||KN.ostalo;

const mine=()=>{try{return JSON.parse(localStorage.getItem('tt_coat')||'[]')}catch(e){return []}};
function remember(x){try{const L=mine().filter(m=>!(m.id===x.id));L.push({v:V.venue,id:x.id,k:K,no:x.no,at:Date.now(),st:x.status});localStorage.setItem('tt_coat',JSON.stringify(L.filter(m=>Date.now()-m.at<36*3600e3).slice(-12)))}catch(e){}}
let cur=null;

    <div class="its">${(x.items||[]).map(y=>`<span>${kn(y.t)[2]} ${x.items.length>1||y.n>1?y.n+'× ':''}${esc(kn(y.t)[lang==='en'?1:0])}</span>`).join('')}</div>
    ${x.desc?`<p class="ds">${esc(x.desc)}</p>`:''}

    <div class="st${out?' out':''}"><i></i><span>${out?t('out')(fmt(x.outMin||0)):t('since')(fmt(x.atMin||0))}</span></div>
    ${out?'':`<p class="small" style="text-align:center;margin:12px 0 0">${t('saved')}</p>`}`+list;

load();
})();
