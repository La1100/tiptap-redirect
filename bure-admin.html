<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rezervacije · Bure Bar admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12100e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d4ae5a'/%3E%3Cpath d='M15 10c-6 0-5 6-5 11s-1 9-5 11c4 2 5 6 5 11s-1 11 5 11M49 10c6 0 5 6 5 11s1 9 5 11c-4 2-5 6-5 11s1 11-5 11' fill='none' stroke='%2312100e' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="stylesheet" href="/bure-fonts.css">
<link rel="stylesheet" href="/bure-base.css">
<style>
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.hdr{position:sticky;top:0;z-index:30;background:rgba(18,16,14,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(212,174,90,.12)}
.hdr .wrap{padding-top:max(8px,env(safe-area-inset-top));padding-bottom:8px}
.dnav{display:flex;align-items:center;gap:8px}
.dnav .arrow{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);font-size:22px;color:var(--gold2);flex:none}
.dnav .dl{flex:1;text-align:center;min-width:0}
.dnav .dl b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05}
.dnav .dl small{color:var(--muted);font-size:13px}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:52px;height:58px;border-radius:12px;background:var(--card);border:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--muted);position:relative;line-height:1.2}
.strip button b{font-size:16px;color:var(--text)}
.strip button[aria-pressed=true]{background:var(--gold);color:#3a2a10}.strip button[aria-pressed=true] b{color:#1a1409}
.strip .bdg{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:999px;background:var(--amber);color:#1a1004;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 10px rgba(255,159,46,.6)}
.strip .cnt{font-size:10px;color:inherit;opacity:.8}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(18,16,14,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(10px)}
.tabs button{flex:1;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--dim)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-pressed=true]{color:var(--gold2)}
.tabs .plus{color:#1a1409}.tabs .plus span.o{width:52px;height:52px;border-radius:18px;background:linear-gradient(180deg,var(--gold2),var(--gold));display:grid;place-items:center;font-size:30px;font-weight:700;margin-top:-18px;box-shadow:0 8px 20px -6px rgba(242,200,114,.6)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:18px 4px 8px;display:flex;justify-content:space-between}
.res{background:linear-gradient(180deg,var(--card2),var(--card));border-radius:18px;padding:14px;margin:0 0 10px;border:1px solid rgba(255,255,255,.05);border-left:4px solid transparent}
.res.pending{border-left-color:var(--amber);box-shadow:0 0 0 1px rgba(255,159,46,.25)}
.res.confirmed{border-left-color:var(--ok)}.res.seated{border-left-color:var(--blue)}
.res.dimmed{opacity:.55}
.res .h{display:flex;align-items:flex-start;gap:12px}
.res .tm{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;min-width:66px}
.res .who{flex:1;min-width:0}
.res .who b{font-size:17px;display:block;line-height:1.25;word-break:break-word}
.res .meta{font-size:14px;color:var(--muted)}
.res .meta .tb{color:var(--gold2);font-weight:800}
.res .note{margin-top:8px;font-size:14px;background:rgba(0,0,0,.25);border-radius:10px;padding:8px 10px}
.res .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.res .acts .btn{flex:1;min-width:110px}
.res .contact{display:flex;flex-direction:column;gap:6px}
.res .contact a{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06);text-decoration:none;font-size:20px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;font-family:var(--f-display);font-size:24px;color:var(--text);letter-spacing:.05em;text-transform:uppercase}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:92vh;max-height:92dvh;overflow-y:auto;background:linear-gradient(180deg,#1e1a16,#141210);border-radius:24px 24px 0 0;border-top:1px solid var(--line);box-shadow:0 -20px 60px rgba(0,0,0,.6);transform:translateY(105%);transition:transform .38s var(--ease);padding:8px 16px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(5,4,3,.6);opacity:0;visibility:hidden;transition:.3s}.scrim.on{opacity:1;visibility:visible}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.sheet .sh h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.05em;text-transform:uppercase}
.sheet .x{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.06);font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login{max-width:380px;margin:12vh auto 0;text-align:center;padding:0 16px}
.login input{text-align:center;font-size:28px;letter-spacing:.4em;height:64px}
.timebar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px 0 12px}
.timebar::-webkit-scrollbar{display:none}
.hrow{display:grid;grid-template-columns:64px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.hrow b{font-size:14px}
.hrow input{min-height:44px;padding:8px}
.tog{width:44px;height:26px;appearance:none;border-radius:999px;background:#3a332c;position:relative;cursor:pointer;transition:.2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#bbb;transition:.2s}
.tog:checked{background:var(--gold)}.tog:checked::after{left:21px;background:#1a1409}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid rgba(255,255,255,.06)}
.setrow:first-child{border-top:0}
.setrow input[type=number]{width:96px;min-height:44px;text-align:center}
.edpanel{margin-top:12px;padding:14px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.envs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:bl 2s infinite}
@keyframes bl{50%{opacity:.3}}
.hist{font-size:12px;color:var(--dim);margin-top:8px}
</style>
<style>
.demobar{position:relative;z-index:80;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:#0b0907;border-bottom:1px solid rgba(242,200,114,.22);font:800 10.5px/1 Manrope,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8a8070}
.demobar nav{display:flex;gap:2px;background:rgba(255,255,255,.04);border:1px solid rgba(242,200,114,.2);border-radius:999px;padding:3px;min-width:0;overflow-x:auto;scrollbar-width:none}
.demobar nav::-webkit-scrollbar{display:none}
.demobar a{flex:none;font:700 12px/1 Manrope,system-ui,sans-serif;letter-spacing:.01em;text-transform:none;color:#b8ad99;padding:7px 10px;border-radius:999px;text-decoration:none;white-space:nowrap}
.demobar a.on{background:#d4ae5a;color:#1a1409}
a[download]{display:none!important}#qrview .btns button{display:none}
</style>
</head>
<body>
<div class="demobar"><span>Demo</span><nav><a href="/bure-meni" class="">Cjenik</a><a href="/bure-rezervacije" class="">Rezervacija</a><a href="/bure-admin" class="on">Osoblje · PIN 1234</a></nav></div>
<div id="login" class="login" hidden>
  <svg viewBox="0 0 220 160" style="width:120px;color:#e2bb66;margin:0 auto 10px;display:block" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M44 8 C26 8 30 26 30 42 C30 60 26 74 14 78 C26 82 30 96 30 114 C30 130 26 148 44 148"/><path d="M176 8 C194 8 190 26 190 42 C190 60 194 74 206 78 C194 82 190 96 190 114 C190 130 194 148 176 148"/><path d="M69 16 V60 M69 16 H89 A10 10 0 0 1 89 36 H69 M69 36 H91 A12 12 0 0 1 91 60 H69"/><path d="M117 16 V45 A17 17 0 0 0 151 45 V16"/><path d="M69 112 V68 H89 A11 11 0 0 1 89 90 H69 M85 90 L103 112"/><path d="M117 68 H151 V112 H117 M125 90 H151"/></g></svg>
  <h1 class="title" style="font-size:32px">Rezervacije</h1>
  <p class="small">Upiši PIN osoblja · <b style="color:#f2c872">demo PIN: 1234</b></p>
  <form id="loginForm"><input type="password" id="pin" inputmode="numeric" autocomplete="current-password" maxlength="20" aria-label="PIN"><div class="err" id="loginErr"></div><button class="btn gold block" style="margin-top:10px">Prijava</button></form>
</div>

<div id="app" hidden>
  <div class="hdr"><div class="wrap">
    <div class="dnav"><button class="arrow" id="prev" aria-label="Prethodni dan">‹</button><button class="dl" id="todayBtn"><b id="dlabel">—</b><small id="dsub"></small></button><button class="arrow" id="next" aria-label="Sljedeći dan">›</button></div>
    <div class="strip" id="strip"></div>
  </div></div>
  <div class="wrap">
    <section id="tab-list">
      <div class="stats" id="stats"></div>
      <input type="text" id="search" placeholder="🔍 Traži ime, broj ili kod…" autocomplete="off">
      <div id="list"></div>
    </section>
    <section id="tab-plan" hidden>
      <div class="sec" style="margin-top:14px"><span>Stanje stolova u</span><span class="live"><i></i> uživo</span></div>
      <div class="timebar" id="timebar"></div>
      <div class="planbox"><svg id="plan"></svg></div>
      <div class="legend"><span><i class="lg-free"></i>Slobodno</span><span><i class="lg-pending"></i>Čeka potvrdu</span><span><i class="lg-confirmed"></i>Potvrđeno</span><span><i class="lg-seated"></i>Sjede</span></div>
    </section>
    <section id="tab-set" hidden></section>
  </div>
  <nav class="tabs">
    <button data-tab="list" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Večer</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><circle cx="15" cy="15" r="2"/><path d="M15 7h2M7 15h2"/></svg>Tlocrt</button>
    <button class="plus" id="newBtn" aria-label="Nova rezervacija"><span class="o">+</span></button>
    <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Postavke</button>
    <button id="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Odjava</button>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/bure-demo-api.js"></script>
<script src="/bure-plan.js"></script>
<script>
(function(){'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buzz=p=>{try{const u=navigator.userActivation;if(navigator.vibrate&&(!u||u.hasBeenActive))navigator.vibrate(p)}catch(e){}};
const arm=(btn,label)=>{if(btn.dataset.armed)return true;btn.dataset.armed=1;const o=btn.innerHTML;btn.innerHTML=label;btn.classList.add('armed');setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.innerHTML=o;btn.classList.remove('armed')}},3500);return false};
const fmt=m=>{const x=((m%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};
const toMin=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
const addDays=(d,n)=>{const t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const wd=d=>new Date(d+'T12:00:00Z').getUTCDay();
const DN=['Nedjelja','Ponedjeljak','Utorak','Srijeda','Četvrtak','Petak','Subota'],DS=['Ned','Pon','Uto','Sri','Čet','Pet','Sub'];
const ST={pending:'Čeka potvrdu',confirmed:'Potvrđeno',seated:'Sjede',done:'Završeno',declined:'Odbijeno',cancelled:'Otkazano',noshow:'Nisu došli'};
const OCC={rodjendan:'🎂 Rođendan',proslava:'🥂 Proslava',momacka:'🎉 Momačka/djevojačka',posao:'💼 Poslovno',utakmica:'⚽ Utakmica'};
const ACTIVE=['pending','confirmed','seated'];
const zagrebToday=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Zagreb',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return {date:`${p.year}-${p.month}-${p.day}`,min:+p.hour*60+ +p.minute}};

let PIN=null;try{PIN=localStorage.getItem('bure_admin_pin')}catch(e){}
const S={date:null,list:[],cfg:null,slots:[],tab:'list',planTime:null,upcoming:[],pendingSeen:null,q:''};

async function api(path,body){
  const r=await fetch('/api/admin'+path,{method:body?'POST':'GET',cache:'no-store',headers:{'x-admin-pin':PIN||'',...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({error:'server'}));
  if(r.status===401){logout(true);throw j}
  if(!r.ok)throw j;return j;
}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2400)}
const ERR={taken:'Stol je zauzet u to vrijeme.',table:'Nepostojeći stol.',time:'Neispravno vrijeme.',name:'Upiši ime.',party:'Neispravan broj osoba.',full:'Nema slobodnog stola za to — odaberi stol ručno.',notfound:'Rezervacija nije pronađena.',server:'Greška na serveru.',busy:'Server zauzet, pokušaj ponovno.',tableid:'Oznake stolova moraju biti jedinstvene.',tables:'Mora postojati barem jedan stol.'};
const errMsg=e=>ERR[e&&e.error]||('Greška: '+(e&&e.error||'mreža'));

/* ---------- login ---------- */
function logout(bad){PIN=null;try{localStorage.removeItem('bure_admin_pin')}catch(e){};$('#app').hidden=true;$('#login').hidden=false;if(bad)$('#loginErr').textContent='Pogrešan PIN.';setTimeout(()=>$('#pin').focus(),50)}
$('#loginForm').onsubmit=async e=>{e.preventDefault();PIN=$('#pin').value.trim();$('#loginErr').textContent='';
  try{await api('/login');try{localStorage.setItem('bure_admin_pin',PIN)}catch(e){};start()}catch(err){if(err.error==='nopin')$('#loginErr').textContent='ADMIN_PIN nije postavljen na serveru.';else if(err.error!=='auth')$('#loginErr').textContent='Nema veze sa serverom.'}};
$('#logout').onclick=()=>{const b=$('#logout');if(arm(b,'<span style="font-size:12px">Tapni<br>ponovno</span>'))logout()};

/* ---------- data ---------- */
async function loadDay(silent){
  try{const d=await api('/day?date='+S.date);S.list=d.list;S.cfg=d.config;S.slots=d.slots;
    if(!silent||S.tab!=='set')render();}
  catch(e){if(!silent)toast(errMsg(e))}
}
async function loadUpcoming(){try{const u=await api('/upcoming');S.upcoming=u.days;renderStrip();
  const p=u.days.reduce((a,d)=>a+d.pending,0);document.title=(p?`(${p}) `:'')+'Rezervacije · Bure Bar';
  if(S.pendingSeen!=null&&p>S.pendingSeen){buzz([200,100,200]);toast('🔔 Nova rezervacija čeka potvrdu');}
  S.pendingSeen=p;}catch(e){}}
function setDate(d){S.date=d;location.hash=d;S.planTime=null;renderHeader();renderStrip();loadDay()}

/* ---------- render ---------- */
function renderHeader(){const [y,m,dd]=S.date.split('-');const td=zagrebToday().date;
  $('#dlabel').textContent=`${DN[wd(S.date)]} ${+dd}.${+m}.`;
  $('#dsub').textContent=S.date===td?'Danas':S.date===addDays(td,1)?'Sutra':(S.date<td?'Prošlo':'Za '+Math.round((Date.parse(S.date)-Date.parse(td))/864e5)+' dana');}
function renderStrip(){const td=zagrebToday().date;const map=Object.fromEntries(S.upcoming.map(x=>[x.date,x]));let h='';
  for(let i=0;i<14;i++){const d=addDays(td,i),u=map[d]||{};h+=`<button data-date="${d}" aria-pressed="${d===S.date}">${DS[wd(d)]}<b>${+d.slice(8)}</b><span class="cnt">${u.total?u.guests+' os':''}</span>${u.pending?`<span class="bdg">${u.pending}</span>`:''}</button>`}
  $('#strip').innerHTML=h;}
function tableLabel(id){const t=S.cfg&&S.cfg.tables.find(x=>x.id===id);return t?id:id+'?'}
function resCard(r){
  const wa=r.phone?`https://wa.me/${r.phone.replace(/\D/g,'')}`:'';
  let acts='';
  if(r.status==='pending')acts=`<button class="btn ok" data-act="confirmed" data-id="${r.id}">✓ Potvrdi</button><button class="btn bad" data-act="declined" data-id="${r.id}">✕ Odbij</button>`;
  else if(r.status==='confirmed')acts=`<button class="btn" data-act="seated" data-id="${r.id}">🪑 Stigli</button><button class="btn" data-act="noshow" data-id="${r.id}">Nisu došli</button>`;
  else if(r.status==='seated')acts=`<button class="btn" data-act="done" data-id="${r.id}">✓ Otišli</button>`;
  return `<article class="res ${r.status} ${ACTIVE.includes(r.status)?'':'dimmed'}">
   <div class="h"><div class="tm">${fmt(r.start)}</div><div class="who"><b>${esc(r.name)}</b><div class="meta">${r.party} os. · stol <span class="tb">${esc(tableLabel(r.tableId))}</span></div><span class="pill st-${r.status}" style="height:22px;margin:4px 0 2px">${ST[r.status]}</span>
   <div class="meta">${[r.phone,r.code&&'#'+r.code,r.source&&r.source!=='web'&&r.source].filter(Boolean).map(esc).join(' · ')}</div></div>
   <div class="contact">${r.phone?`<a href="tel:${esc(r.phone)}" aria-label="Nazovi">📞</a>`:''}${wa?`<a href="${wa}" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>`:''}</div></div>
   ${r.occasion||r.note||r.staffNote?`<div class="note">${r.occasion?(OCC[r.occasion]||esc(r.occasion))+' ':''}${esc(r.note||'')}${r.staffNote?`<div class="small">🔒 ${esc(r.staffNote)}</div>`:''}</div>`:''}
   <div class="acts">${acts}<button class="btn sm" data-edit="${r.id}" style="flex:0 0 auto;min-width:0">⋯ Uredi</button></div></article>`;}
function renderList(){
  const q=S.q.toLowerCase();const L=S.list.filter(r=>!q||[r.name,r.phone,r.code].some(x=>String(x||'').toLowerCase().includes(q)));
  const act=S.list.filter(r=>ACTIVE.includes(r.status));
  $('#stats').innerHTML=`<div class="stat"><b>${act.length}</b><span>rezervacija</span></div><div class="stat"><b>${act.reduce((a,r)=>a+r.party,0)}</b><span>gostiju</span></div><div class="stat" style="${S.list.some(r=>r.status==='pending')?'background:rgba(255,159,46,.15)':''}"><b>${S.list.filter(r=>r.status==='pending').length}</b><span>čeka potvrdu</span></div>`;
  const pend=L.filter(r=>r.status==='pending'),on=L.filter(r=>r.status==='confirmed'||r.status==='seated'),rest=L.filter(r=>!ACTIVE.includes(r.status));
  let h='';
  if(!L.length)h=`<div class="empty"><b>${q?'Nema rezultata':'Nema rezervacija'}</b>${q?'':'Dodaj rezervaciju gumbom +'}</div>`;
  if(pend.length)h+=`<div class="sec"><span>⏳ Čeka potvrdu</span><span>${pend.length}</span></div>`+pend.map(resCard).join('');
  if(on.length)h+=`<div class="sec"><span>Večeras</span><span>${on.length}</span></div>`+on.map(resCard).join('');
  if(rest.length)h+=`<details><summary class="sec" style="cursor:pointer"><span>Otkazano / završeno</span><span>${rest.length} ▾</span></summary>${rest.map(resCard).join('')}</details>`;
  $('#list').innerHTML=h;
}
function stateAt(t,time){const r=S.list.find(r=>r.tableId===t.id&&ACTIVE.includes(r.status)&&time>=r.start&&time<r.end);return r}
function renderPlan(){
  if(!S.cfg)return;const sl=S.slots.length?S.slots:[1080];
  if(S.planTime==null){const now=zagrebToday();S.planTime=(S.date===now.date)?(sl.find(m=>m>=now.min-30)??sl[sl.length-1]):sl[0];}
  const ext=[...new Set([...sl,...S.list.map(r=>r.start)])].sort((a,b)=>a-b);
  $('#timebar').innerHTML=ext.map(m=>`<button class="chip" data-pt="${m}" aria-pressed="${m===S.planTime}">${fmt(m)}</button>`).join('');
  BurePlan.render($('#plan'),S.cfg,{state:t=>{const r=stateAt(t,S.planTime);return r?r.status:'free'},sub:t=>{const r=stateAt(t,S.planTime);return r?`${r.name.split(' ')[0].slice(0,10)} · ${r.party}`:`${t.min}–${t.max}`},onTap:tableSheet});
  const cur=$('#timebar [aria-pressed=true]');if(cur)cur.scrollIntoView({inline:'center',block:'nearest'});
}
function render(){renderHeader();if(S.tab==='list')renderList();if(S.tab==='plan')renderPlan();}

/* ---------- sheet ---------- */
function openSheet(html){const s=$('#sheet');s.innerHTML=html;s.classList.add('on');$('#scrim').classList.add('on');s.scrollTop=0}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on')}
$('#scrim').onclick=closeSheet;
const shHead=t=>`<div class="sh"><h3>${t}</h3><button class="x" data-close>✕</button></div>`;

function tableSheet(t){
  const rs=S.list.filter(r=>r.tableId===t.id).sort((a,b)=>a.start-b.start);
  const zone=(S.cfg.zones.find(z=>z.id===t.zone)||{name:{hr:''}}).name.hr;
  openSheet(shHead(`Stol ${esc(t.id)}`)+`<p class="small">${esc(zone)} · ${t.min}–${t.max} os.${t.vip?' · ★ VIP':''}</p>`+(rs.length?rs.map(resCard).join(''):'<div class="empty">Stol je slobodan cijelu večer.</div>')+`<button class="btn gold block" data-newfor="${esc(t.id)}">+ Rezerviraj ovaj stol</button>`);
}
function freeAt(tid,start,ignore){const e=start+S.cfg.durationMinutes;return !S.list.some(r=>r.tableId===tid&&ACTIVE.includes(r.status)&&r.id!==ignore&&start<r.end&&r.start<e)}
function tableOptions(sel,start,party,ignore){return S.cfg.tables.map(t=>{const ok=freeAt(t.id,start,ignore);const fit=!party||(party>=t.min&&party<=t.max);return `<option value="${esc(t.id)}" ${t.id===sel?'selected':''}>${esc(t.id)} · ${t.min}–${t.max} os.${ok?'':' · ZAUZET'}${fit?'':' · ne odgovara'}</option>`}).join('')}
function timeOptions(sel){const s=[...new Set([...(S.slots.length?S.slots:[]),sel].filter(x=>x!=null))].sort((a,b)=>a-b);return s.map(m=>`<option value="${m}" ${m===sel?'selected':''}>${fmt(m)}</option>`).join('')}

function editSheet(id){const r=S.list.find(x=>x.id===id);if(!r)return;
  openSheet(shHead(esc(r.name))+`<div class="meta small">#${esc(r.code)} · ${esc(r.phone||'')} ${r.email?'· '+esc(r.email):''} · izvor: ${esc(r.source)}</div>
  <form id="editForm"><div class="grid2"><div><label class="lbl">Vrijeme</label><select id="eStart">${timeOptions(r.start)}</select><input type="time" id="eCustom" style="margin-top:6px" aria-label="Drugo vrijeme"></div><div><label class="lbl">Osoba</label><input type="number" id="eParty" min="1" max="60" value="${r.party}"></div></div>
  <label class="lbl">Stol</label><select id="eTable">${tableOptions(r.tableId,r.start,r.party,r.id)}</select>
  <label class="lbl">Datum</label><input type="date" id="eDate" value="${r.date}">
  <label class="lbl">Status</label><div class="wrapx">${Object.keys(ST).map(s=>`<button type="button" class="chip" data-est="${s}" aria-pressed="${s===r.status}">${ST[s]}</button>`).join('')}</div>
  <label class="lbl">Interna bilješka (gost ne vidi)</label><textarea id="eNote" maxlength="400">${esc(r.staffNote||'')}</textarea>
  ${r.note?`<p class="small">Napomena gosta: ${esc(r.note)}</p>`:''}
  <div class="err" id="eErr"></div><button class="btn gold block">Spremi promjene</button></form>
  <div class="hist">${(r.history||[]).map(h=>`${new Date(h.at).toLocaleString('hr-HR',{timeZone:'Europe/Zagreb',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})} · ${h.by==='guest'?'gost':'osoblje'}: ${ST[h.to]||h.to}`).join('<br>')}<br>Kreirano ${new Date(r.createdAt).toLocaleString('hr-HR',{timeZone:'Europe/Zagreb'})}</div>`);
  let st=r.status;$$('[data-est]').forEach(b=>b.onclick=()=>{st=b.dataset.est;$$('[data-est]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#editForm').onsubmit=async e=>{e.preventDefault();const cu=$('#eCustom').value;let start=cu?toMin(cu):+$('#eStart').value;if(cu&&start<360)start+=1440;
    try{const x=await api('/update',{id:r.id,start,party:+$('#eParty').value,tableId:$('#eTable').value,status:st,staffNote:$('#eNote').value,date:$('#eDate').value});afterUpdate(x);}catch(err){$('#eErr').textContent=errMsg(err)}};
}
function afterUpdate(x){buzz(12);loadDay();loadUpcoming();
  if(x.wa){const r=x.reservation;openSheet(shHead(r.status==='confirmed'?'✓ Potvrđeno':'Odbijeno')+`<p>Pošalji gostu <b>${esc(r.name)}</b> poruku na WhatsApp — tekst je već napisan.</p><a class="btn wa block" href="${x.wa}" target="_blank" rel="noopener" data-close>💬 Pošalji na WhatsApp</a>${r.email?'<p class="small">E-mail gostu šalje se automatski (ako je e-mail postavljen).</p>':''}<button class="btn block" style="margin-top:10px" data-close>Zatvori</button>`);}
  else{closeSheet();toast('Spremljeno')}}

function newSheet(tableId,start){
  const sl=S.slots.length?S.slots:[1200];start=start??S.planTime??sl[0];
  openSheet(shHead('Nova rezervacija')+`<form id="newForm"><div class="grid2"><div><label class="lbl">Vrijeme</label><select id="nStart">${timeOptions(start)}</select><input type="time" id="nCustom" style="margin-top:6px" aria-label="Drugo vrijeme"></div><div><label class="lbl">Osoba</label><input type="number" id="nParty" min="1" max="60" value="2"></div></div>
   <label class="lbl">Stol</label><select id="nTable"><option value="any">Automatski (najbolji slobodni)</option>${tableOptions(tableId,start,0)}</select>
   <label class="lbl">Ime</label><input type="text" id="nName" maxlength="80" required>
   <label class="lbl">Mobitel</label><input type="tel" id="nPhone" maxlength="30" placeholder="091 …">
   <label class="lbl">Napomena</label><input type="text" id="nNote" maxlength="400">
   <label class="lbl">Izvor</label><div class="wrapx"><button type="button" class="chip" data-src="telefon" aria-pressed="true">📞 Telefon</button><button type="button" class="chip" data-src="uživo" aria-pressed="false">🚶 Uživo</button><button type="button" class="chip" data-src="instagram" aria-pressed="false">Instagram</button></div>
   <div class="err" id="nErr"></div><button class="btn gold block">Spremi (potvrđeno)</button></form>`);
  if(tableId)$('#nTable').value=tableId;
  let src='telefon';$$('[data-src]').forEach(b=>b.onclick=()=>{src=b.dataset.src;$$('[data-src]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const upd=()=>{const s=$('#nCustom').value?toMin($('#nCustom').value):+$('#nStart').value;const v=$('#nTable').value;$('#nTable').innerHTML=`<option value="any">Automatski (najbolji slobodni)</option>${tableOptions(v,s,+$('#nParty').value)}`;$('#nTable').value=v};
  ['#nStart','#nCustom','#nParty'].forEach(s=>$(s).addEventListener('change',upd));
  $('#newForm').onsubmit=async e=>{e.preventDefault();let s=$('#nCustom').value?toMin($('#nCustom').value):+$('#nStart').value;if($('#nCustom').value&&s<360)s+=1440;
    try{await api('/create',{date:S.date,start:s,party:+$('#nParty').value,tableId:$('#nTable').value,name:$('#nName').value,phone:$('#nPhone').value,note:$('#nNote').value,source:src});closeSheet();toast('Rezervacija dodana');buzz(12);loadDay();loadUpcoming()}catch(err){$('#nErr').textContent=errMsg(err)}};
}

/* ---------- settings ---------- */
let EC=null,edSel=null;
async function renderSettings(){
  const box=$('#tab-set');box.innerHTML='<div class="empty"><span class="spin"></span></div>';
  let d;try{d=await api('/config')}catch(e){box.innerHTML=`<div class="empty">${errMsg(e)}</div>`;return}
  EC=structuredClone(d.config);edSel=null;const env=d.env;
  const hrow=i=>{const h=EC.hours[i];return `<div class="hrow"><b>${DS[i]}</b><input type="time" data-hf="${i}" value="${h?h.from:'18:00'}" ${h?'':'disabled'}><input type="time" data-ht="${i}" value="${h?h.to:'22:00'}" ${h?'':'disabled'}><input type="checkbox" class="tog" data-ho="${i}" ${h?'checked':''} aria-label="Otvoreno"></div>`};
  const num=(k,l,u)=>`<div class="setrow"><span>${l}</span><span><input type="number" data-num="${k}" value="${EC[k]}" min="0"> <span class="small">${u}</span></span></div>`;
  box.innerHTML=`
  <div class="card"><h2>Obavijesti</h2><div class="envs"><span class="pill ${env.whatsapp?'st-confirmed':'st-cancelled'}">WhatsApp ${env.whatsapp?'✓':'nije postavljen'}</span><span class="pill ${env.email?'st-confirmed':'st-cancelled'}">E-mail ${env.email?'✓':'nije postavljen'}</span></div>
   <p class="small">Postavlja se u Netlifyju (Environment variables) — upute u README datoteci.</p><button class="btn block" id="testN">Pošalji testnu obavijest</button></div>
  <div class="card"><h2>Tlocrt</h2><p class="small">Povuci stolove prstom. Dodirni stol za uređivanje.</p>
   <div class="planbox"><svg id="edplan"></svg></div>
   <div class="grid2" style="margin-top:10px"><button class="btn" id="addT">+ Stol</button><button class="btn" id="addW">+ Element (šank, DJ…)</button></div>
   <div id="edpanel"></div></div>
  <div class="card"><h2>Zone</h2><div id="zones"></div><button class="btn sm" id="addZ" style="margin-top:8px">+ Zona</button></div>
  <div class="card"><h2>Termini za online rezervacije</h2><p class="small">Od – do = prvi i zadnji termin dolaska. Isključeno = taj dan se ne prima online.</p>${[1,2,3,4,5,6,0].map(hrow).join('')}
   <label class="lbl">Neradni datumi (odvojeni zarezom)</label><input type="text" id="closed" value="${(EC.closedDates||[]).join(', ')}" placeholder="2026-12-24, 2026-12-31"></div>
  <div class="card"><h2>Pravila</h2>
   ${num('slotMinutes','Korak termina','min')}${num('durationMinutes','Trajanje rezervacije (stol zauzet)','min')}${num('leadMinutes','Najkasnije online prije dolaska','min')}${num('daysAhead','Koliko dana unaprijed','dana')}${num('maxParty','Najviše osoba online','os.')}${num('holdMinutes','Stol držimo','min')}
   <div class="setrow"><span>Automatski potvrdi<br><span class="small">Bez ručne potvrde osoblja</span></span><input type="checkbox" class="tog" id="autoC" ${EC.autoConfirm?'checked':''}></div>
   <label class="lbl">Napomena gostima (HR)</label><textarea id="rulesHr">${esc(EC.rules&&EC.rules.hr||'')}</textarea>
   <label class="lbl">Napomena gostima (EN)</label><textarea id="rulesEn">${esc(EC.rules&&EC.rules.en||'')}</textarea></div>
  <div style="position:sticky;bottom:84px;z-index:5;padding:8px 0"><button class="btn gold block" id="saveCfg">💾 Spremi postavke i tlocrt</button></div>`;
  drawEditor();renderZones();
  $$('[data-ho]').forEach(c=>c.onchange=()=>{const i=c.dataset.ho;$(`[data-hf="${i}"]`).disabled=!c.checked;$(`[data-ht="${i}"]`).disabled=!c.checked});
  $('#testN').onclick=async()=>{try{const r=await api('/test-notify',{});toast(`WhatsApp: ${r.whatsapp?'poslano ✓':'nije poslano'} · E-mail: ${r.email?'poslano ✓':'nije poslano'}`)}catch(e){toast(errMsg(e))}};
  $('#addT').onclick=()=>{let n=1;while(EC.tables.some(t=>t.id==='N'+n))n++;const t={id:'N'+n,zone:(EC.zones[0]||{}).id||'',shape:'round',x:EC.plan.w/2,y:EC.plan.h/2,r:30,min:2,max:4};EC.tables.push(t);edSel={o:t,w:false};drawEditor()};
  $('#addW').onclick=()=>{const w={type:'bar',x:EC.plan.w/2-60,y:EC.plan.h/2-30,w:120,h:60,label:'ŠANK'};EC.plan.walls.push(w);edSel={o:w,w:true};drawEditor()};
  $('#addZ').onclick=()=>{EC.zones.push({id:'z'+Date.now().toString(36).slice(-4),name:{hr:'Nova zona',en:'New zone'}});renderZones()};
  $('#saveCfg').onclick=saveCfg;
}
function drawEditor(){
  BurePlan.render($('#edplan'),EC,{editable:true,state:t=>edSel&&edSel.o===t?'free sel':'free',onSelectObj:(o,w)=>{edSel={o,w};renderEdPanel();$$('#edplan .pl-t').forEach(g=>g.classList.toggle('sel',g.dataset.id===(w?null:o.id)))},onMove:()=>{drawEditor()}});
  renderEdPanel();
}
function renderEdPanel(){const p=$('#edpanel');if(!edSel){p.innerHTML='';return}const o=edSel.o;
  if(edSel.w){p.innerHTML=`<div class="edpanel"><div class="grid2"><div><label class="lbl">Natpis</label><input type="text" data-f="label" value="${esc(o.label)}"></div><div><label class="lbl">Vrsta</label><select data-f="type">${['bar','dj','door','wc','other'].map(x=>`<option ${x===o.type?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="lbl">Širina</label><input type="number" data-f="w" value="${o.w}"></div><div><label class="lbl">Visina</label><input type="number" data-f="h" value="${o.h}"></div></div><button class="btn bad sm" style="margin-top:10px" id="delO">Obriši element</button></div>`;}
  else{const round=o.shape==='round'||o.shape==='barrel';p.innerHTML=`<div class="edpanel"><div class="grid2"><div><label class="lbl">Oznaka</label><input type="text" data-f="id" value="${esc(o.id)}" maxlength="8"></div><div><label class="lbl">Zona</label><select data-f="zone">${EC.zones.map(z=>`<option value="${esc(z.id)}" ${z.id===o.zone?'selected':''}>${esc(z.name.hr)}</option>`).join('')}</select></div>
   <div><label class="lbl">Oblik</label><select data-f="shape">${[['round','Okrugli'],['barrel','Bačva'],['rect','Pravokutni'],['booth','Separe']].map(([v,l])=>`<option value="${v}" ${v===o.shape?'selected':''}>${l}</option>`).join('')}</select></div>
   ${round?`<div><label class="lbl">Polumjer</label><input type="number" data-f="r" value="${o.r||30}"></div>`:`<div><label class="lbl">Širina × visina</label><div style="display:flex;gap:6px"><input type="number" data-f="w" value="${o.w||100}"><input type="number" data-f="h" value="${o.h||60}"></div></div>`}
   <div><label class="lbl">Min. osoba</label><input type="number" data-f="min" value="${o.min}" min="1"></div><div><label class="lbl">Max. osoba</label><input type="number" data-f="max" value="${o.max}" min="1"></div></div>
   <label class="check"><input type="checkbox" data-f="vip" ${o.vip?'checked':''}> VIP stol (★)</label><button class="btn bad sm" style="margin-top:10px" id="delO">Obriši stol</button></div>`;}
  $$('#edpanel [data-f]').forEach(inp=>inp.onchange=()=>{const f=inp.dataset.f;let v=inp.type==='checkbox'?inp.checked:inp.type==='number'?+inp.value:inp.value;
    if(f==='shape'){const was=o.shape==='round'||o.shape==='barrel',now=v==='round'||v==='barrel';if(was&&!now){o.w=v==='booth'?180:100;o.h=v==='booth'?110:64;delete o.r}if(!was&&now){o.r=30;delete o.w;delete o.h}}
    o[f]=v;drawEditor();});
  $('#delO').onclick=()=>{if(!arm($('#delO'),'Tapni ponovno za brisanje'))return;if(edSel.w)EC.plan.walls.splice(EC.plan.walls.indexOf(o),1);else EC.tables.splice(EC.tables.indexOf(o),1);edSel=null;drawEditor()};
}
function renderZones(){$('#zones').innerHTML=EC.zones.map((z,i)=>`<div class="grid2" style="margin-bottom:8px"><input type="text" data-zh="${i}" value="${esc(z.name.hr)}" aria-label="Naziv HR"><input type="text" data-ze="${i}" value="${esc(z.name.en)}" aria-label="Naziv EN"></div>`).join('');
  $$('[data-zh]').forEach(x=>x.onchange=()=>{EC.zones[x.dataset.zh].name.hr=x.value});$$('[data-ze]').forEach(x=>x.onchange=()=>{EC.zones[x.dataset.ze].name.en=x.value});}
async function saveCfg(){
  for(let i=0;i<7;i++){const on=$(`[data-ho="${i}"]`).checked;EC.hours[i]=on?{from:$(`[data-hf="${i}"]`).value,to:$(`[data-ht="${i}"]`).value}:null}
  $$('[data-num]').forEach(x=>EC[x.dataset.num]=+x.value);EC.autoConfirm=$('#autoC').checked;
  EC.closedDates=$('#closed').value.split(/[,\s]+/).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d));
  EC.rules={hr:$('#rulesHr').value,en:$('#rulesEn').value};
  try{const r=await api('/config',{config:EC});S.cfg=r.config;toast('✓ Postavke spremljene');buzz(12)}catch(e){toast(errMsg(e))}
}

/* ---------- actions ---------- */
async function setStatus(id,status,btn){
  if(status==='declined'&&btn&&!arm(btn,'Tapni ponovno'))return;
  try{const x=await api('/update',{id,status});afterUpdate(x)}catch(e){toast(errMsg(e))}
}
document.addEventListener('click',e=>{const x=e.target;
  const a=x.closest('[data-act]');if(a){setStatus(a.dataset.id,a.dataset.act,a);return}
  const ed=x.closest('[data-edit]');if(ed){editSheet(ed.dataset.edit);return}
  if(x.closest('[data-close]')){if(x.closest('a[data-close]'))setTimeout(closeSheet,300);else closeSheet();return}
  const sd=x.closest('[data-date]');if(sd){buzz(6);setDate(sd.dataset.date);return}
  const pt=x.closest('[data-pt]');if(pt){S.planTime=+pt.dataset.pt;renderPlan();return}
  const nf=x.closest('[data-newfor]');if(nf){newSheet(nf.dataset.newfor);return}
  const tb=x.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;$$('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b===tb));['list','plan','set'].forEach(t=>$('#tab-'+t).hidden=t!==S.tab);if(S.tab==='set')renderSettings();else render();scrollTo(0,0);return}
});
$('#newBtn').onclick=()=>{if(!S.cfg)return;newSheet(null)};
$('#prev').onclick=()=>setDate(addDays(S.date,-1));$('#next').onclick=()=>setDate(addDays(S.date,1));
$('#todayBtn').onclick=()=>{const i=document.createElement('input');i.type='date';i.value=S.date;i.style.position='fixed';i.style.opacity=0;document.body.appendChild(i);i.onchange=()=>{if(i.value)setDate(i.value);i.remove()};i.onblur=()=>setTimeout(()=>i.remove(),300);try{i.showPicker()}catch(e){i.click()}};
$('#search').oninput=e=>{S.q=e.target.value;renderList()};

function start(){$('#login').hidden=true;$('#app').hidden=false;
  const h=location.hash.slice(1);S.date=/^\d{4}-\d{2}-\d{2}$/.test(h)?h:zagrebToday().date;renderHeader();loadDay();loadUpcoming();
  setInterval(()=>{if(document.visibilityState==='visible'&&!$('#sheet').classList.contains('on')){if(S.tab!=='set')loadDay(true);loadUpcoming()}},30000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.tab!=='set'){loadDay(true);loadUpcoming()}});
}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(/^\d{4}-\d{2}-\d{2}$/.test(h)&&h!==S.date&&PIN){S.date=h;renderHeader();renderStrip();loadDay()}});
if(PIN){api('/login').then(start).catch(()=>logout())}else logout();
})();
</script>
</body>
</html>
